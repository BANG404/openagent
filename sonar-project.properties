sonar.projectKey=openagent
sonar.projectName=OpenAgent
sonar.host.url=http://192.168.123.47:9000

sonar.sources=src,scripts,src-tauri,sdk/typescript/src,sdk/harness-typescript/src,sdk/rust
sonar.tests=tests,sdk/typescript/tests,sdk/harness-typescript/tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,**/build/**,**/coverage/**,**/dist/**,sdk/**/target/**
sonar.test.inclusions=tests/**/*.js,tests/**/*.ts,sdk/typescript/tests/**/*.ts,sdk/harness-typescript/tests/**/*.ts
sonar.javascript.lcov.reportPaths=coverage/sonar/host/lcov.info,coverage/sonar/sdk-typescript/lcov.info,coverage/sonar/sdk-harness-typescript/lcov.info

# Rust orchestration and compatibility boundaries intentionally keep their state
# transitions together; the Rust quality gate covers behavior and formatting.
sonar.issue.ignore.multicriteria=rustComplexity
sonar.issue.ignore.multicriteria.rustComplexity.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.rustComplexity.resourceKey=**/*.rs
