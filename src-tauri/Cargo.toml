[package]
name = "openagent"
default-run = "openagent"
version = "0.47.2-beta.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The pinned Codex Windows sandbox SDK revision requires proxy support from
# these upstream forks. Cargo patches are owned by the embedding workspace, so
# keep them here before advancing the private SDK gitlink.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openagent_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
openagent-app = { path = "../sdk/rust/openagent-app" }
openagent-runtime = { path = "../sdk/rust/openagent-runtime" }
anyhow = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tauri-plugin-i18n = "2"
tracing = "0.1"
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Match Tauri's pinned native-effect implementation so the host can choose
# platform fallbacks without linking a second window-vibrancy version.
window-vibrancy = "=0.6.0"

[target.'cfg(windows)'.dependencies]
# Keep the Codex Windows sandbox graph compatible with the repository's Rust
# 1.95 toolchain until the stable Rama release lowers its 1.96 MSRV.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"
