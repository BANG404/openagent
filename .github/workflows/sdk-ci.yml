name: Public SDK CI

on:
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: Immutable commit from BANG404/openagent-sdk
        required: true
        type: string
      full:
        description: Run release-grade workspace and cross-platform qualification
        required: true
        default: true
        type: boolean
      rust_packages:
        description: Comma-separated Rust packages for fast validation, or workspace
        required: true
        default: workspace
        type: string
      rust:
        description: Run Rust formatting, lint, and workspace tests
        required: true
        default: true
        type: boolean
      linux_sandbox:
        description: Exercise the Linux process sandbox
        required: true
        default: true
        type: boolean
      macos_sandbox:
        description: Exercise the macOS process sandbox
        required: true
        default: true
        type: boolean
      windows_sandbox:
        description: Exercise the Windows offline-account process sandbox
        required: true
        default: true
        type: boolean
      typescript:
        description: Check and test the TypeScript SDK
        required: true
        default: true
        type: boolean
      harness:
        description: Check the Harness client on Linux and Windows
        required: true
        default: true
        type: boolean
      host:
        description: Check compatibility with the public host
        required: true
        default: true
        type: boolean
      publish_dev:
        description: Refresh public development Runtime and client artifacts after full validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-sdk-ci-${{ inputs.sdk_sha }}
  cancel-in-progress: false

env:
  SDK_REPOSITORY: BANG404/openagent-sdk
  SDK_STATUS_CONTEXT: ${{ inputs.full && 'Public SDK CI' || 'Public SDK Fast CI' }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  pending:
    name: Report pending status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate SDK revision
        env:
          SDK_SHA: ${{ inputs.sdk_sha }}
        run: |
          if [[ ! "$SDK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sdk_sha must be a full lowercase commit SHA."
            exit 1
          fi

      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk

      - name: Report pending SDK status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          SDK_CI_FULL: ${{ inputs.full }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tier=fast
          if [[ "$SDK_CI_FULL" == "true" ]]; then tier=full; fi
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$SDK_REPOSITORY/commits/$SDK_SHA" -o /dev/null
          jq -n \
            --arg state pending \
            --arg context "$SDK_STATUS_CONTEXT" \
            --arg description "Public SDK $tier validation is running" \
            --arg target_url "$TARGET_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' |
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$SDK_REPOSITORY/statuses/$SDK_SHA" \
              --data-binary @- -o /dev/null

  rust-format:
    name: Rust formatting
    if: inputs.rust
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDK_DIAGNOSTIC_NAME: Rust formatting
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: &reporter
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-checks: write
          permission-contents: read
          permission-statuses: write
      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ inputs.sdk_sha }}
          path: sdk
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: sdk
        run: |
          if ! cargo fmt --all -- --check >"$RUNNER_TEMP/sdk-rust-format.log" 2>&1; then
            echo "sdk-rust-format.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Rust formatting failed; private diagnostic output was suppressed."
            exit 1
          fi
      - &checkout-private-diagnostic-reporter
        name: Check out private diagnostic reporter
        if: failure()
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .public-ci
          persist-credentials: false
          sparse-checkout: scripts/report-private-sdk-diagnostic.mjs
          sparse-checkout-cone-mode: false
      - &report-private-diagnostic
        name: Report diagnostic to private SDK
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .public-ci/scripts/report-private-sdk-diagnostic.mjs

  rust-clippy:
    name: Rust lint
    if: inputs.rust
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: Rust lint
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: &sdk-checkout
          repository: BANG404/openagent-sdk
          ref: ${{ inputs.sdk_sha }}
          path: sdk
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with: &rust-cache
          workspaces: ./sdk -> target
          shared-key: public-sdk-dependencies
          cache-targets: false
      - &install-private-sccache
        name: Install private compiler cache client
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
          disable_annotations: true
      - &configure-private-sccache
        name: Configure private compiler cache
        shell: bash
        env:
          SCCACHE_ACCESS_KEY: ${{ secrets.OPENAGENT_SCCACHE_ACCESS_KEY }}
          SCCACHE_SECRET_KEY: ${{ secrets.OPENAGENT_SCCACHE_SECRET_KEY }}
          SCCACHE_PRIVATE_BUCKET: ${{ vars.OPENAGENT_SCCACHE_BUCKET }}
          SCCACHE_PRIVATE_ENDPOINT: ${{ vars.OPENAGENT_SCCACHE_ENDPOINT }}
        run: |
          if [[ -z "$SCCACHE_ACCESS_KEY" || -z "$SCCACHE_SECRET_KEY" \
            || -z "$SCCACHE_PRIVATE_BUCKET" || -z "$SCCACHE_PRIVATE_ENDPOINT" ]]; then
            echo "::error::Private sccache requires an endpoint, bucket, and scoped credentials."
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$SCCACHE_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$SCCACHE_SECRET_KEY"
          export SCCACHE_BUCKET="$SCCACHE_PRIVATE_BUCKET"
          export SCCACHE_ENDPOINT="$SCCACHE_PRIVATE_ENDPOINT"
          export SCCACHE_REGION=auto
          export SCCACHE_S3_USE_SSL=true
          export SCCACHE_S3_KEY_PREFIX=openagent-sdk/v1
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          sccache_server_port=34326
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sccache_server_port="$(
              # shellcheck disable=SC2016
              powershell.exe -NoProfile -NonInteractive -Command \
                '$listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0); $listener.Start(); ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port; $listener.Stop()'
            )"
            sccache_server_port="${sccache_server_port//$'\r'/}"
            if [[ ! "$sccache_server_port" =~ ^[0-9]+$ ]]; then
              echo "::error::Failed to select an available Windows sccache port."
              exit 1
            fi
          else
            export SCCACHE_SERVER_PORT="$sccache_server_port"
            sccache --stop-server >/dev/null 2>&1 || true
            sleep 1
          fi
          export SCCACHE_SERVER_PORT="$sccache_server_port"
          {
            echo "AWS_ACCESS_KEY_ID=$SCCACHE_ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$SCCACHE_SECRET_KEY"
            echo "SCCACHE_BUCKET=$SCCACHE_PRIVATE_BUCKET"
            echo "SCCACHE_ENDPOINT=$SCCACHE_PRIVATE_ENDPOINT"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "SCCACHE_S3_KEY_PREFIX=openagent-sdk/v1"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            echo "SCCACHE_SERVER_PORT=$sccache_server_port"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::Private sccache did not start; continuing without compiler cache."
          fi
      - name: Lint Rust workspace
        working-directory: sdk
        env:
          SDK_CI_FULL: ${{ inputs.full }}
          SDK_RUST_PACKAGES: ${{ inputs.rust_packages }}
        run: |
          args=()
          if [[ "$SDK_RUST_PACKAGES" == "workspace" ]]; then
            args+=(--workspace)
          elif [[ "$SDK_RUST_PACKAGES" =~ ^(openagent-protocol|openagent-runtime|openagent-app|openagent-server)(,(openagent-protocol|openagent-runtime|openagent-app|openagent-server))*$ ]]; then
            IFS=',' read -ra packages <<< "$SDK_RUST_PACKAGES"
            for package in "${packages[@]}"; do args+=(-p "$package"); done
          else
            echo "::error::Invalid private SDK Rust package selection."
            exit 1
          fi
          if [[ "$SDK_CI_FULL" == "true" ]]; then args+=(--all-targets --all-features); fi
          if ! cargo clippy "${args[@]}" >"$RUNNER_TEMP/sdk-rust-clippy.log" 2>&1; then
            echo "sdk-rust-clippy.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Rust lint failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  rust-tests:
    name: Rust tests
    if: inputs.rust
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: Rust tests
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - *install-private-sccache
      - *configure-private-sccache
      - name: Test Rust workspace
        working-directory: sdk
        env:
          SDK_CI_FULL: ${{ inputs.full }}
          SDK_RUST_PACKAGES: ${{ inputs.rust_packages }}
        run: |
          args=()
          if [[ "$SDK_RUST_PACKAGES" == "workspace" ]]; then
            args+=(--workspace)
          elif [[ "$SDK_RUST_PACKAGES" =~ ^(openagent-protocol|openagent-runtime|openagent-app|openagent-server)(,(openagent-protocol|openagent-runtime|openagent-app|openagent-server))*$ ]]; then
            IFS=',' read -ra packages <<< "$SDK_RUST_PACKAGES"
            for package in "${packages[@]}"; do args+=(-p "$package"); done
          else
            echo "::error::Invalid private SDK Rust package selection."
            exit 1
          fi
          if [[ "$SDK_CI_FULL" == "true" ]]; then args+=(--all-features); fi
          if ! cargo test "${args[@]}" >"$RUNNER_TEMP/sdk-rust-test.log" 2>&1; then
            echo "sdk-rust-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Rust tests failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  linux-process-sandbox:
    name: Linux process sandbox
    if: inputs.linux_sandbox
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: Linux process sandbox
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - *install-private-sccache
      - *configure-private-sccache
      - name: Install Linux process sandbox dependency
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y bubblewrap >/dev/null
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null
          fi
      - name: Exercise the Bubblewrap filesystem boundary
        working-directory: sdk
        env:
          OPENAGENT_BWRAP_INTEGRATION: "1"
        run: |
          if ! cargo test -p openagent-runtime bubblewrap_writes_inside_workspace_and_hides_outside_files >"$RUNNER_TEMP/sdk-bubblewrap-test.log" 2>&1; then
            echo "sdk-bubblewrap-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            diagnostic="$(grep -oE 'OPENAGENT_LINUX_SANDBOX_DIAGNOSTIC=[a-z-]+' "$RUNNER_TEMP/sdk-bubblewrap-test.log" | tail -n 1 || true)"
            if [[ -n "$diagnostic" ]]; then
              echo "::error::Linux process sandbox test failed: $diagnostic. Private diagnostic output was suppressed."
            else
              echo "::error::Linux process sandbox test failed; private diagnostic output was suppressed."
            fi
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  macos-process-sandbox:
    name: macOS process sandbox
    if: inputs.macos_sandbox
    needs: pending
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: macOS process sandbox
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - *install-private-sccache
      - *configure-private-sccache
      - name: Exercise the Seatbelt filesystem boundary
        working-directory: sdk
        env:
          OPENAGENT_SEATBELT_INTEGRATION: "1"
        run: |
          if ! cargo test -p openagent-runtime seatbelt_writes_inside_workspace_and_hides_outside_files >"$RUNNER_TEMP/sdk-seatbelt-test.log" 2>&1; then
            echo "sdk-seatbelt-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::macOS process sandbox test failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  windows-process-sandbox:
    name: Windows process sandbox
    if: inputs.windows_sandbox
    needs: pending
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: Windows process sandbox
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - *install-private-sccache
      - *configure-private-sccache
      - name: Enable Windows Firewall profiles
        shell: pwsh
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          if (Get-NetFirewallProfile | Where-Object { -not $_.Enabled }) {
            Write-Error "Windows Firewall profiles could not be enabled for the sandbox boundary test."
            exit 1
          }
      - name: Build pinned Windows sandbox helpers
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          $metadata = $null
          foreach ($attempt in 1..3) {
            $metadataJson = cargo metadata --locked --format-version 1 --manifest-path sdk/Cargo.toml 2>> $log
            if ($LASTEXITCODE -eq 0) {
              try {
                $metadata = $metadataJson | ConvertFrom-Json -ErrorAction Stop
                break
              } catch {
                "Cargo metadata returned invalid JSON: $($_.Exception.Message)" | Add-Content $log
              }
            }
            if ($attempt -lt 3) {
              "Cargo metadata attempt $attempt failed; retrying." | Add-Content $log
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $metadata) {
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            Write-Error "Windows sandbox dependency metadata failed; private diagnostic output was suppressed."
            exit 1
          }
          $package = $metadata.packages | Where-Object {
            $_.name -eq "codex-windows-sandbox" -and $_.source -like "git+*"
          } | Select-Object -First 1
          if (-not $package) {
            "Pinned codex-windows-sandbox package was not found." | Add-Content $log
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            exit 1
          }
          cargo build --locked --manifest-path $package.manifest_path --package codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner --target-dir sdk/target *>> $log
          if ($LASTEXITCODE -ne 0) {
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            Write-Error "Windows sandbox helper build failed; private diagnostic output was suppressed."
            exit 1
          }
      - name: Exercise Windows Firewall and WFP boundaries
        shell: pwsh
        env:
          OPENAGENT_WINDOWS_WFP_INTEGRATION: "1"
          OPENAGENT_WINDOWS_NETWORK_PRIVATE_DIAGNOSTIC: "1"
          SBX_DEBUG: "1"
        run: |
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          $tests = @(
            "elevated_offline_account_firewall_blocks_non_loopback_network_access",
            "elevated_offline_account_wfp_blocks_dns_network_access"
          )
          foreach ($test in $tests) {
            cargo test --manifest-path sdk/Cargo.toml -p openagent-server $test -- --test-threads=1 *>> $log
            if ($LASTEXITCODE -ne 0) {
              "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
              $diagnostic = Select-String -Path $log -Pattern 'OPENAGENT_WFP_DIAGNOSTIC=[a-z-]+' -AllMatches |
                ForEach-Object { $_.Matches.Value } |
                Select-Object -Last 1
              if ($diagnostic) {
                Write-Error "Windows process sandbox test failed: $diagnostic. Private diagnostic output was suppressed."
              } else {
                Write-Error "Windows process sandbox test failed; private diagnostic output was suppressed."
              }
              exit 1
            }
          }
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  typescript:
    name: TypeScript SDK
    if: inputs.typescript
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SDK_DIAGNOSTIC_NAME: TypeScript SDK
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Cache public Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: public-sdk-bun-${{ runner.os }}-typescript-${{ hashFiles('sdk/typescript/bun.lock') }}
          restore-keys: public-sdk-bun-${{ runner.os }}-typescript-
      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: |
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/sdk-typescript-install.log" 2>&1; then
            echo "sdk-typescript-install.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::TypeScript SDK dependency installation failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check TypeScript SDK
        working-directory: sdk/typescript
        run: |
          if ! bun run check >"$RUNNER_TEMP/sdk-typescript-check.log" 2>&1; then
            echo "sdk-typescript-check.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::TypeScript SDK checking failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          if ! bun test >"$RUNNER_TEMP/sdk-typescript-test.log" 2>&1; then
            echo "sdk-typescript-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::TypeScript SDK tests failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  harness-client:
    name: Harness client (${{ matrix.name }})
    if: inputs.harness
    needs: pending
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && '[{"name":"Linux","runner":"\"ubuntu-24.04\""},{"name":"Windows","runner":"\"windows-2025\""}]' || '[{"name":"Linux","runner":"\"ubuntu-24.04\""}]') }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: Harness client (${{ matrix.name }})
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - *install-private-sccache
      - *configure-private-sccache
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Cache public Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: public-sdk-bun-${{ runner.os }}-harness-${{ hashFiles('sdk/harness-typescript/bun.lock') }}
          restore-keys: public-sdk-bun-${{ runner.os }}-harness-
      - name: Build harness server
        if: runner.os != 'Windows'
        shell: bash
        working-directory: sdk
        run: |
          if ! cargo build -p openagent-server >"$RUNNER_TEMP/sdk-harness-server.log" 2>&1; then
            echo "sdk-harness-server.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness server build failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Build harness server on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: sdk
        run: |
          $log = "$env:RUNNER_TEMP/sdk-harness-server.log"
          cargo build -p openagent-server *>> $log
          if ($LASTEXITCODE -ne 0) {
            "sdk-harness-server.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            Write-Error "Harness server build failed; private diagnostic output was suppressed."
            exit 1
          }
      - name: Install harness dependencies
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/sdk-harness-install.log" 2>&1; then
            echo "sdk-harness-install.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness dependency installation failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check harness types
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun run check >"$RUNNER_TEMP/sdk-harness-check.log" 2>&1; then
            echo "sdk-harness-check.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness type checking failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Verify harness OpenAPI
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun run check:openapi >"$RUNNER_TEMP/sdk-harness-openapi.log" 2>&1; then
            echo "sdk-harness-openapi.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness OpenAPI verification failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Test harness client
        shell: bash
        working-directory: sdk/harness-typescript
        env:
          OPENAGENT_SERVER_BINARY: ${{ github.workspace }}/sdk/target/debug/openagent-server${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if ! bun test >"$RUNNER_TEMP/sdk-harness-test.log" 2>&1; then
            echo "sdk-harness-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness client tests failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Build harness package
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun run build >"$RUNNER_TEMP/sdk-harness-build.log" 2>&1; then
            echo "sdk-harness-build.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness package build failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Verify harness package contents
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun pm pack --dry-run >"$RUNNER_TEMP/sdk-harness-pack.log" 2>&1; then
            echo "sdk-harness-pack.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness package verification failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  host-compatibility:
    name: Public host compatibility
    if: inputs.host
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDK_DIAGNOSTIC_NAME: Public host compatibility
    steps:
      - name: Check out public host
        uses: actions/checkout@v7
        with:
          path: host
          submodules: false
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ inputs.sdk_sha }}
          path: host/sdk
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Materialize frontendDist for Tauri macros
        run: |
          node -e "require('fs').mkdirSync('host/build', { recursive: true })"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            libcap-dev \
            libssl-dev \
            pkg-config >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - name: Materialize Runtime sidecar for Tauri macros
        working-directory: host
        run: node scripts/prepare-runtime-server.mjs --placeholder
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./host/src-tauri -> target
          shared-key: public-sdk-host-dependencies
          cache-targets: false
      - *install-private-sccache
      - *configure-private-sccache
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Cache public Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: public-sdk-bun-${{ runner.os }}-host-${{ hashFiles('host/bun.lock') }}
          restore-keys: public-sdk-bun-${{ runner.os }}-host-
      - name: Install host dependencies
        working-directory: host
        run: |
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/sdk-host-install.log" 2>&1; then
            echo "sdk-host-install.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Host dependency installation failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check public frontend compatibility
        working-directory: host
        run: |
          if ! bun run check >"$RUNNER_TEMP/sdk-host-frontend.log" 2>&1; then
            echo "sdk-host-frontend.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Public frontend compatibility failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Prepare public host Linux sidecar
        working-directory: host
        env:
          SDK_CI_FULL: ${{ inputs.full }}
        run: |
          if [[ "$SDK_CI_FULL" == "true" ]]; then
            if ! node scripts/prepare-linux-sandbox-helper.mjs --profile release --github-env >"$RUNNER_TEMP/sdk-host-sidecar.log" 2>&1; then
              echo "sdk-host-sidecar.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
              echo "::error::Host Linux sidecar preparation failed; private diagnostic output was suppressed."
              exit 1
            fi
          else
            target_triple="$(rustc -vV | sed -n 's/^host: //p')"
            mkdir -p src-tauri/binaries
            touch "src-tauri/binaries/bwrap-$target_triple"
          fi
      - name: Check public native compatibility
        working-directory: host
        env:
          SDK_CI_FULL: ${{ inputs.full }}
        run: |
          args=(--manifest-path src-tauri/Cargo.toml)
          if [[ "$SDK_CI_FULL" == "true" ]]; then args+=(--all-targets); fi
          if ! cargo check "${args[@]}" >"$RUNNER_TEMP/sdk-host-native.log" 2>&1; then
            echo "sdk-host-native.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Public native compatibility failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  required:
    name: Required SDK
    if: always()
    needs:
      - pending
      - rust-format
      - rust-clippy
      - rust-tests
      - linux-process-sandbox
      - macos-process-sandbox
      - windows-process-sandbox
      - typescript
      - harness-client
      - host-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected SDK capability to pass
        id: verify
        continue-on-error: true
        env:
          CHANGES_RESULT: ${{ needs.pending.result }}
          CI_RESULT_MODULES: rust-format,rust-clippy,rust-tests,linux-process-sandbox,macos-process-sandbox,windows-process-sandbox,typescript,harness-client,host-compatibility
          RUST_FORMAT_SELECTED: ${{ inputs.rust }}
          RUST_FORMAT_RESULT: ${{ needs.rust-format.result }}
          RUST_CLIPPY_SELECTED: ${{ inputs.rust }}
          RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          RUST_TESTS_SELECTED: ${{ inputs.rust }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          LINUX_PROCESS_SANDBOX_SELECTED: ${{ inputs.linux_sandbox }}
          LINUX_PROCESS_SANDBOX_RESULT: ${{ needs.linux-process-sandbox.result }}
          MACOS_PROCESS_SANDBOX_SELECTED: ${{ inputs.macos_sandbox }}
          MACOS_PROCESS_SANDBOX_RESULT: ${{ needs.macos-process-sandbox.result }}
          WINDOWS_PROCESS_SANDBOX_SELECTED: ${{ inputs.windows_sandbox }}
          WINDOWS_PROCESS_SANDBOX_RESULT: ${{ needs.windows-process-sandbox.result }}
          TYPESCRIPT_SELECTED: ${{ inputs.typescript }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          HARNESS_CLIENT_SELECTED: ${{ inputs.harness }}
          HARNESS_CLIENT_RESULT: ${{ needs.harness-client.result }}
          HOST_COMPATIBILITY_SELECTED: ${{ inputs.host }}
          HOST_COMPATIBILITY_RESULT: ${{ needs.host-compatibility.result }}
        run: node scripts/verify-ci-results.mjs
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Report final SDK status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          SDK_CI_FULL: ${{ inputs.full }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          tier=fast
          if [[ "$SDK_CI_FULL" == "true" ]]; then tier=full; fi
          description="Public SDK $tier validation failed"
          if [[ "$VERIFY_OUTCOME" == success ]]; then
            state=success
            description="Public SDK $tier validation passed"
          fi
          jq -n \
            --arg state "$state" \
            --arg context "$SDK_STATUS_CONTEXT" \
            --arg description "$description" \
            --arg target_url "$TARGET_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' |
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$SDK_REPOSITORY/statuses/$SDK_SHA" \
              --data-binary @- -o /dev/null
          if [[ "$state" != success ]]; then
            exit 1
          fi

  development-runtime:
    name: Development Runtime (${{ matrix.name }})
    if: inputs.publish_dev && inputs.full
    needs: required
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: '"ubuntu-24.04"'
            runner_os: Linux
            source: target/release/openagent-server
            artifact: openagent-server-linux-x64
          - name: Windows x64
            runner: '"windows-2025"'
            runner_os: Windows
            source: target/release/openagent-server.exe
            artifact: openagent-server-windows-x64.exe
          - name: macOS arm64
            runner: '"macos-14"'
            runner_os: macOS
            source: target/release/openagent-server
            artifact: openagent-server-macos-arm64
          - name: macOS x64
            runner: '"macos-15-intel"'
            runner_os: macOS
            source: target/release/openagent-server
            artifact: openagent-server-macos-x64
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Runtime build dependencies
        if: matrix.runner_os == 'Linux'
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y binutils libcap-dev pkg-config >/dev/null
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - *install-private-sccache
      - *configure-private-sccache
      - name: Prepare pinned Linux sandbox helper
        if: matrix.runner_os == 'Linux'
        working-directory: sdk
        shell: bash
        run: |
          if ! node scripts/prepare-linux-sandbox-helper.mjs --profile release --github-env \
            >"$RUNNER_TEMP/sdk-development-runtime.log" 2>&1; then
            echo "::error::Linux development Runtime sandbox helper build failed; diagnostic output was suppressed."
            exit 1
          fi
      - name: Build release Runtime server
        working-directory: sdk
        run: cargo build --release -p openagent-server
      - name: Package development Runtime server
        working-directory: sdk
        run: node scripts/package-server.mjs "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-development-runtime-${{ matrix.artifact }}
          path: sdk/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  development-clients:
    name: Development clients
    if: inputs.publish_dev && inputs.full
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Build public development clients
        shell: bash
        env:
          SDK_SHA: ${{ inputs.sdk_sha }}
        run: |
          short_sha="${SDK_SHA:0:12}"
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' sdk/rust/openagent-server/Cargo.toml | head -n 1)"
          version="${base_version%%-*}-dev.$short_sha"
          mkdir -p sdk-development-clients
          printf '%s\n' "$version" > sdk-development-clients/version.txt
          tar --format=ustar -C sdk/typescript -czf \
            "$GITHUB_WORKSPACE/sdk-development-clients/openagent-typescript-sdk.tar.gz" \
            src package.json tsconfig.json tsconfig.build.json README.md LICENSE
          cd sdk/harness-typescript
          bun install --frozen-lockfile
          npm pkg set "version=$version"
          bun run build
          npm pack --pack-destination "$GITHUB_WORKSPACE/sdk-development-clients"
          cd "$GITHUB_WORKSPACE"
          mv sdk-development-clients/bang404-openagent-harness-*.tgz \
            sdk-development-clients/openagent-harness.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-development-clients
          path: sdk-development-clients/*
          if-no-files-found: error
          retention-days: 1

  publish-development:
    name: Publish development Runtime and clients
    if: inputs.publish_dev && inputs.full
    needs: [required, development-runtime, development-clients]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK metadata
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install signing CLI
        run: bun install --frozen-lockfile
      - name: Download qualified development artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-development-*
          path: sdk-development-components
          merge-multiple: true
      - name: Require the latest private SDK main revision
        id: current
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
        shell: bash
        run: |
          main_sha="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SDK_REPOSITORY/commits/main" | jq -er '.sha')"
          if [[ "$main_sha" != "$SDK_SHA" ]]; then
            echo "::notice::Skipping development publication because SDK main advanced to $main_sha."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and sign development manifests
        if: steps.current.outputs.publish == 'true'
        env:
          SDK_SHA: ${{ inputs.sdk_sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          version="$(cat sdk-development-components/version.txt)"
          protocol="$(sed -n 's/^pub const SDK_PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);/\1/p' sdk/rust/openagent-protocol/src/lib.rs)"
          node sdk/scripts/server-artifacts.mjs \
            --artifacts sdk-development-components \
            --output sdk-development-components/openagent-sdk-manifest.json \
            --version "$version" \
            --protocol "$protocol" \
            --sdk-sha "$SDK_SHA"
          node scripts/sdk-dev-artifacts.mjs \
            --artifacts sdk-development-components \
            --output sdk-development-components/sdk-dev-manifest.json \
            --sdk-sha "$SDK_SHA" \
            --version "$version"
          bun scripts/tauri.mjs signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "" \
            sdk-development-components/openagent-sdk-manifest.json
          bun scripts/tauri.mjs signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "" \
            sdk-development-components/sdk-dev-manifest.json
          rm sdk-development-components/version.txt
      - name: Refresh public development channel
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDK_SHA: ${{ inputs.sdk_sha }}
        shell: bash
        run: |
          channel=runtime-dev
          notes="Signed development Runtime and public clients for immutable SDK commit $SDK_SHA."
          api="https://api.github.com/repos/$GH_REPO"
          release_json="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/releases/tags/$channel" 2>/dev/null || true)"
          if [[ -n "$release_json" ]] && jq -e '.id' >/dev/null <<<"$release_json"; then
            release_id="$(jq -er '.id' <<<"$release_json")"
            upload_url="$(jq -er '.upload_url | split("{")[0]' <<<"$release_json")"
            jq -n --arg body "$notes" '{body: $body, prerelease: true}' |
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/releases/$release_id" \
                -H "Content-Type: application/json" \
                --data-binary @- -o /dev/null
          else
            release_payload="$(jq -n \
              --arg tag "$channel" \
              --arg target "$GITHUB_SHA" \
              --arg name "OpenAgent development Runtime channel" \
              --arg body "$notes" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, prerelease: true}')"
            release_json="$(curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/releases" \
              -H "Content-Type: application/json" \
              --data-binary "$release_payload")"
            release_id="$(jq -er '.id' <<<"$release_json")"
            upload_url="$(jq -er '.upload_url | split("{")[0]' <<<"$release_json")"
          fi
          for asset in sdk-development-components/*; do
            asset_name="$(basename "$asset")"
            existing_asset_id="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/releases/$release_id/assets?per_page=100" |
              jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' | head -n 1)"
            if [[ -n "$existing_asset_id" ]]; then
              curl -fsS -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/releases/assets/$existing_asset_id" -o /dev/null
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              "${upload_url}?name=${asset_name}" \
              --data-binary "@$asset" -o /dev/null
          done
