name: Public SDK CI

on:
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: Immutable commit from BANG404/openagent-sdk
        required: true
        type: string
      rust:
        description: Run Rust formatting, lint, and workspace tests
        required: true
        default: true
        type: boolean
      linux_sandbox:
        description: Exercise the Linux process sandbox
        required: true
        default: true
        type: boolean
      macos_sandbox:
        description: Exercise the macOS process sandbox
        required: true
        default: true
        type: boolean
      windows_sandbox:
        description: Exercise the Windows offline-account process sandbox
        required: true
        default: true
        type: boolean
      typescript:
        description: Check and test the TypeScript SDK
        required: true
        default: true
        type: boolean
      harness:
        description: Check the Harness client on Linux and Windows
        required: true
        default: true
        type: boolean
      host:
        description: Check compatibility with the public host
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-sdk-ci-${{ inputs.sdk_sha }}
  cancel-in-progress: false

env:
  SDK_REPOSITORY: BANG404/openagent-sdk
  SDK_STATUS_CONTEXT: Public SDK CI

jobs:
  pending:
    name: Report pending status
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Validate SDK revision
        env:
          SDK_SHA: ${{ inputs.sdk_sha }}
        run: |
          if [[ ! "$SDK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sdk_sha must be a full lowercase commit SHA."
            exit 1
          fi

      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk

      - name: Report pending SDK status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$SDK_REPOSITORY/commits/$SDK_SHA" --silent
          gh api --method POST "repos/$SDK_REPOSITORY/statuses/$SDK_SHA" \
            -f state=pending \
            -f context="$SDK_STATUS_CONTEXT" \
            -f description="Public runners are validating this private SDK revision" \
            -f target_url="$TARGET_URL" --silent

  rust-format:
    name: Rust formatting
    if: inputs.rust
    needs: pending
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SDK_DIAGNOSTIC_NAME: Rust formatting
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: &reporter
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-checks: write
          permission-contents: read
          permission-statuses: write
      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ inputs.sdk_sha }}
          path: sdk
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: sdk
        run: |
          if ! cargo fmt --all -- --check >"$RUNNER_TEMP/sdk-rust-format.log" 2>&1; then
            echo "sdk-rust-format.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Rust formatting failed; private diagnostic output was suppressed."
            exit 1
          fi
      - &checkout-private-diagnostic-reporter
        name: Check out private diagnostic reporter
        if: failure()
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .public-ci
          persist-credentials: false
          sparse-checkout: scripts/report-private-sdk-diagnostic.mjs
          sparse-checkout-cone-mode: false
      - &report-private-diagnostic
        name: Report diagnostic to private SDK
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .public-ci/scripts/report-private-sdk-diagnostic.mjs

  rust-clippy:
    name: Rust lint
    if: inputs.rust
    needs: pending
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SDK_DIAGNOSTIC_NAME: Rust lint
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: &sdk-checkout
          repository: BANG404/openagent-sdk
          ref: ${{ inputs.sdk_sha }}
          path: sdk
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with: &rust-cache
          workspaces: ./sdk -> target
          shared-key: public-sdk-dependencies
          cache-targets: false
      - name: Lint Rust workspace
        working-directory: sdk
        run: |
          if ! cargo clippy --workspace --all-targets --all-features >"$RUNNER_TEMP/sdk-rust-clippy.log" 2>&1; then
            echo "sdk-rust-clippy.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Rust lint failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  rust-tests:
    name: Rust tests
    if: inputs.rust
    needs: pending
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SDK_DIAGNOSTIC_NAME: Rust tests
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - name: Test Rust workspace
        working-directory: sdk
        run: |
          if ! cargo test --workspace --all-features >"$RUNNER_TEMP/sdk-rust-test.log" 2>&1; then
            echo "sdk-rust-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Rust tests failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  linux-process-sandbox:
    name: Linux process sandbox
    if: inputs.linux_sandbox
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDK_DIAGNOSTIC_NAME: Linux process sandbox
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - name: Install Linux process sandbox dependency
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y bubblewrap >/dev/null
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null
          fi
      - name: Exercise the Bubblewrap filesystem boundary
        working-directory: sdk
        env:
          OPENAGENT_BWRAP_INTEGRATION: "1"
        run: |
          if ! cargo test -p openagent-runtime bubblewrap_writes_inside_workspace_and_hides_outside_files >"$RUNNER_TEMP/sdk-bubblewrap-test.log" 2>&1; then
            echo "sdk-bubblewrap-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            diagnostic="$(grep -oE 'OPENAGENT_LINUX_SANDBOX_DIAGNOSTIC=[a-z-]+' "$RUNNER_TEMP/sdk-bubblewrap-test.log" | tail -n 1 || true)"
            if [[ -n "$diagnostic" ]]; then
              echo "::error::Linux process sandbox test failed: $diagnostic. Private diagnostic output was suppressed."
            else
              echo "::error::Linux process sandbox test failed; private diagnostic output was suppressed."
            fi
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  macos-process-sandbox:
    name: macOS process sandbox
    if: inputs.macos_sandbox
    needs: pending
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SDK_DIAGNOSTIC_NAME: macOS process sandbox
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - name: Exercise the Seatbelt filesystem boundary
        working-directory: sdk
        env:
          OPENAGENT_SEATBELT_INTEGRATION: "1"
        run: |
          if ! cargo test -p openagent-runtime seatbelt_writes_inside_workspace_and_hides_outside_files >"$RUNNER_TEMP/sdk-seatbelt-test.log" 2>&1; then
            echo "sdk-seatbelt-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::macOS process sandbox test failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  windows-process-sandbox:
    name: Windows process sandbox
    if: inputs.windows_sandbox
    needs: pending
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SDK_DIAGNOSTIC_NAME: Windows process sandbox
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - name: Enable Windows Firewall profiles
        shell: pwsh
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          if (Get-NetFirewallProfile | Where-Object { -not $_.Enabled }) {
            Write-Error "Windows Firewall profiles could not be enabled for the sandbox boundary test."
            exit 1
          }
      - name: Build pinned Windows sandbox helpers
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          $metadata = cargo metadata --locked --format-version 1 --manifest-path sdk/Cargo.toml | ConvertFrom-Json
          $package = $metadata.packages | Where-Object {
            $_.name -eq "codex-windows-sandbox" -and $_.source -like "git+*"
          } | Select-Object -First 1
          if (-not $package) {
            "Pinned codex-windows-sandbox package was not found." *> $log
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            exit 1
          }
          cargo build --locked --manifest-path $package.manifest_path --package codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner --target-dir sdk/target *>> $log
          if ($LASTEXITCODE -ne 0) {
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            Write-Error "Windows sandbox helper build failed; private diagnostic output was suppressed."
            exit 1
          }
      - name: Exercise Windows Firewall and WFP boundaries
        shell: pwsh
        env:
          OPENAGENT_WINDOWS_WFP_INTEGRATION: "1"
          OPENAGENT_WINDOWS_NETWORK_PRIVATE_DIAGNOSTIC: "1"
          SBX_DEBUG: "1"
        run: |
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          $tests = @(
            "elevated_offline_account_firewall_blocks_non_loopback_network_access",
            "elevated_offline_account_wfp_blocks_dns_network_access"
          )
          foreach ($test in $tests) {
            cargo test --manifest-path sdk/Cargo.toml -p openagent-server $test -- --test-threads=1 *>> $log
            if ($LASTEXITCODE -ne 0) {
              "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
              $diagnostic = Select-String -Path $log -Pattern 'OPENAGENT_WFP_DIAGNOSTIC=[a-z-]+' -AllMatches |
                ForEach-Object { $_.Matches.Value } |
                Select-Object -Last 1
              if ($diagnostic) {
                Write-Error "Windows process sandbox test failed: $diagnostic. Private diagnostic output was suppressed."
              } else {
                Write-Error "Windows process sandbox test failed; private diagnostic output was suppressed."
              }
              exit 1
            }
          }
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  typescript:
    name: TypeScript SDK
    if: inputs.typescript
    needs: pending
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SDK_DIAGNOSTIC_NAME: TypeScript SDK
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Cache public Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: public-sdk-bun-${{ runner.os }}-typescript-${{ hashFiles('sdk/typescript/bun.lock') }}
          restore-keys: public-sdk-bun-${{ runner.os }}-typescript-
      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: |
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/sdk-typescript-install.log" 2>&1; then
            echo "sdk-typescript-install.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::TypeScript SDK dependency installation failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check TypeScript SDK
        working-directory: sdk/typescript
        run: |
          if ! bun run check >"$RUNNER_TEMP/sdk-typescript-check.log" 2>&1; then
            echo "sdk-typescript-check.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::TypeScript SDK checking failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          if ! bun test >"$RUNNER_TEMP/sdk-typescript-test.log" 2>&1; then
            echo "sdk-typescript-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::TypeScript SDK tests failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  harness-client:
    name: Harness client (${{ matrix.name }})
    if: inputs.harness
    needs: pending
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SDK_DIAGNOSTIC_NAME: Harness client (${{ matrix.name }})
    steps:
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with: *sdk-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Cache public Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: public-sdk-bun-${{ runner.os }}-harness-${{ hashFiles('sdk/harness-typescript/bun.lock') }}
          restore-keys: public-sdk-bun-${{ runner.os }}-harness-
      - name: Build harness server
        shell: bash
        working-directory: sdk
        run: |
          if ! cargo build -p openagent-server >"$RUNNER_TEMP/sdk-harness-server.log" 2>&1; then
            echo "sdk-harness-server.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness server build failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Install harness dependencies
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/sdk-harness-install.log" 2>&1; then
            echo "sdk-harness-install.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness dependency installation failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check harness types
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun run check >"$RUNNER_TEMP/sdk-harness-check.log" 2>&1; then
            echo "sdk-harness-check.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness type checking failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Verify harness OpenAPI
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun run check:openapi >"$RUNNER_TEMP/sdk-harness-openapi.log" 2>&1; then
            echo "sdk-harness-openapi.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness OpenAPI verification failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Test harness client
        shell: bash
        working-directory: sdk/harness-typescript
        env:
          OPENAGENT_SERVER_BINARY: ${{ github.workspace }}/sdk/target/debug/openagent-server${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if ! bun test >"$RUNNER_TEMP/sdk-harness-test.log" 2>&1; then
            echo "sdk-harness-test.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness client tests failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Build harness package
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! bun run build >"$RUNNER_TEMP/sdk-harness-build.log" 2>&1; then
            echo "sdk-harness-build.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness package build failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Verify harness package contents
        shell: bash
        working-directory: sdk/harness-typescript
        run: |
          if ! npm pack --dry-run >"$RUNNER_TEMP/sdk-harness-pack.log" 2>&1; then
            echo "sdk-harness-pack.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Harness package verification failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  host-compatibility:
    name: Public host compatibility
    if: inputs.host
    needs: pending
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SDK_DIAGNOSTIC_NAME: Public host compatibility
    steps:
      - name: Check out public host
        uses: actions/checkout@v7
        with:
          path: host
          submodules: false
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ inputs.sdk_sha }}
          path: host/sdk
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./host/src-tauri -> target
          shared-key: public-sdk-host-dependencies
          cache-targets: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Cache public Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: public-sdk-bun-${{ runner.os }}-host-${{ hashFiles('host/bun.lock') }}
          restore-keys: public-sdk-bun-${{ runner.os }}-host-
      - name: Install host dependencies
        working-directory: host
        run: |
          if ! bun install --frozen-lockfile >"$RUNNER_TEMP/sdk-host-install.log" 2>&1; then
            echo "sdk-host-install.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Host dependency installation failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check public frontend compatibility
        working-directory: host
        run: |
          if ! bun run check >"$RUNNER_TEMP/sdk-host-frontend.log" 2>&1; then
            echo "sdk-host-frontend.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Public frontend compatibility failed; private diagnostic output was suppressed."
            exit 1
          fi
      - name: Check public native compatibility
        working-directory: host
        run: |
          if ! cargo check --manifest-path src-tauri/Cargo.toml --all-targets >"$RUNNER_TEMP/sdk-host-native.log" 2>&1; then
            echo "sdk-host-native.log" >"$RUNNER_TEMP/sdk-private-diagnostic-name"
            echo "::error::Public native compatibility failed; private diagnostic output was suppressed."
            exit 1
          fi
      - *checkout-private-diagnostic-reporter
      - *report-private-diagnostic

  required:
    name: Required SDK
    if: always()
    needs:
      - pending
      - rust-format
      - rust-clippy
      - rust-tests
      - linux-process-sandbox
      - macos-process-sandbox
      - windows-process-sandbox
      - typescript
      - harness-client
      - host-compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected SDK capability to pass
        id: verify
        continue-on-error: true
        env:
          CHANGES_RESULT: ${{ needs.pending.result }}
          CI_RESULT_MODULES: rust-format,rust-clippy,rust-tests,linux-process-sandbox,macos-process-sandbox,windows-process-sandbox,typescript,harness-client,host-compatibility
          RUST_FORMAT_SELECTED: ${{ inputs.rust }}
          RUST_FORMAT_RESULT: ${{ needs.rust-format.result }}
          RUST_CLIPPY_SELECTED: ${{ inputs.rust }}
          RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          RUST_TESTS_SELECTED: ${{ inputs.rust }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          LINUX_PROCESS_SANDBOX_SELECTED: ${{ inputs.linux_sandbox }}
          LINUX_PROCESS_SANDBOX_RESULT: ${{ needs.linux-process-sandbox.result }}
          MACOS_PROCESS_SANDBOX_SELECTED: ${{ inputs.macos_sandbox }}
          MACOS_PROCESS_SANDBOX_RESULT: ${{ needs.macos-process-sandbox.result }}
          WINDOWS_PROCESS_SANDBOX_SELECTED: ${{ inputs.windows_sandbox }}
          WINDOWS_PROCESS_SANDBOX_RESULT: ${{ needs.windows-process-sandbox.result }}
          TYPESCRIPT_SELECTED: ${{ inputs.typescript }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          HARNESS_CLIENT_SELECTED: ${{ inputs.harness }}
          HARNESS_CLIENT_RESULT: ${{ needs.harness-client.result }}
          HOST_COMPATIBILITY_SELECTED: ${{ inputs.host }}
          HOST_COMPATIBILITY_RESULT: ${{ needs.host-compatibility.result }}
        run: node scripts/verify-ci-results.mjs
      - name: Create SDK reporter token
        id: app-token
        uses: actions/create-github-app-token@v2
        with: *reporter
      - name: Report final SDK status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          description="Public SDK validation failed"
          if [[ "$VERIFY_OUTCOME" == success ]]; then
            state=success
            description="Public SDK validation passed"
          fi
          gh api --method POST "repos/$SDK_REPOSITORY/statuses/$SDK_SHA" \
            -f state="$state" \
            -f context="$SDK_STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$TARGET_URL" --silent
          if [[ "$state" != success ]]; then
            exit 1
          fi
