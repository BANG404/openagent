name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel (Beta uses master) / 发布渠道
        required: true
        default: beta
        type: choice
        options:
          - beta
          - rc
          - stable
      beta_tag:
        description: Beta tag to promote; required for Stable / Stable 要提升的 Beta 标签
        required: false
        type: string
      rc_tag:
        description: RC tag to promote; required for Stable
        required: false
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Push release commit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require administrator push token
        env:
          ADMIN_MERGE_TOKEN: ${{ secrets.ADMIN_MERGE_TOKEN }}
          OPENAGENT_SDK_DEPLOY_KEY: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
        shell: bash
        run: |
          if [[ -z "$ADMIN_MERGE_TOKEN" ]]; then
            echo "Repository secret ADMIN_MERGE_TOKEN is required for direct release pushes." >&2
            exit 1
          fi
          if [[ -z "$OPENAGENT_SDK_DEPLOY_KEY" ]]; then
            echo "Repository secret OPENAGENT_SDK_DEPLOY_KEY is required for release classification." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.ADMIN_MERGE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Resolve the immutable release source
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ inputs.release_type }}
          BETA_TAG: ${{ inputs.beta_tag }}
          RC_TAG: ${{ inputs.rc_tag }}
        shell: bash
        run: |
          git fetch origin refs/heads/master:refs/remotes/origin/master
          automation_sha="$(git rev-parse origin/master)"
          source_tag=""
          promotion_arg=""
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            if [[ -n "$BETA_TAG" || -n "$RC_TAG" ]]; then
              echo "Promotion tags are only valid for RC or Stable preparation." >&2
              exit 1
            fi
            base_branch="master"
            base_sha="$automation_sha"
            git switch --detach "$base_sha"
          else
            if [[ "$RELEASE_CHANNEL" == "rc" ]]; then
              source_tag="$BETA_TAG"
              source_channel="Beta"
              expected_suffix="beta"
              promotion_arg="--promote-beta=$BETA_TAG"
            else
              source_tag="$RC_TAG"
              source_channel="RC"
              expected_suffix="rc"
              promotion_arg="--promote-rc=$RC_TAG"
            fi
            if [[ -n "$BETA_TAG" && -n "$RC_TAG" ]] || [[ ! "$source_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-$expected_suffix\.[0-9]+$ ]]; then
              echo "$RELEASE_CHANNEL preparation requires one $source_channel tag, got: $source_tag" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/$source_tag^{commit}" >/dev/null; then
              echo "$source_channel tag $source_tag does not exist." >&2
              exit 1
            fi
            release_state="$(gh release view "$source_tag" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
            IFS=$'\t' read -r is_draft is_prerelease <<< "$release_state"
            if [[ "$is_draft" != "false" || "$is_prerelease" != "true" ]]; then
              echo "$source_tag must be a published $source_channel release before promotion." >&2
              exit 1
            fi

            release_version="${source_tag#v}"
            release_version="${release_version%-"$expected_suffix".*}"
            base_branch="release/$RELEASE_CHANNEL/$release_version"
            if git ls-remote --exit-code --heads origin "refs/heads/$base_branch" >/dev/null; then
              git fetch origin "refs/heads/$base_branch:refs/remotes/origin/$base_branch"
              base_sha="$(git rev-parse "origin/$base_branch")"
              if ! git merge-base --is-ancestor "$source_tag" "$base_sha"; then
                echo "$base_branch is not based on $source_tag." >&2
                exit 1
              fi
              if ! git diff --quiet "$source_tag" "$base_sha" -- \
                assets patches sdk src src-tauri static bun.lock package.json \
                svelte.config.js tsconfig.json vite.config.js; then
                echo "$base_branch no longer matches the product source in $source_tag." >&2
                exit 1
              fi
            else
              git switch -c "$base_branch" "$source_tag"
              git restore --source "$automation_sha" -- \
                .github/workflows \
                scripts \
                docs/release.md \
                tests/ciChanges.test.js \
                tests/docsSync.test.js \
                tests/releaseCi.test.js \
                tests/releaseComponents.test.js \
                tests/releaseVersion.test.js
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add \
                .github/workflows \
                scripts \
                docs/release.md \
                tests/ciChanges.test.js \
                tests/docsSync.test.js \
                tests/releaseCi.test.js \
                tests/releaseComponents.test.js \
                tests/releaseVersion.test.js
              # Keep the archive head separate from the promoted release
              # marker so branch creation cannot be mistaken for a new release.
              git commit --allow-empty -m "chore(release): refresh promotion automation"
              base_sha="$(git rev-parse HEAD)"
              git push origin "HEAD:refs/heads/$base_branch"
            fi
            git switch --detach "$base_sha"
          fi

          {
            echo "branch=$base_branch"
            echo "sha=$base_sha"
            echo "source_tag=$source_tag"
            echo "promotion_arg=$promotion_arg"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve pinned SDK revision for component classification
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK for component classification
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve or generate the release commit
        id: release
        env:
          RELEASE_CHANNEL: ${{ inputs.release_type }}
          RELEASE_BASE_SHA: ${{ steps.base.outputs.sha }}
          RELEASE_BASE_BRANCH: ${{ steps.base.outputs.branch }}
          PROMOTION_ARG: ${{ steps.base.outputs.promotion_arg }}
          SOURCE_TAG: ${{ steps.base.outputs.source_tag }}
        shell: bash
        run: |
          promotion_args=()
          if [[ -n "$PROMOTION_ARG" ]]; then
            promotion_args+=("$PROMOTION_ARG")
          fi

          release_plan="$(bun scripts/release.mjs --dry-run --channel="$RELEASE_CHANNEL" "${promotion_args[@]}")"
          printf '%s\n' "$release_plan"
          version="$(printf '%s\n' "$release_plan" | sed -nE 's/^[^[:space:]]+ -> ([^[:space:]]+) \(.+$/\1/p')"
          if [[ -z "$version" || "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]]; then
            echo "Unable to determine exactly one release version from the release plan." >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists and is immutable; it cannot be prepared again." >&2
            exit 1
          fi

          branch="prepare/$tag"
          git switch -c "$branch" "$RELEASE_BASE_SHA"
          bun scripts/release.mjs --ci --channel="$RELEASE_CHANNEL" "${promotion_args[@]}"
          bun scripts/release.mjs --verify

          if [[ "$(git rev-parse HEAD^)" != "$RELEASE_BASE_SHA" ]]; then
            echo "$branch must contain exactly one release commit based on $RELEASE_BASE_SHA." >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          git push origin "$release_sha:refs/heads/$RELEASE_BASE_BRANCH"

          {
            echo "tag=$tag"
            echo "sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          RELEASE_BASE_BRANCH: ${{ steps.base.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_TAG: ${{ steps.base.outputs.source_tag }}
        shell: bash
        run: |
          {
            echo "### Release verification started"
            echo
            echo "- Merge target: \`$RELEASE_BASE_BRANCH\`"
            echo "- Tag after merge: \`$RELEASE_TAG\`"
            echo "- Release commit: \`$RELEASE_SHA\`"
            if [[ -n "$SOURCE_TAG" ]]; then
              echo "- Promoted Beta: \`$SOURCE_TAG\`"
            fi
            echo "- Next: the Release workflow runs complete qualification before tagging or building"
          } >> "$GITHUB_STEP_SUMMARY"
