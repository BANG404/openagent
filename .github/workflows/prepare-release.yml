name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel (Beta uses master) / 发布渠道
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      beta_tag:
        description: Beta tag to promote; required for Stable / Stable 要提升的 Beta 标签
        required: false
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Create release pull request
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Resolve the immutable release source
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ inputs.release_type }}
          BETA_TAG: ${{ inputs.beta_tag }}
        shell: bash
        run: |
          source_tag=""
          promotion_arg=""
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            if [[ -n "$BETA_TAG" ]]; then
              echo "beta_tag is only valid when preparing a Stable release." >&2
              exit 1
            fi
            base_branch="master"
            base_sha="$(git rev-parse HEAD)"

            ci_run="$(
              gh run list \
                --workflow ci.yml \
                --commit "$base_sha" \
                --event push \
                --status success \
                --limit 1 \
                --json databaseId,url \
                --jq '.[0] | [.databaseId, .url] | @tsv'
            )"
            if [[ -z "$ci_run" ]]; then
              echo "master commit $base_sha has no successful push CI run." >&2
              exit 1
            fi
            IFS=$'\t' read -r ci_run_id ci_url <<< "$ci_run"
            ci_jobs_json="$(
              gh api "repos/$GH_REPO/actions/runs/$ci_run_id/jobs?per_page=100" \
                --jq '[.jobs[] | {name, conclusion}]'
            )"
            CI_JOBS_JSON="$ci_jobs_json" bun scripts/verify-release-ci.mjs
          else
            if [[ ! "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "Stable preparation requires a Beta tag, got: $BETA_TAG" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/$BETA_TAG^{commit}" >/dev/null; then
              echo "Beta tag $BETA_TAG does not exist." >&2
              exit 1
            fi
            release_state="$(gh release view "$BETA_TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
            IFS=$'\t' read -r is_draft is_prerelease <<< "$release_state"
            if [[ "$is_draft" != "false" || "$is_prerelease" != "true" ]]; then
              echo "$BETA_TAG must be a published Beta release before Stable promotion." >&2
              exit 1
            fi

            stable_version="${BETA_TAG#v}"
            stable_version="${stable_version%-beta.*}"
            base_branch="release/stable/$stable_version"
            if git ls-remote --exit-code --heads origin "refs/heads/$base_branch" >/dev/null; then
              git fetch origin "refs/heads/$base_branch:refs/remotes/origin/$base_branch"
              base_sha="$(git rev-parse "origin/$base_branch")"
              if ! git merge-base --is-ancestor "$BETA_TAG" "$base_sha"; then
                echo "$base_branch is not based on $BETA_TAG." >&2
                exit 1
              fi
              if ! git diff --quiet "$BETA_TAG" "$base_sha" -- \
                assets patches sdk src src-tauri static bun.lock package.json \
                svelte.config.js tsconfig.json vite.config.js; then
                echo "$base_branch no longer matches the product source in $BETA_TAG." >&2
                exit 1
              fi
            else
              automation_sha="$(git rev-parse master)"
              git switch -c "$base_branch" "$BETA_TAG"
              git restore --source "$automation_sha" -- \
                .github/workflows \
                scripts \
                docs/release.md \
                tests/ciChanges.test.js \
                tests/docsSync.test.js \
                tests/releaseCi.test.js \
                tests/releaseVersion.test.js
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add \
                .github/workflows \
                scripts \
                docs/release.md \
                tests/ciChanges.test.js \
                tests/docsSync.test.js \
                tests/releaseCi.test.js \
                tests/releaseVersion.test.js
              # Always keep the archive head separate from the Beta release
              # marker so branch creation cannot be mistaken for a new release.
              git commit --allow-empty -m "chore(release): refresh promotion automation"
              base_sha="$(git rev-parse HEAD)"
              git push origin "HEAD:refs/heads/$base_branch"
            fi
            git switch --detach "$base_sha"
            source_tag="$BETA_TAG"
            promotion_arg="--promote-beta=$BETA_TAG"
            ci_url="https://github.com/$GH_REPO/releases/tag/$BETA_TAG"
          fi

          {
            echo "branch=$base_branch"
            echo "sha=$base_sha"
            echo "ci_url=$ci_url"
            echo "source_tag=$source_tag"
            echo "promotion_arg=$promotion_arg"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve or generate the release commit
        id: release
        env:
          RELEASE_CHANNEL: ${{ inputs.release_type }}
          RELEASE_BASE_SHA: ${{ steps.base.outputs.sha }}
          PROMOTION_ARG: ${{ steps.base.outputs.promotion_arg }}
          SOURCE_TAG: ${{ steps.base.outputs.source_tag }}
        shell: bash
        run: |
          promotion_args=()
          if [[ -n "$PROMOTION_ARG" ]]; then
            promotion_args+=("$PROMOTION_ARG")
          fi

          release_plan="$(bun scripts/release.mjs --dry-run --channel="$RELEASE_CHANNEL" "${promotion_args[@]}")"
          printf '%s\n' "$release_plan"
          version="$(printf '%s\n' "$release_plan" | sed -nE 's/^[^[:space:]]+ -> ([^[:space:]]+) \(.+$/\1/p')"
          if [[ -z "$version" || "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]]; then
            echo "Unable to determine exactly one release version from the release plan." >&2
            exit 1
          fi

          tag="v$version"
          branch="prepare/$tag"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists and is immutable; it cannot be prepared again." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Reusing existing release preparation branch $branch."
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --detach "origin/$branch"
            bun scripts/release.mjs --verify

            manifest_tag="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).tag")"
            manifest_channel="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).channel")"
            manifest_source="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).sourceTag || ''")"
            if [[ "$manifest_tag" != "$tag" || "$manifest_channel" != "$RELEASE_CHANNEL" || "$manifest_source" != "$SOURCE_TAG" ]]; then
              echo "Existing branch $branch does not contain the requested release metadata." >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD^)" == "$RELEASE_BASE_SHA" ]]; then
              reused=true
            else
              existing_author="$(git log -1 --format='%an <%ae>')"
              if [[ "$existing_author" != "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" ]]; then
                echo "Stale release preparation branch $branch was not generated by GitHub Actions; refusing to replace it." >&2
                exit 1
              fi

              echo "Regenerating stale release preparation branch $branch from $RELEASE_BASE_SHA."
              expected_branch_sha="$(git rev-parse "origin/$branch")"
              git switch -C "$branch" "$RELEASE_BASE_SHA"
              bun scripts/release.mjs --ci --channel="$RELEASE_CHANNEL" "${promotion_args[@]}"
              bun scripts/release.mjs --verify
              git push --force-with-lease="refs/heads/$branch:$expected_branch_sha" origin "HEAD:refs/heads/$branch"
              reused=false
            fi
          else
            git switch -c "$branch"
            bun scripts/release.mjs --ci --channel="$RELEASE_CHANNEL" "${promotion_args[@]}"
            bun scripts/release.mjs --verify
            reused=false
            git push origin "HEAD:refs/heads/$branch"
          fi

          if [[ "$(git rev-parse HEAD^)" != "$RELEASE_BASE_SHA" ]]; then
            echo "$branch must contain exactly one release commit based on $RELEASE_BASE_SHA." >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "branch=$branch"
            echo "reused=$reused"
          } >> "$GITHUB_OUTPUT"

      - name: Open the release pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_BASE_BRANCH: ${{ steps.base.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BASE_CI_URL: ${{ steps.base.outputs.ci_url }}
          SOURCE_TAG: ${{ steps.base.outputs.source_tag }}
        shell: bash
        run: |
          pr_url="$(gh pr list --base "$RELEASE_BASE_BRANCH" --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            source_note=""
            if [[ -n "$SOURCE_TAG" ]]; then
              source_note=" Exact product snapshot: \`$SOURCE_TAG\`."
            fi
            pr_url="$(
              gh pr create \
                --base "$RELEASE_BASE_BRANCH" \
                --head "$RELEASE_BRANCH" \
                --title "chore: release $RELEASE_TAG" \
                --body "Generated release metadata for \`$RELEASE_TAG\`.$source_note The source passed [verification]($BASE_CI_URL). The trusted release workflow will squash-merge this PR after the authoritative CI result passes."
            )"
          else
            echo "Reusing existing release pull request: $pr_url"
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Start CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH" -f "base_sha=$BASE_SHA"

      - name: Summarize
        env:
          RELEASE_BASE_BRANCH: ${{ steps.base.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_TAG: ${{ steps.base.outputs.source_tag }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        shell: bash
        run: |
          {
            echo "### Release PR ready"
            echo
            echo "- Merge target: \`$RELEASE_BASE_BRANCH\`"
            echo "- Tag after merge: \`$RELEASE_TAG\`"
            if [[ -n "$SOURCE_TAG" ]]; then
              echo "- Promoted Beta: \`$SOURCE_TAG\`"
            fi
            echo "- Pull request: $PR_URL"
            echo "- Merge: automatic after authoritative CI succeeds"
          } >> "$GITHUB_STEP_SUMMARY"
