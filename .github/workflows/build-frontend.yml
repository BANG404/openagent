name: Frontend production assets

on:
  workflow_call:
    inputs:
      component_reuse:
        description: Consume the caller's signed component reuse plan
        type: boolean
        default: false
      reuse_frontend:
        type: boolean
        default: false
      source_sha:
        type: string
        default: ""
    secrets:
      OPENAGENT_CI_REPORTER_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and qualify static assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAGENT_COMPONENT_PLAN: ${{ inputs.component_reuse && '.cache/component-reuse/plan.json' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: bun-public-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: inputs.component_reuse
        with:
          name: component-reuse-plan
          path: .cache/component-reuse
      - name: Restore previously qualified frontend bytes
        if: inputs.reuse_frontend
        shell: bash
        run: |
          mkdir -p .cache/frontend-build
          tar -xzf .cache/component-reuse/frontend-build.tar.gz -C .cache/frontend-build
      - name: Resolve exact frontend cache identity
        id: identity
        run: node scripts/release-build-artifacts.mjs key >> "$GITHUB_OUTPUT"
      - name: Restore qualified frontend cache
        if: "!inputs.reuse_frontend"
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/frontend-build
          key: ${{ steps.identity.outputs.key }}
      - name: Build frontend and bootstrap and enforce bundle budgets
        if: "!inputs.reuse_frontend && steps.cache.outputs.cache-hit != 'true'"
        run: |
          bun run build
          bun run build:bootstrap
          bun run check:bundle-size
          node scripts/release-build-artifacts.mjs frontend-pack --directory .cache/frontend-build --cache-key "${{ steps.identity.outputs.key }}"
      - name: Verify qualified frontend bytes
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.reuse_frontend }}" != true ]]; then
            args+=(--cache-key "${{ steps.identity.outputs.key }}")
          fi
          node scripts/release-build-artifacts.mjs frontend-verify --directory .cache/frontend-build "${args[@]}"
      - uses: actions/cache/save@v4
        if: >-
          !inputs.reuse_frontend && steps.cache.outputs.cache-hit != 'true'
          && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .cache/frontend-build
          key: ${{ steps.identity.outputs.key }}
      - name: Archive immutable frontend build
        if: inputs.component_reuse
        run: tar -C .cache/frontend-build -czf frontend-build.tar.gz .
      - uses: actions/upload-artifact@v4
        if: inputs.component_reuse
        with:
          name: component-archive-frontend
          path: frontend-build.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-frontend-build
          path: .cache/frontend-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
