name: Release

on:
  push:
    branches:
      - master
      - release/rc/**
      - release/stable/**
    paths:
      - .github/release.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read
  statuses: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: 1.2.21

jobs:
  detect:
    name: Detect release commit
    runs-on: ubuntu-24.04
    outputs:
      active: ${{ steps.release.outputs.active }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      frontend: ${{ steps.release.outputs.frontend }}
      runtime: ${{ steps.release.outputs.runtime }}
      native_shell: ${{ steps.release.outputs.native_shell }}
      published: ${{ steps.state.outputs.published }}
      sha: ${{ github.sha }}
    steps:
      - name: Detect release marker change
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          parent_sha="$(
            gh api "repos/$GH_REPO/commits/$RELEASE_SHA" \
              --jq '.parents | if length == 1 then .[0].sha else empty end'
          )"
          if [[ -z "$parent_sha" ]]; then
            echo "::notice::Release routing requires a single-parent commit."
            exit 0
          fi

          marker_path=".github/release.json"
          current_marker="$(
            gh api "repos/$GH_REPO/contents/$marker_path?ref=$RELEASE_SHA" --jq '.sha' \
              2>/dev/null || true
          )"
          previous_marker="$(
            gh api "repos/$GH_REPO/contents/$marker_path?ref=$parent_sha" --jq '.sha' \
              2>/dev/null || true
          )"
          if [[ -n "$current_marker" && "$current_marker" != "$previous_marker" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.marker.outputs.changed == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: steps.marker.outputs.changed == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate release marker and metadata
        id: release
        if: steps.marker.outputs.changed == 'true'
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "active=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet HEAD^ HEAD -- .github/release.json; then
            exit 0
          fi

          ready="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).ready")"
          if [[ "$ready" != "true" ]]; then
            exit 0
          fi

          manifest_channel="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).channel")"
          if [[ "$manifest_channel" == "beta" && "$RELEASE_BRANCH" != "master" ]]; then
            echo "Beta releases must be merged to master, not $RELEASE_BRANCH." >&2
            exit 1
          fi
          if [[ "$manifest_channel" == "rc" && "$RELEASE_BRANCH" != release/rc/* ]]; then
            echo "RC releases must be merged to release/rc/X.Y.Z, not $RELEASE_BRANCH." >&2
            exit 1
          fi
          if [[ "$manifest_channel" == "stable" && "$RELEASE_BRANCH" != release/stable/* ]]; then
            echo "Stable releases must be merged to release/stable/X.Y.Z, not $RELEASE_BRANCH." >&2
            exit 1
          fi

          tag="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).tag")"
          tag_ref="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$tag_ref" ]]; then
            tagged_sha="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk 'NR == 1 { print $1 }')"
            tagged_sha="${tagged_sha:-$tag_ref}"
            if [[ "$tagged_sha" != "$(git rev-parse HEAD)" ]]; then
              echo "Release tag $tag already points to $tagged_sha; no release action is needed."
              exit 0
            fi
            echo "Release tag $tag already points to this commit; resuming the release."
          fi

          bun scripts/release.mjs --verify
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const manifest = JSON.parse(require("fs").readFileSync(".github/release.json", "utf8"));
          const components = manifest.components ?? { frontend: true, runtime: true, nativeShell: true };
          console.log("active=true");
          console.log(`tag=${manifest.tag}`);
          console.log(`version=${manifest.version}`);
          console.log(`channel=${manifest.channel}`);
          console.log(`prerelease=${manifest.channel !== "stable"}`);
          console.log(`frontend=${components.frontend === true}`);
          console.log(`runtime=${components.runtime === true}`);
          console.log(`native_shell=${components.nativeShell === true}`);
          NODE

      - name: Resolve existing release state
        id: state
        if: steps.release.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          published=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              published=true
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Require private release credentials
        if: steps.release.outputs.active == 'true'
        shell: bash
        env:
          OPENAGENT_CI_REPORTER_APP_ID: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          OPENAGENT_CI_REPORTER_PRIVATE_KEY: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          OPENAGENT_SDK_RELEASE_TOKEN: ${{ secrets.OPENAGENT_SDK_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NATIVE_SHELL: ${{ steps.release.outputs.native_shell }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_APP_ID: ${{ vars.MS_STORE_APP_ID }}
          MS_STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MS_STORE_PACKAGE_IDENTITY_NAME }}
          MS_STORE_PACKAGE_PUBLISHER: ${{ vars.MS_STORE_PACKAGE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if [[ -z "$OPENAGENT_CI_REPORTER_APP_ID" || -z "$OPENAGENT_CI_REPORTER_PRIVATE_KEY" ]]; then
            echo "OPENAGENT_CI_REPORTER_APP_ID and OPENAGENT_CI_REPORTER_PRIVATE_KEY are required." >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Repository secret TAURI_SIGNING_PRIVATE_KEY is required." >&2
            exit 1
          fi
          if [[ -z "$OPENAGENT_SDK_RELEASE_TOKEN" ]]; then
            echo "Repository secret OPENAGENT_SDK_RELEASE_TOKEN is required." >&2
            exit 1
          fi

          if [[ "$PRERELEASE" == "false" && "$NATIVE_SHELL" == "true" ]]; then
            required_store_secrets=(
              AZURE_AD_APPLICATION_CLIENT_ID
              AZURE_AD_APPLICATION_SECRET
              AZURE_AD_TENANT_ID
              SELLER_ID
            )
            for name in "${required_store_secrets[@]}"; do
              if [[ -z "${!name}" ]]; then
                echo "Repository secret $name is required for Microsoft Store releases." >&2
                exit 1
              fi
            done

            required_store_variables=(
              MS_STORE_APP_ID
              MS_STORE_PACKAGE_IDENTITY_NAME
              MS_STORE_PACKAGE_PUBLISHER
              MS_STORE_PUBLISHER_DISPLAY_NAME
            )
            for name in "${required_store_variables[@]}"; do
              if [[ -z "${!name}" ]]; then
                echo "Repository variable $name is required for Microsoft Store releases." >&2
                exit 1
              fi
            done
          fi

  sdk-release:
    name: Stage or reuse pinned SDK release
    needs: detect
    if: needs.detect.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    outputs:
      sdk_tag: ${{ steps.release.outputs.sdk_tag }}
      sdk_version: ${{ steps.release.outputs.sdk_version }}
      sdk_sha: ${{ steps.release.outputs.sdk_sha }}
      sdk_release_sha: ${{ steps.release.outputs.sdk_release_sha }}
      protocol_min: ${{ steps.release.outputs.protocol_min }}
      protocol_max: ${{ steps.release.outputs.protocol_max }}
      host_compatibility: ${{ steps.release.outputs.host_compatibility }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out exact private SDK source
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          fetch-depth: 0
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Ensure independent SDK release
        id: release
        env:
          GH_TOKEN: ${{ secrets.OPENAGENT_SDK_RELEASE_TOKEN }}
        run: >-
          node scripts/ensure-sdk-release.mjs
          --sdk-dir sdk
          --sdk-sha "${{ steps.sdk.outputs.sha }}"
          --host-version "${{ needs.detect.outputs.version }}"
          --repository BANG404/openagent-sdk
          --output "$GITHUB_OUTPUT"
          --mode stage

  qualify:
    name: Complete release qualification
    needs: detect
    if: needs.detect.outputs.active == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      base_sha: ${{ github.event.before }}
      full: true
    secrets: inherit

  tag:
    name: Tag verified commit
    needs:
      - detect
      - sdk-release
      - qualify
      - build
      - runtime-components
      - frontend-components
    if: >-
      always()
      && needs.detect.outputs.active == 'true'
      && needs.sdk-release.result == 'success'
      && needs.qualify.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.runtime-components.result == 'success' || needs.runtime-components.result == 'skipped')
      && (needs.frontend-components.result == 'success' || needs.frontend-components.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0

      - name: Create immutable release tag
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_SHA: ${{ needs.detect.outputs.sha }}
        shell: bash
        run: |
          existing="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              echo "$RELEASE_TAG already points to $existing, not $RELEASE_SHA." >&2
              exit 1
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  create-draft:
    name: Create draft release
    needs:
      - detect
      - tag
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.tag.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Create or reuse draft GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.detect.outputs.channel }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          published=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "$RELEASE_TAG is already published; reusing it."
              published=true
            else
              echo "Reusing draft release $RELEASE_TAG."
            fi
          else
            args=(
              "$RELEASE_TAG"
              --draft
              --verify-tag
              --title "OpenAgent $RELEASE_TAG [$RELEASE_CHANNEL]"
              --notes "See the [CHANGELOG](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/CHANGELOG.md) for details."
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: detect
    if: >-
      needs.detect.outputs.published != 'true'
      && (needs.detect.outputs.native_shell == 'true' || needs.detect.outputs.runtime == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: '"macos-latest"'
            runner_os: macOS
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            sidecar_target: aarch64-apple-darwin
            runtime_target: macos-arm64
            runtime_sidecar: openagent-server-aarch64-apple-darwin
            runtime_artifact: openagent-server-macos-arm64
          - name: macOS Intel
            runner: '"macos-latest"'
            runner_os: macOS
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            sidecar_target: x86_64-apple-darwin
            runtime_target: macos-x64
            runtime_sidecar: openagent-server-x86_64-apple-darwin
            runtime_artifact: openagent-server-macos-x64
          - name: Linux x64
            runner: '"ubuntu-24.04"'
            runner_os: Linux
            args: ""
            rust_target: ""
            sidecar_target: x86_64-unknown-linux-gnu
            runtime_target: linux-x64
            runtime_sidecar: openagent-server-x86_64-unknown-linux-gnu
            runtime_artifact: openagent-server-linux-x64
          - name: Windows x64
            runner: '"windows-2025"'
            runner_os: Windows
            args: ""
            rust_target: ""
            sidecar_target: x86_64-pc-windows-msvc
            runtime_target: windows-x64
            runtime_sidecar: openagent-server-x86_64-pc-windows-msvc.exe
            runtime_artifact: openagent-server-windows-x64.exe
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-targets: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up WinApp CLI
        if: >-
          needs.detect.outputs.native_shell == 'true'
          && matrix.runner_os == 'Windows'
          && needs.detect.outputs.prerelease != 'true'
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Install frontend dependencies
        if: needs.detect.outputs.native_shell == 'true'
        run: bun install --frozen-lockfile

      - name: Install Linux dependencies
        if: matrix.runner_os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            libcap-dev \
            libssl-dev \
            pkg-config

      - name: Prepare pinned Linux sandbox helper
        if: needs.detect.outputs.native_shell == 'true' && matrix.runner_os == 'Linux'
        shell: bash
        run: |
          if ! node scripts/prepare-linux-sandbox-helper.mjs --profile release --github-env >"$RUNNER_TEMP/linux-sandbox-helper-build.log" 2>&1; then
            echo "::error::Linux sandbox helper build failed; diagnostic output was suppressed."
            exit 1
          fi

      # This is the authoritative full product compilation for the immutable
      # release SHA. Pull-request and master CI validate source-level modules.
      - name: Build lightweight release candidate
        id: tauri
        if: needs.detect.outputs.native_shell == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENAGENT_RUNTIME_TARGET: ${{ matrix.sidecar_target }}
          OPENAGENT_LOGS_INGEST_TOKEN: ${{ secrets.OPENAGENT_LOGS_INGEST_TOKEN }}
        with:
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Stage lightweight release candidate
        if: needs.detect.outputs.native_shell == 'true'
        shell: bash
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: >-
          node scripts/release-candidate-artifacts.mjs stage-tauri
          --output "$RUNNER_TEMP/native-release"
          --target "${{ matrix.runtime_target }}"

      - name: Build runtime candidate
        if: needs.detect.outputs.runtime == 'true'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          target_args=()
          if [[ -n "$RUST_TARGET" ]]; then
            target_args+=(--target "$RUST_TARGET")
          fi
          bun scripts/prepare-runtime-server.mjs --profile release "${target_args[@]}"

      - name: Stage runtime candidate
        if: needs.detect.outputs.runtime == 'true'
        shell: bash
        env:
          RUNTIME_SIDECAR: ${{ matrix.runtime_sidecar }}
          RUNTIME_ARTIFACT: ${{ matrix.runtime_artifact }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-component"
          cp "src-tauri/binaries/$RUNTIME_SIDECAR" \
            "$RUNNER_TEMP/runtime-component/$RUNTIME_ARTIFACT"

      - name: Upload runtime candidate
        if: needs.detect.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-component-${{ matrix.runtime_target }}
          path: ${{ runner.temp }}/runtime-component/${{ matrix.runtime_artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: Build full first-install bundle
        if: needs.detect.outputs.native_shell == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENAGENT_RUNTIME_TARGET: ${{ matrix.sidecar_target }}
          OPENAGENT_LOGS_INGEST_TOKEN: ${{ secrets.OPENAGENT_LOGS_INGEST_TOKEN }}
        # The lightweight build already compiled the app, frontend, runtime,
        # and sidecars. Bundle the full installer from those existing outputs;
        # running `tauri build` here would repeat beforeBuildCommand.
        run: bun run tauri:bundle -- --config src-tauri/tauri.full.conf.json ${{ matrix.args }}

      - name: Stage full first-install candidate
        if: needs.detect.outputs.native_shell == 'true'
        shell: bash
        run: >-
          node scripts/release-candidate-artifacts.mjs stage-full
          --bundle-root src-tauri/target
          --output "$RUNNER_TEMP/native-release"
          --target "${{ matrix.runtime_target }}"
          --version "${{ needs.detect.outputs.version }}"

      - name: Bind native candidate to release source
        if: needs.detect.outputs.native_shell == 'true'
        shell: bash
        run: >-
          node scripts/release-candidate-artifacts.mjs manifest
          --output "$RUNNER_TEMP/native-release"
          --target "${{ matrix.runtime_target }}"
          --desktop-sha "${{ needs.detect.outputs.sha }}"
          --sdk-sha "${{ steps.sdk.outputs.sha }}"

      - name: Upload native release candidate
        if: needs.detect.outputs.native_shell == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.runtime_target }}
          path: ${{ runner.temp }}/native-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Build Microsoft Store package
        if: >-
          needs.detect.outputs.native_shell == 'true'
          && matrix.runner_os == 'Windows'
          && needs.detect.outputs.prerelease != 'true'
        shell: pwsh
        env:
          MS_STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MS_STORE_PACKAGE_IDENTITY_NAME }}
          MS_STORE_PACKAGE_PUBLISHER: ${{ vars.MS_STORE_PACKAGE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "openagent-store"
          $manifestPath = Join-Path $stage "Package.appxmanifest"
          $packagePath = Join-Path $env:RUNNER_TEMP "openagent-store.msix"
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "src-tauri\target\release\openagent.exe" $stage
          Copy-Item "src-tauri\target\release\openagent-agent-server.exe" $stage
          Copy-Item "src-tauri\binaries\openagent-server-x86_64-pc-windows-msvc.exe" `
            (Join-Path $stage "openagent-server.exe")
          Get-ChildItem "src-tauri\target\release" -Filter *.dll -File |
            Copy-Item -Destination $stage
          Copy-Item "src-tauri\resources\models\all-MiniLM-L6-v2-q" `
            (Join-Path $stage "models\all-MiniLM-L6-v2-q") `
            -Recurse
          Copy-Item "src-tauri\resources\codex-resources" `
            (Join-Path $stage "codex-resources") `
            -Recurse

          $tauriConfig = Get-Content -Raw "src-tauri\tauri.conf.json" | ConvertFrom-Json
          if ($tauriConfig.version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "Microsoft Store releases require a stable SemVer version, got '$($tauriConfig.version)'."
          }
          $storeVersionParts = @(
            [int] $Matches[1] + 1
            [int] $Matches[2]
            [int] $Matches[3]
            0
          )
          if (($storeVersionParts | Where-Object { $_ -gt 65535 }).Count -ne 0) {
            throw "Microsoft Store package version components must not exceed 65535."
          }
          $storeVersion = $storeVersionParts -join "."

          winapp manifest generate $stage `
            --package-name $env:MS_STORE_PACKAGE_IDENTITY_NAME `
            --publisher-name $env:MS_STORE_PACKAGE_PUBLISHER `
            --version $storeVersion `
            --description "OpenAgent" `
            --entrypoint (Join-Path $stage "openagent.exe") `
            --logo-path "src-tauri\icons\icon.png" `
            --if-exists overwrite
          if ($LASTEXITCODE -ne 0) {
            throw "WinApp CLI failed to generate the Microsoft Store manifest."
          }

          [xml] $manifest = Get-Content -Raw $manifestPath
          $namespace = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace("appx", $manifest.DocumentElement.NamespaceURI)
          $namespace.AddNamespace("uap", "http://schemas.microsoft.com/appx/manifest/uap/windows10")
          $manifest.SelectSingleNode("/appx:Package/appx:Properties/appx:DisplayName", $namespace).InnerText = "OpenAgent"
          $manifest.SelectSingleNode("/appx:Package/appx:Properties/appx:PublisherDisplayName", $namespace).InnerText = $env:MS_STORE_PUBLISHER_DISPLAY_NAME
          $manifest.SelectSingleNode("/appx:Package/appx:Applications/appx:Application/uap:VisualElements", $namespace).SetAttribute("DisplayName", "OpenAgent")

          # fastembed's prebuilt ONNX Runtime links the VC++ 14 runtime dynamically.
          # This framework dependency lets the Store install and service
          # MSVCP140.dll and MSVCP140_1.dll with the application.
          $dependencies = $manifest.SelectSingleNode("/appx:Package/appx:Dependencies", $namespace)
          if ($null -eq $dependencies) {
            throw "Generated Microsoft Store manifest has no Dependencies element."
          }
          $vcLibs = $manifest.CreateElement("PackageDependency", $manifest.DocumentElement.NamespaceURI)
          $vcLibs.SetAttribute("Name", "Microsoft.VCLibs.140.00.UWPDesktop")
          $vcLibs.SetAttribute("MinVersion", "14.0.27323.0")
          $vcLibs.SetAttribute("Publisher", "CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US")
          $dependencies.AppendChild($vcLibs) | Out-Null
          $manifest.Save($manifestPath)

          [xml] $savedManifest = Get-Content -Raw $manifestPath
          $savedNamespace = New-Object System.Xml.XmlNamespaceManager($savedManifest.NameTable)
          $savedNamespace.AddNamespace("appx", $savedManifest.DocumentElement.NamespaceURI)
          $savedVcLibs = $savedManifest.SelectSingleNode(
            "/appx:Package/appx:Dependencies/appx:PackageDependency[@Name='Microsoft.VCLibs.140.00.UWPDesktop']",
            $savedNamespace
          )
          if ($null -eq $savedVcLibs -or $savedVcLibs.MinVersion -ne "14.0.27323.0") {
            throw "Microsoft Store manifest is missing the required VC++ runtime dependency."
          }
          $modelPath = Join-Path $stage "models\all-MiniLM-L6-v2-q\model_quantized.onnx"
          if (-not (Test-Path -LiteralPath $modelPath)) {
            throw "Microsoft Store package staging is missing the bundled embedding model."
          }
          foreach ($helper in @("codex-windows-sandbox-setup.exe", "codex-command-runner.exe")) {
            $helperPath = Join-Path $stage "codex-resources\$helper"
            if (-not (Test-Path -LiteralPath $helperPath)) {
              throw "Microsoft Store package staging is missing Windows sandbox helper $helper."
            }
          }
          $runtimeFallback = Join-Path $stage "openagent-server.exe"
          if (-not (Test-Path -LiteralPath $runtimeFallback)) {
            throw "Microsoft Store package staging is missing the fallback runtime server."
          }

          winapp pack $stage `
            --manifest $manifestPath `
            --output $packagePath `
            --executable "openagent.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "WinApp CLI failed to build the Microsoft Store package."
          }

      - name: Upload Microsoft Store package
        if: >-
          needs.detect.outputs.native_shell == 'true'
          && matrix.runner_os == 'Windows'
          && needs.detect.outputs.prerelease != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openagent-store-msix
          path: ${{ runner.temp }}/openagent-store.msix
          if-no-files-found: error
          retention-days: 7

  runtime-components:
    name: Prepare signed runtime candidate
    needs:
      - detect
      - build
      - sdk-release
    if: >-
      needs.detect.outputs.published != 'true'
      && needs.detect.outputs.runtime == 'true'
      && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK metadata
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install signing CLI
        run: bun install --frozen-lockfile

      - name: Download runtime candidate binaries
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-component-*
          path: runtime-components
          merge-multiple: true

      - name: Create and sign runtime manifest
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version="${{ needs.sdk-release.outputs.sdk_version }}"
          protocol="$(sed -n 's/^pub const SDK_PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);/\1/p' sdk/rust/openagent-protocol/src/lib.rs)"
          if [[ -z "$version" || -z "$protocol" ]]; then
            echo "Unable to resolve the pinned runtime version or protocol." >&2
            exit 1
          fi
          node sdk/scripts/server-artifacts.mjs \
            --artifacts runtime-components \
            --output runtime-components/openagent-sdk-manifest.json \
            --version "$version" \
            --protocol "$protocol" \
            --sdk-sha "${{ steps.sdk.outputs.sha }}"
          bun scripts/tauri.mjs signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "" \
            runtime-components/openagent-sdk-manifest.json
          test -s runtime-components/openagent-sdk-manifest.json.sig

      - name: Upload signed runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: signed-runtime-components
          path: runtime-components/*
          if-no-files-found: error
          retention-days: 7

  frontend-components:
    name: Prepare signed frontend candidate
    needs: detect
    if: >-
      needs.detect.outputs.published != 'true'
      && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build release frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Create and sign frontend component
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p frontend-components
          tar --format=ustar -C build -czf frontend-components/openagent-frontend.tar.gz .
          version="$(node -p "require('./package.json').version")"
          protocol="$(sed -n 's/^pub const FRONTEND_HOST_PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);/\1/p' src-tauri/src/frontend_resource.rs)"
          if [[ -z "$protocol" ]]; then
            echo "Unable to resolve the frontend host protocol." >&2
            exit 1
          fi
          node scripts/frontend-artifacts.mjs \
            --archive frontend-components/openagent-frontend.tar.gz \
            --assets build \
            --output frontend-components/openagent-frontend-manifest.json \
            --version "$version" \
            --protocol "$protocol"
          bun scripts/tauri.mjs signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "" \
            frontend-components/openagent-frontend-manifest.json
          test -s frontend-components/openagent-frontend-manifest.json.sig

      - name: Upload signed frontend candidate
        uses: actions/upload-artifact@v4
        with:
          name: signed-frontend-components
          path: frontend-components/*
          if-no-files-found: error
          retention-days: 7

  publish-native-assets:
    name: Publish native release assets
    needs:
      - detect
      - create-draft
      - build
      - sdk-release
    if: >-
      needs.create-draft.outputs.published != 'true'
      && needs.detect.outputs.native_shell == 'true'
      && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Download native release candidates
        uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          path: native-candidates
          merge-multiple: true

      - name: Verify candidates and generate updater metadata
        shell: bash
        run: >-
          node scripts/release-candidate-artifacts.mjs publish
          --candidates native-candidates
          --output native-publication
          --targets macos-arm64,macos-x64,linux-x64,windows-x64
          --desktop-sha "${{ needs.detect.outputs.sha }}"
          --sdk-sha "${{ needs.sdk-release.outputs.sdk_sha }}"
          --tag "${{ needs.detect.outputs.tag }}"
          --repository "${{ github.repository }}"
          --version "${{ needs.detect.outputs.version }}"
          --notes "See the CHANGELOG for details."

      - name: Upload verified native assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" native-publication/* --clobber

  publish-runtime-components:
    name: Publish signed runtime components
    needs:
      - detect
      - create-draft
      - runtime-components
    if: >-
      needs.create-draft.outputs.published != 'true'
      && needs.detect.outputs.runtime == 'true'
      && needs.runtime-components.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed runtime candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-runtime-components
          path: runtime-components

      - name: Upload signed runtime components to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" runtime-components/* --clobber

  publish-frontend-components:
    name: Publish signed frontend component
    needs:
      - detect
      - create-draft
      - frontend-components
    if: >-
      needs.create-draft.outputs.published != 'true'
      && needs.detect.outputs.frontend == 'true'
      && needs.frontend-components.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed frontend candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-frontend-components
          path: frontend-components

      - name: Upload signed frontend component to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" frontend-components/* --clobber

  publish-store:
    name: Submit Microsoft Store update
    needs:
      - detect
      - create-draft
      - build
    if: >-
      needs.detect.outputs.native_shell == 'true'
      && needs.detect.outputs.prerelease != 'true'
      && needs.create-draft.outputs.published != 'true'
      && needs.build.result == 'success'
    runs-on: windows-2025
    steps:
      - name: Download Microsoft Store package
        uses: actions/download-artifact@v4
        with:
          name: openagent-store-msix
          path: ${{ runner.temp }}/openagent-store

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Configure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          winapp store reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) {
            throw "WinApp CLI failed to configure Microsoft Store credentials."
          }

      - name: Publish Microsoft Store submission
        shell: pwsh
        env:
          MS_STORE_APP_ID: ${{ vars.MS_STORE_APP_ID }}
        run: |
          $package = Get-ChildItem "${{ runner.temp }}\openagent-store" -Filter *.msix -File -Recurse
          if ($package.Count -ne 1) {
            throw "Expected exactly one Microsoft Store MSIX package, found $($package.Count)."
          }
          $packagePath = $package[0].FullName
          winapp store publish $packagePath --appId $env:MS_STORE_APP_ID
          if ($LASTEXITCODE -ne 0) {
            throw "WinApp CLI failed to submit the Microsoft Store update."
          }

  publish-sdk-release:
    name: Publish pinned SDK release
    needs:
      - detect
      - create-draft
      - publish-native-assets
      - publish-runtime-components
      - publish-frontend-components
      - publish-store
      - sdk-release
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.create-draft.result == 'success'
      && needs.sdk-release.result == 'success'
      && (needs.publish-native-assets.result == 'success' || needs.publish-native-assets.result == 'skipped')
      && (needs.publish-runtime-components.result == 'success' || needs.publish-runtime-components.result == 'skipped')
      && (needs.publish-frontend-components.result == 'success' || needs.publish-frontend-components.result == 'skipped')
      && (needs.publish-store.result == 'success' || needs.publish-store.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out exact private SDK source
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ needs.sdk-release.outputs.sdk_sha }}
          path: sdk
          fetch-depth: 0
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Publish independently versioned SDK resources
        env:
          GH_TOKEN: ${{ secrets.OPENAGENT_SDK_RELEASE_TOKEN }}
        run: >-
          node scripts/ensure-sdk-release.mjs
          --sdk-dir sdk
          --sdk-sha "${{ needs.sdk-release.outputs.sdk_sha }}"
          --host-version "${{ needs.detect.outputs.version }}"
          --repository BANG404/openagent-sdk
          --output "$RUNNER_TEMP/sdk-publish-output"
          --mode publish

  publish:
    name: Publish release
    needs:
      - detect
      - create-draft
      - publish-native-assets
      - publish-runtime-components
      - publish-frontend-components
      - publish-store
      - publish-sdk-release
      - sdk-release
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.create-draft.result == 'success'
      && (needs.publish-native-assets.result == 'success' || needs.publish-native-assets.result == 'skipped')
      && (needs.publish-runtime-components.result == 'success' || needs.publish-runtime-components.result == 'skipped')
      && (needs.publish-frontend-components.result == 'success' || needs.publish-frontend-components.result == 'skipped')
      && (needs.publish-store.result == 'success' || needs.publish-store.result == 'skipped')
      && needs.publish-sdk-release.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Upload desktop-to-SDK release mapping
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          DESKTOP_VERSION: ${{ needs.detect.outputs.version }}
          SDK_TAG: ${{ needs.sdk-release.outputs.sdk_tag }}
          SDK_VERSION: ${{ needs.sdk-release.outputs.sdk_version }}
          SDK_SHA: ${{ needs.sdk-release.outputs.sdk_sha }}
          SDK_RELEASE_SHA: ${{ needs.sdk-release.outputs.sdk_release_sha }}
          PROTOCOL_MIN: ${{ needs.sdk-release.outputs.protocol_min }}
          PROTOCOL_MAX: ${{ needs.sdk-release.outputs.protocol_max }}
          HOST_COMPATIBILITY: ${{ needs.sdk-release.outputs.host_compatibility }}
        shell: bash
        run: |
          jq -n \
            --arg desktop_version "$DESKTOP_VERSION" \
            --arg desktop_tag "$RELEASE_TAG" \
            --arg sdk_version "$SDK_VERSION" \
            --arg sdk_tag "$SDK_TAG" \
            --arg sdk_sha "$SDK_SHA" \
            --arg sdk_release_sha "$SDK_RELEASE_SHA" \
            --arg host_compatibility "$HOST_COMPATIBILITY" \
            --argjson protocol_min "$PROTOCOL_MIN" \
            --argjson protocol_max "$PROTOCOL_MAX" \
            '{
              schema_version: 1,
              desktop_version: $desktop_version,
              desktop_tag: $desktop_tag,
              sdk_version: $sdk_version,
              sdk_tag: $sdk_tag,
              sdk_sha: $sdk_sha,
              sdk_release_sha: $sdk_release_sha,
              protocol_min: $protocol_min,
              protocol_max: $protocol_max,
              host_compatibility: $host_compatibility
            }' > openagent-desktop-manifest.json
          gh release upload "$RELEASE_TAG" openagent-desktop-manifest.json --clobber

      - name: Generate release details and download shortcuts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]' \
            > "$RUNNER_TEMP/release-assets.json"
          node scripts/release-notes.mjs \
            --manifest .github/release.json \
            --changelog CHANGELOG.md \
            --assets "$RUNNER_TEMP/release-assets.json" \
            --repository "$GH_REPO" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --draft=false
          --prerelease="$PRERELEASE"

      - name: Update signed runtime component channel
        if: needs.publish-runtime-components.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.detect.outputs.channel }}
        run: |
          component_channel="runtime-$RELEASE_CHANNEL"
          component_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --pattern 'openagent-server-*' \
            --pattern 'openagent-sdk-manifest.json' \
            --pattern 'openagent-sdk-manifest.json.sig' \
            --dir "$component_dir"
          expected_count=6
          actual_count="$(find "$component_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "Expected $expected_count runtime component files, found $actual_count." >&2
            exit 1
          fi

          tag_type="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_type" == "tag" ]]; then
            release_commit="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')"
          elif [[ "$tag_type" == "commit" ]]; then
            release_commit="$tag_object"
          else
            echo "Unsupported release tag object type: $tag_type" >&2
            exit 1
          fi
          channel_is_draft=true
          if gh release view "$component_channel" >/dev/null 2>&1; then
            channel_is_draft="$(gh release view "$component_channel" --json isDraft --jq '.isDraft')"
          else
            gh release create "$component_channel" \
              --draft \
              --target "$release_commit" \
              --title "OpenAgent $RELEASE_CHANNEL runtime channel" \
              --notes "Signed runtime resources for compatible OpenAgent desktop shells." \
              --prerelease
          fi
          gh release upload "$component_channel" "$component_dir"/* --clobber
          if [[ "$channel_is_draft" == "true" ]]; then
            gh release edit "$component_channel" \
              --target "$release_commit" \
              --draft=false \
              --prerelease
          fi

          manifest_url="https://github.com/$GH_REPO/releases/download/$component_channel/openagent-sdk-manifest.json"
          signature_url="$manifest_url.sig"
          for attempt in {1..5}; do
            if curl --fail --location --silent --show-error "$manifest_url" --output /dev/null \
              && curl --fail --location --silent --show-error "$signature_url" --output /dev/null; then
              echo "$component_channel is public with a signed runtime manifest."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "$component_channel did not publish its signed manifest." >&2
          exit 1

      - name: Update signed frontend component channel
        if: needs.publish-frontend-components.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.detect.outputs.channel }}
        run: |
          component_channel="frontend-$RELEASE_CHANNEL"
          component_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --pattern 'openagent-frontend.tar.gz' \
            --pattern 'openagent-frontend-manifest.json' \
            --pattern 'openagent-frontend-manifest.json.sig' \
            --dir "$component_dir"
          actual_count="$(find "$component_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$actual_count" != "3" ]]; then
            echo "Expected three frontend component files, found $actual_count." >&2
            exit 1
          fi

          tag_type="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_type" == "tag" ]]; then
            release_commit="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')"
          elif [[ "$tag_type" == "commit" ]]; then
            release_commit="$tag_object"
          else
            echo "Unsupported release tag object type: $tag_type" >&2
            exit 1
          fi
          channel_is_draft=true
          if gh release view "$component_channel" >/dev/null 2>&1; then
            channel_is_draft="$(gh release view "$component_channel" --json isDraft --jq '.isDraft')"
          else
            gh release create "$component_channel" \
              --draft \
              --target "$release_commit" \
              --title "OpenAgent $RELEASE_CHANNEL frontend channel" \
              --notes "Signed frontend resources for compatible OpenAgent desktop shells." \
              --prerelease
          fi
          gh release upload "$component_channel" "$component_dir"/* --clobber
          if [[ "$channel_is_draft" == "true" ]]; then
            gh release edit "$component_channel" \
              --target "$release_commit" \
              --draft=false \
              --prerelease
          fi

          manifest_url="https://github.com/$GH_REPO/releases/download/$component_channel/openagent-frontend-manifest.json"
          signature_url="$manifest_url.sig"
          for attempt in {1..5}; do
            if curl --fail --location --silent --show-error "$manifest_url" --output /dev/null \
              && curl --fail --location --silent --show-error "$signature_url" --output /dev/null; then
              echo "$component_channel is public with a signed frontend manifest."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "$component_channel did not publish its signed manifest." >&2
          exit 1

      - name: Update prerelease updater channel
        if: needs.detect.outputs.native_shell == 'true' && needs.detect.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.detect.outputs.channel }}
        run: |
          metadata_dir="$(mktemp -d)"
          metadata_path="$metadata_dir/latest.json"
          public_metadata_path="$metadata_dir/public-latest.json"
          gh release download "$RELEASE_TAG" --pattern latest.json --output "$metadata_path" --clobber
          expected_version="$(jq -er '.version' "$metadata_path")"

          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          release_commit="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')"

          channel_is_draft=true
          if gh release view "$RELEASE_CHANNEL" >/dev/null 2>&1; then
            channel_is_draft="$(gh release view "$RELEASE_CHANNEL" --json isDraft --jq '.isDraft')"
          else
            gh release create "$RELEASE_CHANNEL" \
              --draft \
              --target "$release_commit" \
              --title "OpenAgent $RELEASE_CHANNEL updater channel" \
              --notes "This release hosts updater metadata for the current $RELEASE_CHANNEL build." \
              --prerelease
          fi

          gh release upload "$RELEASE_CHANNEL" "$metadata_path" --clobber

          if [[ "$channel_is_draft" == "true" ]]; then
            gh release edit "$RELEASE_CHANNEL" \
              --target "$release_commit" \
              --draft=false \
              --prerelease
          fi

          public_metadata_url="https://github.com/$GH_REPO/releases/download/$RELEASE_CHANNEL/latest.json"
          for attempt in {1..5}; do
            if curl --fail --location --silent --show-error \
              "$public_metadata_url" \
              --output "$public_metadata_path" \
              && jq -e --arg version "$expected_version" \
                '.version == $version and (.platforms | type == "object")' \
                "$public_metadata_path" >/dev/null; then
              echo "$RELEASE_CHANNEL updater metadata is public for $expected_version."
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "$RELEASE_CHANNEL updater metadata is not publicly available for $expected_version." >&2
          exit 1

  archive-prerelease:
    name: Archive prerelease source
    needs:
      - detect
      - publish
    if: >-
      needs.detect.outputs.prerelease == 'true'
      && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0

      - name: Fast-forward the prerelease archive
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_SHA: ${{ needs.detect.outputs.sha }}
          RELEASE_CHANNEL: ${{ needs.detect.outputs.channel }}
        shell: bash
        run: |
          release_line="$(node --input-type=module -e \
            "import { getReleaseLine } from './scripts/release-version.mjs'; console.log(getReleaseLine(process.argv[1]));" \
            "$RELEASE_TAG")"
          archive_branch="release/$RELEASE_CHANNEL/$release_line"

          if git ls-remote --exit-code --heads origin "refs/heads/$archive_branch" >/dev/null; then
            git fetch origin "refs/heads/$archive_branch:refs/remotes/origin/$archive_branch"
            previous="$(git rev-parse "origin/$archive_branch")"
            if ! git merge-base --is-ancestor "$previous" "$RELEASE_SHA"; then
              echo "$archive_branch cannot fast-forward from $previous to $RELEASE_SHA." >&2
              exit 1
            fi
          fi
          git push origin "$RELEASE_SHA:refs/heads/$archive_branch"

  deploy-pages:
    name: Deploy release page
    needs:
      - detect
      - publish
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.detect.outputs.tag }}
