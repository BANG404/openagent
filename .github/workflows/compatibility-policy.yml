name: Publish compatibility policy
run-name: Publish independently versioned compatibility policy

on:
  workflow_dispatch:

concurrency:
  group: compatibility-policy-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Validate declarative policy with the Runtime parser
        run: cargo run --quiet --locked --manifest-path crates/Cargo.toml --package openagent-app --example compatibility-policy -- .github/compatibility-policy.json --unsigned
      - name: Sign policy
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p policy-candidate
          cp .github/compatibility-policy.json policy-candidate/openagent-compatibility-policy.json
          bun scripts/tauri.mjs signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "" policy-candidate/openagent-compatibility-policy.json
      - name: Verify, archive and publish policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-compatibility-policy.mjs policy-candidate
