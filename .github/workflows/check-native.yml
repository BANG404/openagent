name: Native desktop checks

on:
  workflow_call:
    inputs:
      full:
        description: Run cross-platform compilation and integration capabilities
        required: false
        default: false
        type: boolean
      quality:
        description: Run Linux Rust formatting, lint, tests, and boundary checks
        required: false
        default: false
        type: boolean
      platform:
        description: Compile every Rust target on Windows and macOS
        required: false
        default: false
        type: boolean
      embedding:
        description: Verify and exercise the bundled embedding model
        required: false
        default: false
        type: boolean
      harness:
        description: Verify the Harness OpenAPI and server integration contract
        required: false
        default: false
        type: boolean
    secrets:
      OPENAGENT_CI_REPORTER_PRIVATE_KEY:
        required: true
      OPENAGENT_SCCACHE_ACCESS_KEY:
        required: true
      OPENAGENT_SCCACHE_SECRET_KEY:
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    if: inputs.quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Materialize frontendDist for Tauri macros
        run: |
          node -e "require('fs').mkdirSync('build', { recursive: true })"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            libcap-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Materialize Runtime sidecar for Tauri macros
        run: node scripts/prepare-runtime-server.mjs --placeholder

      - name: Verify private SDK boundary
        run: node scripts/verify-private-sdk-boundary.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./sdk -> target
          cache-targets: false

      - uses: ./.github/actions/setup-private-sccache
        with:
          endpoint: ${{ vars.OPENAGENT_SCCACHE_ENDPOINT }}
          bucket: ${{ vars.OPENAGENT_SCCACHE_BUCKET }}
          access-key: ${{ secrets.OPENAGENT_SCCACHE_ACCESS_KEY }}
          secret-key: ${{ secrets.OPENAGENT_SCCACHE_SECRET_KEY }}
          key-prefix: openagent-host/v1

      - name: Prepare pinned Linux sandbox helper
        shell: bash
        run: |
          profile=dev
          github_env=()
          if [[ "${{ inputs.full }}" == "true" ]]; then
            profile=release
            github_env=(--github-env)
          fi
          if ! node scripts/prepare-linux-sandbox-helper.mjs --profile "$profile" "${github_env[@]}" >"$RUNNER_TEMP/linux-sandbox-helper-build.log" 2>&1; then
            echo "::error::Linux sandbox helper build failed; diagnostic output was suppressed."
            exit 1
          fi

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify Linux release sandbox digest guard
        if: inputs.full
        run: cargo check --release --manifest-path sdk/Cargo.toml -p openagent-app

  platform:
    name: Check ${{ matrix.name }}
    if: inputs.full && inputs.platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: '"windows-2025"'
            cache_key: windows-x64
          - name: macOS arm64
            runner: '"macos-15"'
            cache_key: macos-arm64
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Materialize frontendDist for Tauri macros
        run: |
          node -e "require('fs').mkdirSync('build', { recursive: true })"

      - uses: dtolnay/rust-toolchain@stable

      - name: Materialize Runtime sidecar for Tauri macros
        run: node scripts/prepare-runtime-server.mjs --placeholder

      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
        with:
          bun-version: 1.2.21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./sdk -> target
          shared-key: platform-${{ matrix.cache_key }}
          cache-targets: false

      - uses: ./.github/actions/setup-private-sccache
        with:
          endpoint: ${{ vars.OPENAGENT_SCCACHE_ENDPOINT }}
          bucket: ${{ vars.OPENAGENT_SCCACHE_BUCKET }}
          access-key: ${{ secrets.OPENAGENT_SCCACHE_ACCESS_KEY }}
          secret-key: ${{ secrets.OPENAGENT_SCCACHE_SECRET_KEY }}
          key-prefix: openagent-host/v1

      - name: Build pinned Windows sandbox helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          bun run prepare:windows-sandbox:dev *> $log
          if ($LASTEXITCODE -ne 0) {
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            Write-Error "Windows sandbox helper build failed; private diagnostic output was suppressed."
            exit 1
          }

      - name: Check all Rust targets on Windows
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Exercise the Windows restricted-token filesystem boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = (Resolve-Path "src-tauri\target").Path
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          cargo test --manifest-path sdk/Cargo.toml -p openagent-server restricted_token_writes_workspace_and_blocks_outside_and_metadata *>> $log
          if ($LASTEXITCODE -ne 0) {
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            Write-Error "Windows process sandbox test failed; private diagnostic output was suppressed."
            exit 1
          }

      - name: Exercise the Windows offline-account network boundary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENAGENT_WINDOWS_WFP_INTEGRATION: "1"
          OPENAGENT_WINDOWS_NETWORK_PRIVATE_DIAGNOSTIC: "1"
          SBX_DEBUG: "1"
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $disabledProfiles = Get-NetFirewallProfile | Where-Object { -not $_.Enabled }
          if ($disabledProfiles) {
            Write-Error "Windows Firewall profiles could not be enabled for the sandbox boundary test."
            exit 1
          }
          $env:CARGO_TARGET_DIR = (Resolve-Path "src-tauri\target").Path
          $log = "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          $tests = @(
            "elevated_offline_account_firewall_blocks_non_loopback_network_access",
            "elevated_offline_account_wfp_blocks_dns_network_access"
          )
          $failed = $false
          foreach ($test in $tests) {
            cargo test --manifest-path sdk/Cargo.toml -p openagent-server $test -- --test-threads=1 *>> $log
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              break
            }
          }
          if ($failed) {
            "sdk-windows-sandbox-test.log" | Out-File "$env:RUNNER_TEMP/sdk-private-diagnostic-name" -Encoding ascii
            $diagnostic = Select-String -Path $log -Pattern 'OPENAGENT_WFP_DIAGNOSTIC=[a-z-]+' -AllMatches |
              ForEach-Object { $_.Matches.Value } |
              Select-Object -Last 1
            if ($diagnostic) {
              Write-Error "Windows offline-network sandbox test failed: $diagnostic. Private diagnostic output was suppressed."
            } else {
              Write-Error "Windows offline-network sandbox test failed; private diagnostic output was suppressed."
            }
            exit 1
          }

      - name: Create private SDK diagnostic token
        id: sdk-diagnostic-token
        if: failure() && runner.os == 'Windows'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-checks: write
          permission-contents: read

      - name: Report Windows diagnostic to private SDK
        if: failure() && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ steps.sdk-diagnostic-token.outputs.token }}
          SDK_REPOSITORY: BANG404/openagent-sdk
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
          SDK_DIAGNOSTIC_NAME: Public host Windows process sandbox
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-private-sdk-diagnostic.mjs

      - name: Check all Rust targets on macOS
        if: runner.os != 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  embedding-resources:
    name: Verify embedding resources
    if: inputs.embedding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Verify bundled embedding resources
        run: bun run check:embedding-model

  embedding-platform:
    name: Exercise embedding model on ${{ matrix.name }}
    if: inputs.full && inputs.embedding
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: '"windows-2025"'
            cache_key: windows-x64
          - name: macOS arm64
            runner: '"macos-15"'
            cache_key: macos-arm64
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Materialize frontendDist for Tauri macros
        run: |
          node -e "require('fs').mkdirSync('build', { recursive: true })"

      - uses: dtolnay/rust-toolchain@stable

      - name: Materialize Runtime sidecar for Tauri macros
        run: node scripts/prepare-runtime-server.mjs --placeholder

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: embedding-${{ matrix.cache_key }}
          cache-targets: false

      - uses: ./.github/actions/setup-private-sccache
        with:
          endpoint: ${{ vars.OPENAGENT_SCCACHE_ENDPOINT }}
          bucket: ${{ vars.OPENAGENT_SCCACHE_BUCKET }}
          access-key: ${{ secrets.OPENAGENT_SCCACHE_ACCESS_KEY }}
          secret-key: ${{ secrets.OPENAGENT_SCCACHE_SECRET_KEY }}
          key-prefix: openagent-host/v1

      - name: Exercise bundled embedding model
        run: cargo test --manifest-path src-tauri/Cargo.toml bundled_embedding_model_runs_offline

  harness:
    name: Harness contract
    if: inputs.harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./sdk -> target
          shared-key: harness
          cache-targets: false

      - uses: ./.github/actions/setup-private-sccache
        with:
          endpoint: ${{ vars.OPENAGENT_SCCACHE_ENDPOINT }}
          bucket: ${{ vars.OPENAGENT_SCCACHE_BUCKET }}
          access-key: ${{ secrets.OPENAGENT_SCCACHE_ACCESS_KEY }}
          secret-key: ${{ secrets.OPENAGENT_SCCACHE_SECRET_KEY }}
          key-prefix: openagent-host/v1

      - name: Verify harness OpenAPI contract
        run: bun run check:harness-openapi

      - name: Exercise the harness server contract
        if: inputs.full
        run: bun run test:harness-integration

  required:
    name: Required native capabilities
    if: always()
    needs:
      - quality
      - platform
      - embedding-resources
      - embedding-platform
      - harness
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: success
      CI_RESULT_MODULES: quality,platform,embedding-resources,embedding-platform,harness
      QUALITY_SELECTED: ${{ inputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PLATFORM_SELECTED: ${{ inputs.full && inputs.platform }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
      EMBEDDING_RESOURCES_SELECTED: ${{ inputs.embedding }}
      EMBEDDING_RESOURCES_RESULT: ${{ needs.embedding-resources.result }}
      EMBEDDING_PLATFORM_SELECTED: ${{ inputs.full && inputs.embedding }}
      EMBEDDING_PLATFORM_RESULT: ${{ needs.embedding-platform.result }}
      HARNESS_SELECTED: ${{ inputs.harness }}
      HARNESS_RESULT: ${{ needs.harness.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Require every selected native capability to pass
        run: node scripts/verify-ci-results.mjs
