name: Native desktop checks

on:
  workflow_call:
    inputs:
      full:
        description: Run cross-platform compilation and integration capabilities
        required: false
        default: false
        type: boolean
      quality:
        description: Run Linux Rust formatting, lint, tests, and boundary checks
        required: false
        default: false
        type: boolean
      platform:
        description: Compile every Rust target on Windows and macOS
        required: false
        default: false
        type: boolean
      embedding:
        description: Verify and exercise the bundled embedding model
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    if: inputs.quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Materialize frontendDist for Tauri macros
        run: |
          node -e "for(const p of ['build','.cache/bootstrap-dist'])require('fs').mkdirSync(p,{recursive:true})"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            libcap-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Materialize Runtime sidecar for Tauri macros
        run: node scripts/prepare-runtime-server.mjs --placeholder

      - name: Verify private SDK boundary
        run: node scripts/verify-private-sdk-boundary.mjs

      - name: Prepare bundled plugin Node.js
        run: node scripts/prepare-node-runtime.mjs

      - name: Prepare bundled terminal tools
        run: node scripts/prepare-terminal-tools.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: public-host-linux
          cache-targets: true

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path crates/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: |
          cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: |
          cargo test --manifest-path crates/Cargo.toml --workspace --all-features
          cargo test --manifest-path src-tauri/Cargo.toml

  platform:
    name: Check ${{ matrix.name }}
    if: inputs.full && inputs.platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: '"windows-2025"'
            cache_key: windows-x64
          - name: macOS arm64
            runner: '"macos-15"'
            cache_key: macos-arm64
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Materialize frontendDist for Tauri macros
        run: |
          node -e "for(const p of ['build','.cache/bootstrap-dist'])require('fs').mkdirSync(p,{recursive:true})"

      - uses: dtolnay/rust-toolchain@stable

      - name: Materialize Runtime sidecar for Tauri macros
        run: node scripts/prepare-runtime-server.mjs --placeholder

      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
        with:
          bun-version: 1.3.14

      - name: Prepare bundled plugin Node.js
        run: node scripts/prepare-node-runtime.mjs

      - name: Prepare bundled terminal tools
        run: node scripts/prepare-terminal-tools.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: platform-${{ matrix.cache_key }}
          cache-targets: true

      - name: Check all Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test public Rust product policies
        run: cargo test --manifest-path crates/Cargo.toml --workspace --all-features

  embedding-resources:
    name: Verify embedding resources
    if: inputs.embedding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify bundled embedding resources
        run: bun run check:embedding-model

  required:
    name: Required native capabilities
    if: always()
    needs:
      - quality
      - platform
      - embedding-resources
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: success
      CI_RESULT_MODULES: quality,platform,embedding-resources
      QUALITY_SELECTED: ${{ inputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PLATFORM_SELECTED: ${{ inputs.full && inputs.platform }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
      EMBEDDING_RESOURCES_SELECTED: ${{ inputs.embedding }}
      EMBEDDING_RESOURCES_RESULT: ${{ needs.embedding-resources.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Require every selected native capability to pass
        run: node scripts/verify-ci-results.mjs
