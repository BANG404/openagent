name: Native desktop checks

on:
  workflow_call:
    inputs:
      full:
        description: Run cross-platform compilation and integration capabilities
        required: false
        default: false
        type: boolean
      quality:
        description: Run Linux Rust formatting, lint, tests, and boundary checks
        required: false
        default: false
        type: boolean
      platform:
        description: Compile every Rust target on Windows and macOS
        required: false
        default: false
        type: boolean
      embedding:
        description: Verify and exercise the bundled embedding model
        required: false
        default: false
        type: boolean
      harness:
        description: Verify the Harness OpenAPI and server integration contract
        required: false
        default: false
        type: boolean
    secrets:
      OPENAGENT_SDK_DEPLOY_KEY:
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    if: inputs.quality
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify private SDK boundary
        run: node scripts/verify-private-sdk-boundary.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./sdk -> target
          cache-targets: false

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  platform:
    name: Check ${{ matrix.name }}
    if: inputs.full && inputs.platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
        with:
          bun-version: 1.2.21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./sdk -> target
          shared-key: platform-${{ matrix.os }}
          cache-targets: false

      - name: Build pinned Windows sandbox helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun run prepare:windows-sandbox:dev *> "$env:RUNNER_TEMP/windows-sandbox-helper-build.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows sandbox helper build failed; diagnostic output was suppressed."
            exit 1
          }

      - name: Check all Rust targets on Windows
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Exercise the Windows restricted-token filesystem boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = (Resolve-Path "src-tauri\target").Path
          cargo test --manifest-path sdk/Cargo.toml -p openagent-server restricted_token_writes_workspace_and_blocks_outside_and_metadata *> "$env:RUNNER_TEMP/sdk-windows-sandbox-test.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows process sandbox test failed; private diagnostic output was suppressed."
            exit 1
          }

      - name: Exercise the Windows offline-account network boundary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENAGENT_WINDOWS_WFP_INTEGRATION: "1"
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $disabledProfiles = Get-NetFirewallProfile | Where-Object { -not $_.Enabled }
          if ($disabledProfiles) {
            Write-Error "Windows Firewall profiles could not be enabled for the sandbox boundary test."
            exit 1
          }
          $env:CARGO_TARGET_DIR = (Resolve-Path "src-tauri\target").Path
          $log = "$env:RUNNER_TEMP/sdk-windows-wfp-test.log"
          $tests = @(
            "elevated_offline_account_firewall_blocks_non_loopback_network_access",
            "elevated_offline_account_wfp_blocks_dns_network_access"
          )
          $failed = $false
          foreach ($test in $tests) {
            cargo test --manifest-path sdk/Cargo.toml -p openagent-server $test *>> $log
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              break
            }
          }
          if ($failed) {
            $diagnostic = Select-String -Path $log -Pattern 'OPENAGENT_WFP_DIAGNOSTIC=[a-z-]+' -AllMatches |
              ForEach-Object { $_.Matches.Value } |
              Select-Object -Last 1
            if ($diagnostic) {
              Write-Error "Windows offline-network sandbox test failed: $diagnostic. Private diagnostic output was suppressed."
            } else {
              Write-Error "Windows offline-network sandbox test failed; private diagnostic output was suppressed."
            }
            exit 1
          }

      - name: Check all Rust targets on macOS
        if: runner.os != 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  embedding-resources:
    name: Verify embedding resources
    if: inputs.embedding
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Verify bundled embedding resources
        run: bun run check:embedding-model

  embedding-platform:
    name: Exercise embedding model on ${{ matrix.name }}
    if: inputs.full && inputs.embedding
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: embedding-${{ matrix.os }}
          cache-targets: false

      - name: Exercise bundled embedding model
        run: cargo test --manifest-path src-tauri/Cargo.toml bundled_embedding_model_runs_offline

  harness:
    name: Harness contract
    if: inputs.harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./sdk -> target
          shared-key: harness
          cache-targets: false

      - name: Verify harness OpenAPI contract
        run: bun run check:harness-openapi

      - name: Exercise the harness server contract
        if: inputs.full
        run: bun run test:harness-integration

  required:
    name: Required native capabilities
    if: always()
    needs:
      - quality
      - platform
      - embedding-resources
      - embedding-platform
      - harness
    runs-on: ubuntu-22.04
    env:
      CHANGES_RESULT: success
      CI_RESULT_MODULES: quality,platform,embedding-resources,embedding-platform,harness
      QUALITY_SELECTED: ${{ inputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PLATFORM_SELECTED: ${{ inputs.full && inputs.platform }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
      EMBEDDING_RESOURCES_SELECTED: ${{ inputs.embedding }}
      EMBEDDING_RESOURCES_RESULT: ${{ needs.embedding-resources.result }}
      EMBEDDING_PLATFORM_SELECTED: ${{ inputs.full && inputs.embedding }}
      EMBEDDING_PLATFORM_RESULT: ${{ needs.embedding-platform.result }}
      HARNESS_SELECTED: ${{ inputs.harness }}
      HARNESS_RESULT: ${{ needs.harness.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Require every selected native capability to pass
        run: node scripts/verify-ci-results.mjs
