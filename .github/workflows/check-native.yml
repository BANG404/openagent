name: Native desktop checks

on:
  workflow_call:
    inputs:
      quality:
        description: Run Linux Rust formatting, lint, tests, and boundary checks
        required: false
        default: false
        type: boolean
      platform:
        description: Compile every Rust target on Windows and macOS
        required: false
        default: false
        type: boolean
      embedding:
        description: Verify and exercise the bundled embedding model
        required: false
        default: false
        type: boolean
      harness:
        description: Verify the Harness OpenAPI and server integration contract
        required: false
        default: false
        type: boolean
    secrets:
      OPENAGENT_SDK_DEPLOY_KEY:
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    if: inputs.quality
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify private SDK boundary
        run: node scripts/verify-private-sdk-boundary.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./sdk -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  platform:
    name: Check ${{ matrix.name }}
    if: inputs.platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: platform-${{ matrix.os }}
          # Restored Windows native artifacts can retain incompatible DLL state
          # and fail before the Rust test harness starts (0xc0000139).
          cache-targets: ${{ runner.os != 'Windows' }}
          key: ${{ runner.os == 'Windows' && 'registry-only-v1' || '' }}

      - name: Set up sccache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Check all Rust targets on Windows
        if: runner.os == 'Windows'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Check all Rust targets on macOS
        if: runner.os != 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Report sccache statistics
        if: always() && runner.os == 'Windows'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  embedding-resources:
    name: Verify embedding resources
    if: inputs.embedding
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Verify bundled embedding resources
        run: bun run check:embedding-model

  embedding-platform:
    name: Exercise embedding model on ${{ matrix.name }}
    if: inputs.embedding
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: embedding-${{ matrix.os }}
          cache-targets: ${{ runner.os != 'Windows' }}
          key: ${{ runner.os == 'Windows' && 'registry-only-v1' || '' }}

      - name: Set up sccache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Exercise bundled embedding model
        env:
          SCCACHE_GHA_ENABLED: ${{ runner.os == 'Windows' && 'true' || '' }}
          RUSTC_WRAPPER: ${{ runner.os == 'Windows' && 'sccache' || '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml bundled_embedding_model_runs_offline

      - name: Report sccache statistics
        if: always() && runner.os == 'Windows'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  harness:
    name: Harness contract
    if: inputs.harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Check out private SDK
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          ssh-key: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./sdk -> target
          shared-key: harness

      - name: Verify harness OpenAPI contract
        run: bun run check:harness-openapi

      - name: Exercise the harness server contract
        run: bun run test:harness-integration

  required:
    name: Required native capabilities
    if: always()
    needs:
      - quality
      - platform
      - embedding-resources
      - embedding-platform
      - harness
    runs-on: ubuntu-22.04
    env:
      CHANGES_RESULT: success
      CI_RESULT_MODULES: quality,platform,embedding-resources,embedding-platform,harness
      QUALITY_SELECTED: ${{ inputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PLATFORM_SELECTED: ${{ inputs.platform }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
      EMBEDDING_RESOURCES_SELECTED: ${{ inputs.embedding }}
      EMBEDDING_RESOURCES_RESULT: ${{ needs.embedding-resources.result }}
      EMBEDDING_PLATFORM_SELECTED: ${{ inputs.embedding }}
      EMBEDDING_PLATFORM_RESULT: ${{ needs.embedding-platform.result }}
      HARNESS_SELECTED: ${{ inputs.harness }}
      HARNESS_RESULT: ${{ needs.harness.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Require every selected native capability to pass
        run: node scripts/verify-ci-results.mjs
