name: Frontend checks

on:
  workflow_call:
    inputs:
      full:
        description: Build production assets and enforce bundle budgets
        required: false
        default: false
        type: boolean
    secrets:
      OPENAGENT_CI_REPORTER_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  frontend:
    name: Type and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Fetch public TypeScript SDK for fork pull request
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          archive="$RUNNER_TEMP/openagent-typescript-sdk.tar.gz"
          node scripts/fetch-public-typescript-sdk.mjs \
            --sdk-sha "${{ steps.sdk.outputs.sha }}" \
            --output "$archive"
          mkdir -p sdk/typescript
          tar -xzf "$archive" -C sdk/typescript

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Lint frontend source
        run: bun run lint:frontend

      - name: Check frontend formatting
        run: bun run format:check

      - name: Run frontend tests
        run: bun run test

      - name: Build frontend
        if: inputs.full
        run: bun run build

      - name: Check frontend bundle budgets
        if: inputs.full
        run: bun run check:bundle-size
