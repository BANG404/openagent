name: Frontend checks

on:
  workflow_call:
    inputs:
      base_sha:
        description: Immutable baseline for affected test selection
        required: false
        default: ""
        type: string
      full:
        description: Build production assets and enforce bundle budgets
        required: false
        default: false
        type: boolean
      external_build:
        description: Release caller owns the same-source qualified production assets
        default: false
        type: boolean
    secrets:
      OPENAGENT_CI_REPORTER_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  frontend:
    name: Type and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare independent plugin sources
        run: node scripts/prepare-plugin-sources.mjs

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Fetch public TypeScript SDK for fork pull request
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          archive="$RUNNER_TEMP/openagent-typescript-sdk.tar.gz"
          node scripts/fetch-public-typescript-sdk.mjs \
            --sdk-sha "${{ steps.sdk.outputs.sha }}" \
            --output "$archive"
          mkdir -p sdk/typescript
          tar -xzf "$archive" -C sdk/typescript

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: bun-public-${{ runner.os }}-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: bun audit

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Check test TypeScript
        run: bun run check:tests

      - name: Lint frontend source
        run: bun run lint:frontend

      - name: Check frontend formatting
        run: bun run format:check

      - name: Run frontend tests
        env:
          TEST_BASE_SHA: ${{ inputs.base_sha }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TEST_FULL: ${{ inputs.full }}
        run: bun scripts/run-selected-tests.mjs --scope frontend

  production:
    name: Production assets
    if: inputs.full && !inputs.external_build
    uses: ./.github/workflows/build-frontend.yml
    secrets: inherit
