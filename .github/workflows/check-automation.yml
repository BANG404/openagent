name: Automation checks

on:
  workflow_call:
    secrets:
      OPENAGENT_CI_REPORTER_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  actions:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve pinned SDK revision
        id: sdk
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:sdk)" >> "$GITHUB_OUTPUT"

      - name: Create private SDK read token
        id: sdk-read-token
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENAGENT_CI_REPORTER_APP_ID }}
          private-key: ${{ secrets.OPENAGENT_CI_REPORTER_PRIVATE_KEY }}
          owner: BANG404
          repositories: openagent-sdk
          permission-contents: read

      - name: Check out private SDK
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: BANG404/openagent-sdk
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk
          token: ${{ steps.sdk-read-token.outputs.token }}
          persist-credentials: false

      - name: Fetch public TypeScript SDK for fork pull request
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          archive="$RUNNER_TEMP/openagent-typescript-sdk.tar.gz"
          node scripts/fetch-public-typescript-sdk.mjs \
            --sdk-sha "${{ steps.sdk.outputs.sha }}" \
            --output "$archive"
          mkdir -p sdk/typescript
          tar -xzf "$archive" -C sdk/typescript

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check test TypeScript
        run: bun run check:tests

      - name: Validate GitHub Actions
        run: bun run lint:actions

      - name: Lint JavaScript and frontend source
        run: bun run lint:frontend

      - name: Check repository formatting
        run: bun run format:check

      - name: Test automation policy and release logic
        run: >-
          bun test
          tests/ciChanges.test.js
          tests/ciReuse.test.js
          tests/ciResults.test.js
          tests/docsSync.test.js
          tests/privateSdkDiagnostic.test.js
          tests/releaseCi.test.js
          tests/releaseVersion.test.js
          scripts/release-candidate-artifacts.test.mjs
          scripts/release-workflow.test.mjs

      - name: Verify generated release metadata
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 \
            && ! git diff --quiet HEAD^ HEAD -- .github/release.json; then
            ready="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).ready")"
            if [[ "$ready" == "true" ]]; then
              bun scripts/release.mjs --verify
            fi
          fi
