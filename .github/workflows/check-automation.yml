name: Automation checks

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ""
      full:
        type: boolean
        default: false
    secrets:
      OPENAGENT_CI_REPORTER_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  actions:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare independent plugin sources
        run: |
          node scripts/prepare-plugin-sources.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: bun-public-${{ runner.os }}-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check test TypeScript
        run: bun run check:tests

      - name: Validate GitHub Actions
        run: bun run lint:actions

      - name: Lint JavaScript and frontend source
        run: bun run lint:frontend

      - name: Check repository formatting
        run: bun run format:check

      - name: Test automation policy and release logic
        env:
          TEST_BASE_SHA: ${{ inputs.base_sha }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TEST_FULL: ${{ inputs.full }}
        run: bun scripts/run-selected-tests.mjs --scope automation

      - name: Verify generated release metadata
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 \
            && [[ -n "$(git diff-tree --no-commit-id --name-only -r --cc HEAD -- .github/release.json)" ]]; then
            ready="$(node -p "JSON.parse(require('fs').readFileSync('.github/release.json', 'utf8')).ready")"
            if [[ "$ready" == "true" ]]; then
              bun scripts/release.mjs --verify
            fi
          fi
