name: CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit used for module change detection
        required: false
        type: string
  pull_request:
  push:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-22.04
    outputs:
      automation: ${{ steps.modules.outputs.automation }}
      frontend: ${{ steps.modules.outputs.frontend }}
      native: ${{ steps.modules.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: modules
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          CI_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha == '' }}
        run: node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"

      - name: Require agent-facing documentation for logic changes
        env:
          DOCS_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/check-docs-sync.mjs

  automation:
    name: Automation
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    uses: ./.github/workflows/check-automation.yml
    permissions:
      contents: read

  frontend:
    name: Frontend
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/check-frontend.yml
    permissions:
      contents: read
    secrets:
      OPENAGENT_SDK_DEPLOY_KEY: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}

  native:
    name: Native desktop
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/check-native.yml
    permissions:
      contents: read
    secrets:
      OPENAGENT_SDK_DEPLOY_KEY: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}

  required:
    name: Required
    if: always()
    needs:
      - changes
      - automation
      - frontend
      - native
    runs-on: ubuntu-22.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      AUTOMATION_SELECTED: ${{ needs.changes.outputs.automation }}
      AUTOMATION_RESULT: ${{ needs.automation.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Require every selected module to pass
        run: node scripts/verify-ci-results.mjs
