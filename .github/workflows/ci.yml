name: CI

on:
  workflow_call:
    inputs:
      base_sha:
        required: false
        type: string
      full:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit used for module change detection
        required: false
        type: string
  pull_request:
  merge_group:
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    outputs:
      automation: ${{ steps.selection.outputs.automation }}
      frontend: ${{ steps.selection.outputs.frontend }}
      native_quality: ${{ steps.selection.outputs.nativeQuality }}
      native_platform: ${{ steps.selection.outputs.nativePlatform }}
      embedding: ${{ steps.selection.outputs.embedding }}
      harness: ${{ steps.selection.outputs.harness }}
      full: ${{ steps.tier.outputs.full }}
      reused: ${{ steps.selection.outputs.reused }}
      reuse_source_sha: ${{ steps.reuse.outputs.sourceSha }}
      reuse_source_tree: ${{ steps.reuse.outputs.sourceTree }}
      reuse_source_runs: ${{ steps.reuse.outputs.sourceRuns }}
    steps:
      - name: Resolve CI route
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          bypass_trusted_pull_request=false
          if [[ "$CI_EVENT_NAME" == "pull_request" && -n "$CI_PR_AUTHOR" ]]; then
            is_admin="$(
              gh api "repos/$GITHUB_REPOSITORY/collaborators/$CI_PR_AUTHOR/permission" \
                --jq '.user.permissions.admin // false' 2>/dev/null || echo false
            )"
            if [[ "$is_admin" == "true" ]]; then
              bypass_trusted_pull_request=true
            fi
          fi
          echo "bypassTrustedPullRequest=$bypass_trusted_pull_request" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        with:
          fetch-depth: 0

      - name: Resolve verification tier
        id: tier
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REQUEST_FULL: ${{ inputs.full || false }}
        shell: bash
        run: |
          full=false
          integration=false

          if [[ "$CI_EVENT" == "schedule" \
            || "$CI_EVENT" == "workflow_dispatch" \
            || "$CI_EVENT" == "workflow_call" \
            || "$CI_REQUEST_FULL" == "true" ]]; then
            full=true
          fi

          if [[ "$full" == "true" ]]; then
            integration=true
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

      - name: Resolve checked-out Git tree
        id: tree
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        shell: bash
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Resolve authoritative tree-equivalent CI
        id: reuse
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_TARGET_TREE: ${{ steps.tree.outputs.sha }}
          CI_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          CI_FULL: ${{ steps.tier.outputs.full }}
        run: node scripts/ci-reuse.mjs resolve

      - name: Classify changed files
        id: modules
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          CI_FORCE_ALL: >-
            ${{
              steps.tier.outputs.integration == 'true'
              || (github.event_name == 'workflow_dispatch' && inputs.base_sha == '')
            }}
        run: node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"

      - name: Select capabilities not already verified
        id: selection
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        env:
          CI_FULL: ${{ steps.tier.outputs.full }}
          CI_REQUEST_AUTOMATION: ${{ steps.modules.outputs.automation }}
          CI_REQUEST_FRONTEND: ${{ steps.modules.outputs.frontend }}
          CI_REQUEST_NATIVE_QUALITY: ${{ steps.modules.outputs.nativeQuality }}
          CI_REQUEST_NATIVE_PLATFORM: ${{ steps.modules.outputs.nativePlatform }}
          CI_REQUEST_EMBEDDING: ${{ steps.modules.outputs.embedding }}
          CI_REQUEST_HARNESS: ${{ steps.modules.outputs.harness }}
          CI_REUSE_AUTOMATION: ${{ steps.reuse.outputs.automation }}
          CI_REUSE_FRONTEND: ${{ steps.reuse.outputs.frontend }}
          CI_REUSE_NATIVE_QUALITY: ${{ steps.reuse.outputs.nativeQuality }}
          CI_REUSE_NATIVE_PLATFORM: ${{ steps.reuse.outputs.nativePlatform }}
          CI_REUSE_EMBEDDING: ${{ steps.reuse.outputs.embedding }}
          CI_REUSE_HARNESS: ${{ steps.reuse.outputs.harness }}
        run: node scripts/ci-reuse.mjs select

      - name: Summarize reused verification
        if: steps.selection.outputs.reused != ''
        env:
          REUSED_CAPABILITIES: ${{ steps.selection.outputs.reused }}
          REUSE_SOURCE_SHA: ${{ steps.reuse.outputs.sourceSha }}
          REUSE_SOURCE_TREE: ${{ steps.reuse.outputs.sourceTree }}
          REUSE_SOURCE_RUNS: ${{ steps.reuse.outputs.sourceRuns }}
        shell: bash
        run: |
          {
            echo "### Reused authoritative CI"
            echo
            echo "- Capabilities: \`$REUSED_CAPABILITIES\`"
            echo "- Source commit: \`$REUSE_SOURCE_SHA\`"
            echo "- Exact tree: \`$REUSE_SOURCE_TREE\`"
            echo "- Source runs: $REUSE_SOURCE_RUNS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require agent-facing documentation for logic changes
        if: steps.route.outputs.bypassTrustedPullRequest != 'true'
        env:
          DOCS_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/check-docs-sync.mjs

  automation:
    name: Automation
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    uses: ./.github/workflows/check-automation.yml
    permissions:
      contents: read

  frontend:
    name: Frontend
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/check-frontend.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
    permissions:
      contents: read
    secrets:
      OPENAGENT_SDK_DEPLOY_KEY: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}

  native:
    name: Native desktop
    needs: changes
    if: >-
      (needs.changes.outputs.native_quality == 'true'
      || needs.changes.outputs.native_platform == 'true'
      || needs.changes.outputs.embedding == 'true'
      || needs.changes.outputs.harness == 'true')
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/check-native.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
      quality: ${{ needs.changes.outputs.native_quality == 'true' }}
      platform: ${{ needs.changes.outputs.native_platform == 'true' }}
      embedding: ${{ needs.changes.outputs.embedding == 'true' }}
      harness: ${{ needs.changes.outputs.harness == 'true' }}
    permissions:
      contents: read
    secrets:
      OPENAGENT_SDK_DEPLOY_KEY: ${{ secrets.OPENAGENT_SDK_DEPLOY_KEY }}

  required:
    name: Required
    if: always()
    needs:
      - changes
      - automation
      - frontend
      - native
    runs-on: ubuntu-22.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      AUTOMATION_SELECTED: ${{ needs.changes.outputs.automation }}
      AUTOMATION_RESULT: ${{ needs.automation.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      NATIVE_SELECTED: >-
        ${{ needs.changes.outputs.native_quality == 'true'
        || needs.changes.outputs.native_platform == 'true'
        || needs.changes.outputs.embedding == 'true'
        || needs.changes.outputs.harness == 'true' }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Require every selected module to pass
        run: node scripts/verify-ci-results.mjs
