name: openagent-ci

services:
  runner:
    build:
      context: .
    container_name: openagent-sdk-runner
    restart: unless-stopped
    environment:
      RUNNER_REPOSITORY: ${RUNNER_REPOSITORY}
      RUNNER_NAME: ${RUNNER_NAME}
      RUNNER_LABELS: ${RUNNER_LABELS}
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: ${RUNNER_HTTP_PROXY:-}
      HTTPS_PROXY: ${RUNNER_HTTP_PROXY:-}
      NO_PROXY: ${RUNNER_NO_PROXY:-127.0.0.1,localhost}
      http_proxy: ${RUNNER_HTTP_PROXY:-}
      https_proxy: ${RUNNER_HTTP_PROXY:-}
      no_proxy: ${RUNNER_NO_PROXY:-127.0.0.1,localhost}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./state/runner:/runner
      - ./state/runner-home:/runner-home
      - ./state/sccache:/var/cache/openagent-sccache
    mem_limit: 4g
    cpus: 3

  passnat-ssh:
    image: debian:bookworm-slim
    container_name: openagent-passnat-ssh
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/usr/local/bin/frpc"]
    command: ["-c", "/etc/frpc/passnat-ssh.toml"]
    volumes:
      - ${FRPC_BIN}:/usr/local/bin/frpc:ro
      - ./secrets/passnat-ssh.toml:/etc/frpc/passnat-ssh.toml:ro
