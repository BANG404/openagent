[scenario]
name = "user Markdown survives sending, collapsing and editing"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "composer and editable/read-only bubbles share block formatting"
action = "eval"
script = '''(async () => {
  const root = document.querySelector('.user-markdown-preview');
  const editor = root.querySelector('[contenteditable="true"]');
  const settle = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const focusComposer = async () => {
    const previous = document.activeElement;
    editor.focus();
    // A locked/background Windows desktop updates activeElement without focus
    // events. Exercise the same row handler when the OS withholds those events.
    if (!document.hasFocus()) previous?.dispatchEvent(new FocusEvent('focusout', {bubbles:true,relatedTarget:editor}));
    await settle();
  };
  let source = '# 你调用终端试试\n\n> quoted **bold**\n- item\n2. second\n- [ ] todo\n- [x] done\n**bold** *italic* ~~gone~~ `code` [link](https://example.com) [Image #1] @agent #file.ts\n```md\n# **literal**\n```\n<script>window.__userMarkdownExecuted = true</script>\n' + 'long wrapped text '.repeat(60);
  editor.focus();
  const range = document.createRange(); range.selectNodeContents(editor);
  const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
  (() => { document.dispatchEvent(new Event('selectionchange')); const clipboard = new DataTransfer(); clipboard.setData('text/plain', ({ inputType: 'insertText', data: source, bubbles: true, cancelable: true }).data); editor.dispatchEvent(new ClipboardEvent('paste', {clipboardData:clipboard,bubbles:true,cancelable:true})); })();
  await settle();
  assert(editor.querySelector('h1').textContent === '你调用终端试试', 'composer title missing');
  document.querySelector('.tiptap').dispatchEvent(new KeyboardEvent('keydown', {key:'a',ctrlKey:true,bubbles:true,cancelable:true}));
  await settle();
  const clipboard = new DataTransfer();
  editor.dispatchEvent(new ClipboardEvent('copy', {clipboardData:clipboard,bubbles:true,cancelable:true}));
  source = clipboard.getData('text/plain');
  root.querySelector('.send-btn').click(); await settle();
  const bubble = () => root.querySelector('.user-content');
  const content = () => root.querySelector('.user-content-text');
  const openEdit = async () => {
    bubble().focus();
    // Reproduce a queued focusout from the bubble being replaced. Its tick
    // continuation can run before startEdit's textarea focus continuation.
    bubble().dispatchEvent(new FocusEvent('focusout', {bubbles:true}));
    bubble().click();
    await settle();
    const textbox = root.querySelector('.user-content-edit');
    assert(textbox && document.activeElement === textbox, 'focused bubble could not hand focus to the editor: ' + JSON.stringify({textbox:!!textbox, active:document.activeElement?.className, focus:document.hasFocus()}));
  };
  assert(content().querySelector('.composer-block-heading').textContent === '你调用终端试试', 'sending lost the formatted heading');
  const projection = content().innerHTML;
  assert(content().querySelectorAll('.composer-block-listItem').length === 4, 'list/task blocks missing');
  assert(content().querySelector('.composer-block-quote strong').textContent === 'bold', 'quoted formatting missing');
  assert([...content().querySelectorAll('.composer-block-codeBlock')].some(line => line.textContent === '# **literal**'), 'fenced code parsed as Markdown');
  assert(content().querySelector('.composer-chip-attachment').textContent === '[Image #1]', 'attachment reference split');
  assert(content().querySelectorAll('.composer-chip-token').length === 2, 'mention/file tokens changed');
  assert(!content().querySelector('script,img,iframe') && !window.__userMarkdownExecuted, 'raw HTML executed');
  assert(bubble().classList.contains('collapsed') && content().scrollHeight > content().clientHeight, 'long blocks failed to collapse');
  const collapsedHeight = content().clientHeight;
  root.querySelector('.user-collapse-btn').click(); await settle();
  assert(!bubble().classList.contains('collapsed') && content().clientHeight > collapsedHeight, 'expand failed');
  root.querySelector('.user-collapse-btn').click(); await settle();
  assert(bubble().classList.contains('collapsed'), 'collapse failed');
  await openEdit();
  let textarea = root.querySelector('.user-content-edit');
  assert(textarea.value === source, 'editing lost raw Markdown');
  await new Promise(resolve => setTimeout(resolve, 1200));
  assert(document.activeElement === textarea && textarea.isConnected, 'editor lost focus while idle');
  textarea.value = '# 输入中'; textarea.dispatchEvent(new Event('input', { bubbles: true })); await settle();
  for (const event of [
    new KeyboardEvent('keydown', {key:'Enter',isComposing:true,bubbles:true,cancelable:true}),
    new KeyboardEvent('keydown', {key:'Enter',keyCode:229,bubbles:true,cancelable:true}),
    new KeyboardEvent('keydown', {key:'Escape',isComposing:true,bubbles:true,cancelable:true}),
  ]) {
    textarea.dispatchEvent(event); await settle();
    assert(textarea.isConnected && document.activeElement === textarea && textarea.value === '# 输入中', 'IME confirmation/cancellation submitted or closed the edit');
  }
  textarea.value = source; textarea.dispatchEvent(new Event('input', { bubbles: true })); await settle();
  await focusComposer();
  assert(!root.querySelector('.user-content-edit') && content().innerHTML === projection, 'unchanged edit did not render after focus left the message: ' + JSON.stringify({editing:!!root.querySelector('.user-content-edit'), active:document.activeElement?.className, focus:document.hasFocus()}));
  assert(!root.querySelector('.edit-actions').classList.contains('show'), 'unchanged edit left pending actions');
  for (const key of ['Enter', ' ']) {
    bubble().focus();
    bubble().dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
    await settle();
    assert(root.querySelector('.user-content-edit') === document.activeElement, 'keyboard activation lost editor focus: ' + key);
    await focusComposer();
    assert(!root.querySelector('.user-content-edit'), 'keyboard edit did not close on outside focus');
  }
  await openEdit();
  textarea = root.querySelector('.user-content-edit');
  textarea.blur();
  if (!document.hasFocus()) textarea.dispatchEvent(new FocusEvent('focusout', {bubbles:true}));
  await settle();
  assert(!root.querySelector('.user-content-edit') && content().innerHTML === projection, 'blur without a related focus target kept the editor open');
  await openEdit();
  textarea = root.querySelector('.user-content-edit');
  textarea.value = '# discarded'; textarea.dispatchEvent(new Event('input', { bubbles: true })); await settle();
  await focusComposer();
  assert(!root.querySelector('.user-content-edit') && content().querySelector('.composer-block-heading').textContent === 'discarded', 'changed draft did not render on blur');
  assert(root.querySelector('.edit-actions').classList.contains('show'), 'blur lost the draft submission controls');
  await openEdit();
  textarea = root.querySelector('.user-content-edit');
  assert(textarea.value === '# discarded', 'reopening reset the unsent draft');
  root.querySelector('.edit-confirm-btn').focus(); await settle();
  assert(root.querySelector('.user-content-edit'), 'moving focus to Send ended editing');
  root.querySelector('.edit-cancel-btn').click(); await settle();
  assert(content().innerHTML === projection, 'cancel changed the message');
  await openEdit();
  textarea = root.querySelector('.user-content-edit');
  textarea.value = '# escape'; textarea.dispatchEvent(new Event('input', { bubbles: true })); await settle();
  textarea.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await settle();
  assert(content().innerHTML === projection, 'Escape did not discard the draft');
  await openEdit();
  const attachmentRemove = root.querySelector('.user-attachments .remove-button');
  attachmentRemove.focus(); await settle();
  assert(root.querySelector('.user-content-edit'), 'moving focus to an attachment ended editing');
  attachmentRemove.click(); await settle();
  await focusComposer();
  assert(!root.querySelector('.user-content-edit') && root.querySelector('.edit-actions').classList.contains('show'), 'blur discarded an attachment-only edit');
  await openEdit();
  assert(!root.querySelector('.user-attachments .attachment-preview'), 'reopening restored a staged attachment removal');
  root.querySelector('.edit-cancel-btn').click(); await settle();
  assert(root.querySelector('.user-attachments .attachment-preview') && content().innerHTML === projection, 'cancel did not restore the attachment and Markdown');
  await openEdit();
  textarea = root.querySelector('.user-content-edit');
  textarea.value = source.replace('你调用终端试试', 'Updated 标题');
  textarea.dispatchEvent(new Event('input', { bubbles: true })); await settle();
  await focusComposer();
  root.querySelector('.edit-confirm-btn').click(); await settle();
  assert(content().querySelector('.composer-block-heading').textContent === 'Updated 标题', 'edit did not refresh the block projection');
  const updated = content().innerHTML;
  root.querySelector('.preview-readonly').click(); await settle();
  assert(bubble().classList.contains('readonly') && content().innerHTML === updated, 'read-only formatting differs');
  bubble().click(); await settle();
  assert(!root.querySelector('.user-content-edit'), 'read-only bubble became editable');
  root.querySelector('.user-collapse-btn').click(); await settle();
  assert(content().clientHeight > collapsedHeight, 'read-only expansion failed');
  return 'send, formatting, collapse, blur, draft preview/reopen/send/cancel, Escape and read-only passed';
})()'''
