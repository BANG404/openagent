[scenario]
name = "Chat Groups package sidebar with existing data"
fail_fast = true
global_timeout_ms = 60000

[[step]]
name = "open the package panel through shell navigation"
action = "eval"
script = '''(async()=>{
  const deadline=Date.now()+20000;
  while(Date.now()<deadline){
    const expand=[...document.querySelectorAll('button')].find(b=>/^(Expand right sidebar|展开右侧栏)$/.test(b.getAttribute('aria-label')||''));
    expand?.click();
    const button=[...document.querySelectorAll('.panel-navigation button')].find(b=>/Chat Groups|聊天群组/.test(b.textContent));
    if(button){button.click();return true;}
    await new Promise(r=>setTimeout(r,100));
  }
  throw new Error('Chat Groups sidebar navigation missing');
})()'''

[[step]]
name = "existing paginated messages and members are restored"
action = "eval"
script = '''(async()=>{
  const deadline=Date.now()+20000;
  while(Date.now()<deadline){
    const d=document.querySelector('#checkpoint-flow-panel iframe')?.contentDocument;
    if(d?.querySelectorAll('article').length===205){
      if(d.querySelector('#group-title').textContent!=='Saved group')throw new Error('saved group missing');
      if(d.querySelector('#member-list').textContent!=='ReviewerResearch Lead')throw new Error('members missing');
      if(d.querySelector('#choices').textContent.includes('Foreign group'))throw new Error('foreign workspace leaked');
      if(!document.querySelector('.conversation-stage'))throw new Error('conversation unmounted');
      return true;
    }
    await new Promise(r=>setTimeout(r,100));
  }
  throw new Error('saved group messages failed to load');
})()'''
