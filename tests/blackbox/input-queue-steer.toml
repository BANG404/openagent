[scenario]
name = "explicit steering remains separate from the next-turn queue"
fail_fast = true
global_timeout_ms = 60000

[[step]]
name = "add a correction to the active task and retain an ordinary follow-up"
action = "eval"
script = '''(async()=>{
  const probe=JSON.parse(sessionStorage.getItem('input-queue-fixture'));
  const wait=async(read,why)=>{const end=Date.now()+15000;while(Date.now()<end){if(read())return;await new Promise(r=>setTimeout(r,50));}throw new Error(why);};
  const fill=async(text)=>{const e=document.querySelector('[contenteditable=true][role=textbox]');e.focus();const range=document.createRange();range.selectNodeContents(e);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);(() => { document.dispatchEvent(new Event('selectionchange')); const clipboard = new DataTransfer(); clipboard.setData('text/plain', ({bubbles:true,cancelable:true,inputType:'insertText',data:text}).data); e.dispatchEvent(new ClipboardEvent('paste', {clipboardData:clipboard,bubbles:true,cancelable:true})); })();await new Promise(r=>requestAnimationFrame(r));};
  const sent=()=>!document.querySelector('[contenteditable=true][role=textbox]').textContent.trim();
  await fill(`QUEUE_FIXTURE:${probe.marker} steering-initial`);document.querySelector('.send-btn').click();
  await wait(()=>document.body.textContent.includes(`Queue response ${probe.marker}`),'steering target did not start');
  await fill(`QUEUE_FIXTURE:${probe.marker} next-turn`);document.querySelector('.send-btn').click();await wait(sent,'next-turn acceptance failed');
  await fill(`QUEUE_FIXTURE:${probe.marker} correction`);
  const {desktopOpenAgent:client}=await import('/src/lib/openagent/tauriClient.ts');
  const mutate=client.mutateInputQueue;
  const beforeFailure=document.querySelectorAll('.user-msg').length;
  client.mutateInputQueue=async()=>{throw new Error('Fixture steering acceptance rejected');};
  try{
    document.querySelector('.steer-btn').click();
    await wait(()=>!!document.querySelector('.queue-error')&&!document.querySelector('.send-btn').disabled,'failed steering remained busy');
    if(document.querySelectorAll('.user-msg').length!==beforeFailure||sent())throw new Error('rejected steering added a bubble or erased its draft');
  }finally{client.mutateInputQueue=mutate;}
  const steer=document.querySelector('.steer-btn');if(!steer||steer.disabled)throw new Error('explicit steering action missing');steer.click();
  await wait(sent,'steering acceptance failed');
  await wait(()=>[...document.querySelectorAll('.chat-queue li')].some(row=>row.textContent.includes('correction')),'steering receipt missing');
  await fill(`QUEUE_FIXTURE:${probe.marker} correction-two`);document.querySelector('.steer-btn').click();await wait(sent,'second steering acceptance failed');
  sessionStorage.setItem('input-queue-live-user-ids',JSON.stringify(Object.fromEntries(['correction','correction-two','next-turn'].map(suffix=>[suffix,[...document.querySelectorAll('.chat-queue li')].find(row=>row.textContent.includes(suffix)).dataset.queueId]))));
  const correctionId=JSON.parse(sessionStorage.getItem('input-queue-live-user-ids')).correction;
  await wait(()=>[...document.querySelectorAll('.user-msg')].some(row=>row.dataset.messageId===correctionId),'accepted correction has no user bubble while the original response is still streaming');
  const first=[...document.querySelectorAll('.user-msg')].find(row=>row.dataset.messageId===correctionId);
  const secondId=JSON.parse(sessionStorage.getItem('input-queue-live-user-ids'))['correction-two'];
  await wait(()=>!!document.querySelector(`.user-msg[data-message-id="${secondId}"]`),'second accepted correction has no bubble');
  const second=document.querySelector(`.user-msg[data-message-id="${secondId}"]`);
  const response=document.querySelector('.assistant-msg');
  if(!response||!(response.compareDocumentPosition(first)&Node.DOCUMENT_POSITION_FOLLOWING)||!(first.compareDocumentPosition(second)&Node.DOCUMENT_POSITION_FOLLOWING))throw new Error('pending steering is before its current response or out of submission order');
  await fill('unsent-steering-draft');
  return 'correction accepted for the active run with a separate next-turn input';
})()'''

[[step]]
name = "streaming actions stay inside the composer at wide and narrow widths"
action = "eval"
script = '''(async()=>{
  const wrapper=document.querySelector('.input-wrapper');
  const original=wrapper.style.width;
  const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const check=()=>{
    const surface=wrapper.querySelector('.composer').getBoundingClientRect();
    const buttons=[...wrapper.querySelectorAll('.steer-btn,.send-btn,.stop-btn,.context-usage-trigger')];
    if(!wrapper.querySelector('.composer-toolbar .steer-btn')||!wrapper.querySelector('.stop-btn'))throw new Error('streaming actions missing');
    const all=[...wrapper.querySelectorAll('.composer-toolbar button,.send-btn,.stop-btn,.context-usage-trigger')].map(e=>({e,r:e.getBoundingClientRect()})).filter(({r})=>r.width&&r.height);
    for(const button of buttons){
      const r=button.getBoundingClientRect();
      if(r.left<surface.left-1||r.right>surface.right+1||r.top<surface.top-1||r.bottom>surface.bottom+1)throw new Error('action escaped composer: '+button.className);
      for(const {e,r:other} of all){if(e!==button&&Math.min(r.right,other.right)-Math.max(r.left,other.left)>1&&Math.min(r.bottom,other.bottom)-Math.max(r.top,other.top)>1)throw new Error('composer actions overlap: '+button.className+' / '+e.className);}
    }
    if(wrapper.getBoundingClientRect().bottom>surface.bottom+1)throw new Error('steering created a row outside the composer');
  };
  try{await frame();check();wrapper.style.width='280px';await frame();check();}
  finally{wrapper.style.width=original;await frame();}
  return 'send, Stop and steering remain contained and separate at both widths';
})()'''
