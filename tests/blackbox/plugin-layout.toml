[scenario]
name = "plugin marketplace resize, expand and restore"
fail_fast = true
global_timeout_ms = 60000

[[step]]
name = "column count and toolbar respond to the surface width"
action = "eval"
script = '''(async () => {
  const surface = document.querySelector('.fullscreen-surface');
  const grid = surface.querySelector('.official-plugin-grid');
  if (!grid || grid.children.length < 4) throw new Error('official catalog is missing');
  const settle = () => new Promise(resolve => setTimeout(resolve, 350));
  const assertGrid = () => {
    const bounds = grid.getBoundingClientRect();
    const first = grid.children[0].getBoundingClientRect();
    const columns = [...grid.children].filter(card => Math.abs(card.getBoundingClientRect().top - first.top) < 2).length;
    const expected = Math.min(grid.children.length, Math.max(1, Math.floor((bounds.width + 10) / 310)));
    if (columns !== expected) throw new Error(`expected ${expected} columns, got ${columns} at ${bounds.width}px`);
    if (grid.scrollWidth > grid.clientWidth + 1) throw new Error('plugin grid overflows horizontally');
    return columns;
  };
  const counts = [];
  // CSS resize writes these same inline dimensions in the WebView.
  for (const width of [640, 950, 1250, 1560]) {
    surface.style.width = `${Math.min(width, innerWidth - 32)}px`;
    surface.style.height = '620px';
    await settle();
    counts.push(assertGrid());
    if (width === 640 && getComputedStyle(surface.querySelector('.official-plugin-store-toolbar')).flexDirection !== 'column') {
      throw new Error('narrow management surface did not stack the toolbar');
    }
    const rect = surface.getBoundingClientRect();
    if (Math.abs(rect.x + rect.width / 2 - innerWidth / 2) > 2) throw new Error('resized surface is not centered');
  }
  if (counts[0] !== 1 || counts.at(-1) < 3) throw new Error(`responsive columns were not exercised: ${counts}`);
  surface.style.width = '950px';
  await settle();
  window.__pluginLayoutProbe = {settle, assertGrid, width: surface.getBoundingClientRect().width, height: surface.getBoundingClientRect().height};
  return {columns: counts};
})()'''

[[step]]
name = "expand after resizing fills the viewport and follows native window resizing"
action = "eval"
script = '''(async () => {
  const probe = window.__pluginLayoutProbe;
  const surface = document.querySelector('.fullscreen-surface');
  surface.querySelector('.fullscreen-surface-expand').click();
  const assertExpanded = async () => {
    await probe.settle();
    const rect = surface.getBoundingClientRect();
    if (Math.abs(rect.x - 16) > 2 || Math.abs(rect.y - 16) > 2 ||
        Math.abs(rect.width - (innerWidth - 32)) > 2 || Math.abs(rect.height - (innerHeight - 32)) > 2) {
      throw new Error(`expanded surface retained resized dimensions: ${JSON.stringify(rect.toJSON())}`);
    }
    probe.assertGrid();
  };
  await assertExpanded();
  const {getCurrentWindow} = await import('/node_modules/@tauri-apps/api/window.js');
  const {LogicalSize} = await import('/node_modules/@tauri-apps/api/dpi.js');
  const current = getCurrentWindow();
  await current.setSize(new LogicalSize(1100, 780));
  await assertExpanded();
  await current.maximize();
  await assertExpanded();
  await current.unmaximize();
  await current.setSize(new LogicalSize(1660, 900));
  await assertExpanded();
  return 'expanded dimensions follow the native viewport';
})()'''

[[step]]
name = "restore retains the manual size and centers the surface"
action = "eval"
script = '''(async () => {
  const probe = window.__pluginLayoutProbe;
  const surface = document.querySelector('.fullscreen-surface');
  surface.querySelector('.fullscreen-surface-expand').click();
  await probe.settle();
  const rect = surface.getBoundingClientRect();
  if (surface.classList.contains('expanded') || Math.abs(rect.width - probe.width) > 2 || Math.abs(rect.height - probe.height) > 2 ||
      Math.abs(rect.x + rect.width / 2 - innerWidth / 2) > 2 || Math.abs(rect.y + rect.height / 2 - innerHeight / 2) > 2) {
    throw new Error('restore lost the manual size or centered position');
  }
  probe.assertGrid();
  return 'manual size restored and centered';
})()'''
