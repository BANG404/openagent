  const message = panel?.querySelector("textarea[placeholder='任务触发时发送给 AI 的消息']");
  const runAt = panel?.querySelector("input[placeholder='2026-06-17 18:30']");
  if (!(message instanceof HTMLTextAreaElement) || !(runAt instanceof HTMLInputElement)) throw new Error("exact-time controls are missing");
  message.value = "Blackbox schedule exact time";
  message.dispatchEvent(new Event("input", {bubbles: true}));
  runAt.value = "2099-12-31 23:59";
  runAt.dispatchEvent(new Event("input", {bubbles: true}));
  panel?.querySelector(".key-input-row button:first-child")?.click();
  return true;
})()'''

