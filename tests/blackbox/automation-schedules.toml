[scenario]
name = "automation scheduled hooks"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "open schedules section"
action = "click"
target = "[role=tab][data-value=schedules]"

[[step]]
name = "select delay mode"
action = "click"
target = "[role=tabpanel][data-value=schedules] [aria-label='执行计划']"

[[step]]
name = "choose delay mode"
action = "click"
target = "[role=option][data-value=delay]"

[[step]]
name = "open execution role selector"
action = "click"
target = "[role=tabpanel][data-value=schedules] [aria-label='执行角色']"

[[step]]
name = "default OpenAgent role is available"
action = "assert-exists"
target = "[role=option][data-value=openagent]"

[[step]]
name = "keep the default execution role"
action = "click"
target = "[role=option][data-value=openagent]"

[[step]]
name = "create delay schedule"
action = "eval"
script = '''(() => {
  const panel = document.querySelector("[role=tabpanel][data-value=schedules]");
  const message = panel?.querySelector("textarea[placeholder='任务触发时发送给 AI 的消息']");
  const delay = panel?.querySelector("input[type=number]");
  if (!(message instanceof HTMLTextAreaElement) || !(delay instanceof HTMLInputElement)) throw new Error("delay controls are missing");
  message.value = "Blackbox schedule delay";
  message.dispatchEvent(new Event("input", {bubbles: true}));
  delay.value = "1";
  delay.dispatchEvent(new Event("input", {bubbles: true}));
  panel?.querySelector(".key-input-row button:first-child")?.click();
  return true;
})()'''

[[step]]
name = "delay schedule is listed"
action = "wait"
selector = "[role=tabpanel][data-value=schedules] .hook-item"
timeout_ms = 10000

[[step]]
name = "refresh scheduled hook list"
action = "click"
target = "[role=tabpanel][data-value=schedules] .detail-section-header button"

[[step]]
name = "edit delay schedule"
action = "click"
target = "[role=tabpanel][data-value=schedules] .hook-actions button:first-child"

[[step]]
name = "edited schedule restores its message"
action = "assert-value"
target = "[role=tabpanel][data-value=schedules] textarea[placeholder='任务触发时发送给 AI 的消息']"
expected = "Blackbox schedule delay"

[[step]]
name = "save edited delay schedule"
action = "eval"
script = '''(() => {
  const panel = document.querySelector("[role=tabpanel][data-value=schedules]");
  const message = panel?.querySelector("textarea[placeholder='任务触发时发送给 AI 的消息']");
  if (!(message instanceof HTMLTextAreaElement)) throw new Error("schedule message is missing");
  message.value = "Blackbox schedule delay edited";
  message.dispatchEvent(new Event("input", {bubbles: true}));
  panel?.querySelector(".key-input-row button:first-child")?.click();
  return true;
})()'''

[[step]]
name = "wait for edited schedule refresh"
action = "eval"
script = "new Promise((resolve) => setTimeout(resolve, 500))"

[[step]]
name = "edited delay schedule is visible"
action = "eval"
script = '''(() => {
  const text = document.querySelector("[role=tabpanel][data-value=schedules]")?.textContent ?? "";
  if (!text.includes("Blackbox schedule delay edited")) throw new Error("edited schedule is not visible");
  return true;
})()'''

[[step]]
name = "cancel edited delay schedule"
action = "click"
target = "[role=tabpanel][data-value=schedules] .hook-actions button:last-child"

[[step]]
name = "delay schedule is removed"
action = "wait"
selector = "[role=tabpanel][data-value=schedules] .hook-item"
gone = true
timeout_ms = 10000

[[step]]
name = "select exact-time mode"
action = "click"
target = "[role=tabpanel][data-value=schedules] [aria-label='执行计划']"

[[step]]
