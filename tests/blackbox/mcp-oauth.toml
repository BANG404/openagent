[[step]]
name = "the probe connectors are removed"
action = "eval"
script = '''(async () => {
  const panel = document.querySelector(".settings-tab-panel[data-value=extensions]");
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const prefix = "OAuth probe ";
  const probeConnectors = () =>
    [...panel.querySelectorAll(".provider-item-name")]
      .map((node) => node.textContent ?? "")
      .filter((name) => name.startsWith(prefix));
  for (;;) {
    const [name] = probeConnectors();
    if (!name) break;
    const item = [...panel.querySelectorAll("button.provider-item")].find(
      (candidate) => candidate.querySelector(".provider-item-name")?.textContent === name
    );
    if (!item) throw new Error(`the ${name} connector is missing from the list`);
    item.click();
    await sleep(0);
    const remove = panel.querySelector(".danger-zone button");
    if (!remove) throw new Error(`the ${name} connector cannot be removed`);
    remove.click();
    const deadline = Date.now() + 15000;
    while (Date.now() < deadline) {
      if (!probeConnectors().includes(name)) break;
      await sleep(50);
    }
    if (probeConnectors().includes(name)) {
      throw new Error(`the ${name} connector survived its removal`);
    }
  }
  return true;
})()'''
