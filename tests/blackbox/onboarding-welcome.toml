[scenario]
name = "development welcomes users with local resource status and a working logo"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "resource preparation belongs to visible Welcome"
action = "eval"
script = '''(() => {
  const panel = document.querySelector('[data-module="onboarding"]');
  if (!panel?.querySelector('nav [aria-current="step"][aria-label^="1."]')) throw new Error('setup skipped Welcome');
  if (panel.querySelectorAll('.onboarding-nav-item').length !== 5) throw new Error('full wizard does not show all five steps');
  if (panel.querySelector('.workspace-card')) throw new Error('workspace picker crowds Welcome');
  const viewport = panel.querySelector('.ui-scroll-area-viewport');
  if (viewport.scrollTop !== 0 || panel.querySelector('h1').getBoundingClientRect().top < viewport.getBoundingClientRect().top) throw new Error('Welcome heading is scrolled out of view');
  const card = panel.querySelector('.embedding-card');
  if (!card || card.getBoundingClientRect().bottom > panel.querySelector('footer').getBoundingClientRect().top) throw new Error('resource status is not visible in Welcome');
  const image = panel.querySelector('.onboarding-brand-icon');
  if (!image?.complete || !image.naturalWidth) throw new Error('development logo failed to load');
  if (panel.querySelector('.embedding-meter')?.getAttribute('aria-valuenow') !== '100') throw new Error('prepared model is not ready');
  const next = [...panel.querySelectorAll('footer button')].find(button => ['Continue', '继续'].includes(button.textContent.trim()));
  if (!next || next.disabled) throw new Error('Welcome cannot continue');
  return true;
})()'''
