[scenario]
name = "Stop actual running Chat Groups members through the sidebar"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "open the selected group's sidebar"
action = "eval"
script = '''(async()=>{
  const expand=[...document.querySelectorAll('button')].find(b=>/^(Expand right sidebar|展开右侧栏)$/.test(b.getAttribute('aria-label')||''));expand?.click();
  const deadline=Date.now()+20000;
  while(Date.now()<deadline){
    const nav=[...document.querySelectorAll('.panel-navigation button')].find(b=>/Chat Groups|聊天群组/.test(b.textContent));nav?.click();
    const d=document.querySelector('#checkpoint-flow-panel iframe')?.contentDocument;
    if(d?.querySelector('#group-title')?.textContent===window.__groupStopProbe.groupTitle&&!d.querySelector('#stop').hidden&&!d.querySelector('#stop').disabled)return true;
    await new Promise(r=>setTimeout(r,100));
  }
  throw new Error('selected group Stop unavailable');
})()'''

[[step]]
name = "Stop cancels every running member while preserving the group draft"
action = "eval"
script = '''(async()=>{
  const d=document.querySelector('#checkpoint-flow-panel iframe').contentDocument;
  const draft=d.querySelector('#draft'), stop=d.querySelector('#stop');
  draft.value='Unsent group Stop draft';draft.dispatchEvent(new Event('input',{bubbles:true}));
  stop.click();
  if(!stop.disabled||stop.hidden)throw new Error('pending Stop must remain visible and disabled');
  const deadline=Date.now()+20000;
  while((!stop.hidden||document.querySelector('.stop-btn'))&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));
  if(!stop.hidden||!stop.disabled||!d.querySelector('#error').hidden)throw new Error('Stop did not return to idle');
  if(draft.value!=='Unsent group Stop draft')throw new Error('Stop erased draft');
  if(document.querySelector('.stop-btn'))throw new Error('owner is still running');
  return true;
})()'''
