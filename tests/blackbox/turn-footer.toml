[scenario]
name = "per-turn footer usage survives snapshots, reload and branches"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "timestamps match neighboring footer metadata"
action = "eval"
script = '''(() => {
  const footers = [...document.querySelectorAll('.msg-footer-row')];
  if (footers.length === 0) throw new Error('missing assistant footers');
  for (const footer of footers) {
    const timestamp = footer.querySelector('.ts');
    const metadata = footer.querySelector('.run-timing, .cache-usage');
    if (!timestamp || !metadata) throw new Error('missing timestamp or neighboring metadata');
    const actual = getComputedStyle(timestamp);
    const expected = getComputedStyle(metadata);
    for (const property of ['fontSize', 'lineHeight', 'fontFamily', 'fontWeight', 'color']) {
      if (actual[property] !== expected[property]) throw new Error('timestamp ' + property + ' differs: ' + actual[property] + ' / ' + expected[property]);
    }
    if (actual.fontSize !== '11px') throw new Error('unexpected footer text size: ' + actual.fontSize);
    const timeBounds = timestamp.getBoundingClientRect();
    const metadataBounds = metadata.getBoundingClientRect();
    if (Math.abs(timeBounds.y + timeBounds.height / 2 - metadataBounds.y - metadataBounds.height / 2) > 1) throw new Error('timestamp is not centered with neighboring metadata');
  }
  return 'footer typography and alignment verified';
})()'''

[[step]]
name = "each completed turn owns its cache and timing"
action = "eval"
script = '''(() => {
  const cache = [...document.querySelectorAll('.cache-usage')].map(el => el.textContent);
  if (cache.length !== 3 || !cache[0].includes('70%') || !cache[1].includes('60%') || !cache[2].includes('45%')) throw new Error('turn cache records were reused or lost: ' + JSON.stringify(cache));
  if (!/\b70\s/.test(cache[0]) || !/\b90\s/.test(cache[2]) || !cache[2].includes('10%')) throw new Error('footer did not use the final provider read/write counters: ' + JSON.stringify(cache));
  const headers = [...document.querySelectorAll('.process-record-summary')].map(el => el.textContent);
  for (const duration of ['1.0s', '2.0s', '4.0s', '5.0s']) if (!headers.some(text => text.includes(duration))) throw new Error('missing independent duration ' + duration + ': ' + headers);
  if (!document.body.innerText.includes('200ms') || !document.body.innerText.includes('400ms') || !document.body.innerText.includes('300ms')) throw new Error('first response timings lost');
  return 'independent footer records verified';
})()'''

[[step]]
name = "reload checkpoint projection"
action = "click"
target = "[data-footer-reload]"

[[step]]
name = "restoration preserves each record"
action = "eval"
script = '''(() => {
  const cache = [...document.querySelectorAll('.cache-usage')].map(el => el.textContent);
  if (cache.length !== 3 || !cache[0].includes('70%') || !cache[1].includes('60%') || !cache[2].includes('45%')) throw new Error('reload changed per-turn usage');
  return 'restoration verified';
})()'''

[[step]]
name = "select alternate branch"
action = "click"
target = "[data-footer-branch]"

[[step]]
name = "sibling usage replaces only its own branch"
action = "eval"
script = '''(() => {
  const cache = [...document.querySelectorAll('.cache-usage')].map(el => el.textContent);
  if (cache.length !== 2 || !cache[0].includes('70%') || !cache[1].includes('20%')) throw new Error('branch leaked sibling usage: ' + JSON.stringify(cache));
  if (!document.body.innerText.includes('alternate-answer') || document.body.innerText.includes('second-answer')) throw new Error('branch transcript did not switch');
  return 'branch isolation verified';
})()'''

[[step]]
name = "return to original branch"
action = "click"
target = "[data-footer-branch]"

[[step]]
name = "original branch keeps original usage"
action = "eval"
script = '''(() => {
  const cache = [...document.querySelectorAll('.cache-usage')].map(el => el.textContent);
  if (cache.length !== 3 || !cache[1].includes('60%') || !cache[2].includes('45%')) throw new Error('returning to branch changed usage');
  return 'branch return verified';
})()'''
