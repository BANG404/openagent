[scenario]
name = "Record a real native composer turn"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "submit through the ordinary composer"
action = "eval"
script = '''(async()=>{
  const editor=document.querySelector('[contenteditable=true][role=textbox]');
  editor.focus();
  editor.dispatchEvent(new InputEvent('beforeinput',{bubbles:true,cancelable:true,inputType:'insertText',data:window.__liveFaultReplay.prompt}));
  await new Promise(resolve=>setTimeout(resolve,100));
  const send=document.querySelector('.send-btn');
  if(!editor.textContent.includes(window.__liveFaultReplay.prompt)||send.disabled)throw new Error('composer input unavailable');
  send.click();return true;
})()'''
