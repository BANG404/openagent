[scenario]
name = "canonical composer edits and IME in the native WebView"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "selection, history, Markdown, clipboard and IME remain coordinated"
action = "eval"
script = '''(async () => {
  const editor = document.querySelector('[contenteditable="true"]');
  if (!(editor instanceof HTMLElement)) throw new Error('composer missing');
  const settle = () => new Promise(resolve => requestAnimationFrame(resolve));
  const assert = (condition, description) => { if (!condition) throw new Error(description); };
  const key = (key, extra = {}) => editor.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...extra }));
  const input = (inputType, data = null) => editor.dispatchEvent(new InputEvent('beforeinput', { inputType, data, bubbles: true, cancelable: true }));
  const select = () => {
    editor.focus();
    const range = document.createRange();
    range.selectNodeContents(editor);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  };
  const fill = async text => { select(); input(text ? 'insertText' : 'deleteContentBackward', text || null); await settle(); };
  const visible = () => editor.textContent.trim();
  await fill('alpha');
  input('insertText', ' beta');
  await settle();
  assert(visible() === 'alpha beta', 'typing lost the canonical text');
  key('z', { ctrlKey: true });
  await settle();
  assert(visible() === 'alpha', 'Undo did not restore the preceding edit');
  key('z', { ctrlKey: true, shiftKey: true });
  await settle();
  assert(visible() === 'alpha beta', 'Redo did not restore the edit');
  select(); input('deleteContentBackward'); await settle();
  assert(visible() === '', 'Backspace did not delete the selected range');
  await fill('bold'); select(); key('b', { ctrlKey: true }); await settle();
  assert(editor.querySelector('strong')?.textContent === 'bold', 'Markdown formatting lost its DOM projection');
  key('z', { ctrlKey: true }); await settle();
  assert(!editor.querySelector('strong') && visible() === 'bold', 'Undo did not restore unformatted text');
  await fill('copy'); select();
  const clipboard = new DataTransfer();
  editor.dispatchEvent(new ClipboardEvent('cut', { clipboardData: clipboard, bubbles: true, cancelable: true }));
  await settle();
  assert(clipboard.getData('text/plain') === 'copy' && visible() === '', 'Cut lost its clipboard payload or model deletion: ' + JSON.stringify({ clipboard: clipboard.getData('text/plain'), editor: visible() }));
  clipboard.setData('text/plain', 'pasted');
  editor.dispatchEvent(new ClipboardEvent('paste', { clipboardData: clipboard, bubbles: true, cancelable: true }));
  await settle();
  assert(visible() === 'pasted', 'plain-text Paste did not update the model');
  await fill('');
  editor.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  await settle();
  assert(!editor.classList.contains('input-editor-empty'), 'placeholder remained visible during IME');
  input('insertText', 'duplicate');
  key('Enter', { isComposing: true });
  key('z', { ctrlKey: true, isComposing: true });
  editor.textContent = '中文';
  editor.dispatchEvent(new CompositionEvent('compositionend', { data: '中文', bubbles: true }));
  await settle();
  assert(visible() === '中文', 'IME text was lost or inserted twice: ' + JSON.stringify(visible()));
  key('z', { ctrlKey: true }); await settle();
  assert(visible() === '', 'IME commit was not one undoable edit');
  key('z', { ctrlKey: true, shiftKey: true }); await settle();
  assert(visible() === '中文', 'IME redo failed');
  await fill('- item'); input('insertLineBreak'); input('insertText', 'next'); await settle();
  assert(editor.querySelectorAll('.composer-block-listItem').length === 2, 'soft line break did not continue the list');
  const caretIn = (element, start, end = start) => {
    const node = element.firstChild;
    const range = document.createRange();
    range.setStart(node, start); range.setEnd(node, end);
    const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
  };
  const source = () => {
    select();
    const clipboard = new DataTransfer();
    editor.dispatchEvent(new ClipboardEvent('copy', { clipboardData: clipboard, bubbles: true, cancelable: true }));
    return clipboard.getData('text/plain');
  };
  await fill('**bold**'); input('deleteContentBackward'); await settle();
  assert(visible() === 'bol' && editor.querySelector('strong')?.textContent === 'bol', 'Backspace damaged the closing bold delimiter');
  input('deleteContentBackward'); input('deleteContentBackward'); input('deleteContentBackward'); await settle();
  assert(visible() === '' && !editor.querySelector('strong'), 'deleting the final formatted character left hidden syntax');
  await fill('@agent'); input('deleteContentBackward'); await settle();
  assert(visible() === '', 'Backspace split an atomic mention chip');
  await fill('a👨‍👩‍👧‍👦'); input('deleteContentBackward'); await settle();
  assert(visible() === 'a', 'Backspace split a composed emoji');
  await fill('literal **** and ` `');
  assert(source() === 'literal **** and ` `', 'editing removed unrelated literal delimiters');
  await fill('**abcd**'); caretIn(editor.querySelector('strong span'), 2);
  input('insertLineBreak'); await settle();
  assert(editor.querySelectorAll('strong').length === 2 && source() === '**ab**\n**cd**', 'splitting a formatted span broke its Markdown structure');
  await fill('**abcd**'); caretIn(editor.querySelector('strong span'), 1, 3);
  input('insertLineBreak'); await settle();
  assert(!visible().includes('bc') && editor.querySelectorAll('.composer-block').length === 2, 'Shift+Enter retained its selection');
  await fill('**abcd**'); caretIn(editor.querySelector('strong span'), 1, 3);
  const copied = new DataTransfer();
  editor.dispatchEvent(new ClipboardEvent('copy', { clipboardData: copied, bubbles: true, cancelable: true }));
  assert(copied.getData('text/plain') === '**bc**', 'Copy lost the selected Markdown formatting');
  editor.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  editor.querySelector('strong span').textContent = 'a中文d';
  editor.dispatchEvent(new CompositionEvent('compositionend', { data: '中文', bubbles: true })); await settle();
  assert(editor.querySelector('strong')?.textContent === 'a中文d', 'IME failed to replace the original selected range');
  key('z', { ctrlKey: true }); await settle();
  assert(visible() === 'abcd' && window.getSelection().toString() === 'bc', 'IME undo failed to restore its full selected range');
  editor.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  editor.textContent = 'canceled DOM';
  editor.dispatchEvent(new CompositionEvent('compositionend', { data: '', bubbles: true })); await settle();
  assert(editor.querySelector('strong')?.textContent === 'abcd', 'IME cancellation left its temporary DOM behind');
  caretIn(editor.querySelector('strong span'), 1, 3);
  editor.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  editor.querySelector('strong span').textContent = 'temporary';
  editor.dispatchEvent(new CompositionEvent('compositionend', { data: 'bc', bubbles: true })); await settle();
  assert(editor.querySelector('strong')?.textContent === 'abcd', 'an unchanged IME commit left the native DOM corrupted');
  await fill('**ab**');
  caretIn(editor.querySelector('strong span'), 0);
  input('deleteContentForward'); await settle();
  assert(editor.querySelector('strong')?.textContent === 'b', 'Delete damaged the opening delimiter');
  await fill('- one\n- two');
  caretIn(editor.querySelectorAll('.composer-block-listItem span[data-src-content-start]')[1], 0);
  input('deleteContentBackward'); input('deleteContentBackward'); await settle();
  assert(source() === '- onetwo', 'merging list lines leaked a hidden marker into the text');
  await fill('```md\n- **literal**\n```');
  assert(!editor.querySelector('strong') && editor.querySelectorAll('.composer-block-codeBlock').length === 3, 'code blocks interpreted Markdown content');
  await fill('toolbar'); caretIn(editor.querySelector('[data-src-content-start]'), 0, 4);
  const toggle = document.querySelector('.format-toggle');
  if (toggle.getAttribute('aria-expanded') !== 'true') toggle.click();
  await settle();
  const button = document.querySelector('.format-actions .format-btn');
  button.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })); button.click(); await settle();
  assert(editor.querySelector('strong')?.textContent === 'tool' && visible() === 'toolbar', 'toolbar formatting lost the editor selection');
  await fill('**bold**'); select(); key('b', { ctrlKey: true }); await settle();
  assert(visible() === 'bold' && !editor.querySelector('strong'), 'select-all could not toggle a complete formatted span');
  await fill('# title\n\n- item\nplain'); select(); key('b', { ctrlKey: true }); await settle();
  assert(editor.querySelectorAll('strong').length === 3 && source() === '# **title**\n\n- **item**\n**plain**', 'multiline formatting broke blank lines or block markers');
  await fill('');
  return 'visible deletion, graphemes, chips, balanced Markdown, toolbar selection, clipboard, history and IME passed';
})()'''
