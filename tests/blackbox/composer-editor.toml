[scenario]
name = "Tiptap composer editing and Markdown protocol in the native WebView"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "spaces, native editing, formatting, clipboard, IME and suggestions"
action = "eval"
script = '''(async () => {
  const editor = document.querySelector('.tiptap[contenteditable=true]');
  if (!(editor instanceof HTMLElement)) throw new Error('Tiptap composer missing');
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const settle = () => new Promise(resolve => setTimeout(resolve, 60));
  const wait = async (read, message) => { const end = Date.now() + 5000; while (Date.now() < end) { if (read()) return; await settle(); } throw new Error(message); };
  const key = (key, extra = {}) => editor.dispatchEvent(new KeyboardEvent('keydown', { key, code: key === 'Enter' ? 'Enter' : undefined, bubbles: true, cancelable: true, ...extra }));
  const select = async () => {
    editor.focus(); const range = document.createRange(); range.selectNodeContents(editor);
    const selection = getSelection(); selection.removeAllRanges(); selection.addRange(range);
    document.dispatchEvent(new Event('selectionchange')); await settle();
  };
  const caret = async (node, offset) => {
    editor.focus(); const range = document.createRange(); range.setStart(node, offset); range.collapse(true);
    const selection = getSelection(); selection.removeAllRanges(); selection.addRange(range);
    document.dispatchEvent(new Event('selectionchange')); await settle();
  };
  const paste = async text => {
    const clipboard = new DataTransfer(); clipboard.setData('text/plain', text);
    clipboard.setData('text/html', '<b>UNTRUSTED_CLIPBOARD_HTML</b>');
    editor.dispatchEvent(new ClipboardEvent('paste', { clipboardData: clipboard, bubbles: true, cancelable: true }));
    await settle();
  };
  const fill = async text => { editor.focus(); key('a', { ctrlKey: true }); await settle(); if (text) await paste(text); else { document.execCommand('delete'); await settle(); } };
  const source = async () => {
    await select(); const clipboard = new DataTransfer();
    editor.dispatchEvent(new ClipboardEvent('copy', { clipboardData: clipboard, bubbles: true, cancelable: true }));
    return clipboard.getData('text/plain');
  };
  for (const [marker, tag] of [['*', 'em'], ['**', 'strong'], ['~~', 's']]) {
    await fill(marker + '测试效果' + marker);
    await caret(editor.querySelector(tag).firstChild, 4);
    const original = editor.querySelector(tag);
    document.execCommand('insertText', false, ' '); await settle();
    assert(editor.querySelector(tag)?.textContent === '测试效果 ', 'space exposed raw Markdown markers');
    assert(editor.querySelector(tag) === original, 'space rebuilt the formatted DOM');
    document.execCommand('insertText', false, '继续'); await settle();
    assert(editor.querySelector(tag)?.textContent === '测试效果 继续', 'typing lost the active mark');
    const markdown = await source();
    assert(markdown.includes('测试效果 继续') && !markdown.includes('UNTRUSTED'), 'Markdown clipboard lost content or trusted HTML');
  }
  await fill('toolbar'); await select();
  const toggle = document.querySelector('.format-toggle');
  if (toggle.getAttribute('aria-expanded') !== 'true') toggle.click(); await settle();
  const bold = document.querySelectorAll('.format-actions .format-btn')[0];
  bold.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })); bold.click(); await settle();
  assert(editor.querySelector('strong')?.textContent === 'toolbar' && bold.getAttribute('aria-pressed') === 'true', 'toolbar lost selection or active state');
  key('z', { ctrlKey: true }); await settle();
  assert(!editor.querySelector('strong') && editor.textContent === 'toolbar', 'Undo failed to restore the preceding format');
  key('z', { ctrlKey: true, shiftKey: true }); await settle();
  assert(editor.querySelector('strong')?.textContent === 'toolbar', 'Redo failed');
  await fill(''); bold.click(); await settle();
  assert(editor.textContent === '', 'empty formatting inserted placeholder text');
  await fill('- one'); key('Enter', { shiftKey: true }); await settle();
  document.execCommand('insertText', false, 'two'); await settle();
  assert(editor.querySelectorAll('li').length === 2 && editor.textContent.includes('two'), 'Shift+Enter did not continue the list');
  await fill('```md\n@agent **literal**\n```');
  assert(editor.querySelector('pre code')?.textContent === '@agent **literal**' && !editor.querySelector('.composer-chip'), 'code interpreted tokens or Markdown');
  await fill('<b>literal</b>');
  assert(editor.textContent === '<b>literal</b>' && !editor.querySelector('strong'), 'HTML import changed literal text');
  const htmlOnly = new DataTransfer(); htmlOnly.setData('text/html', '<strong>HTML_ONLY</strong>');
  editor.dispatchEvent(new ClipboardEvent('paste', {clipboardData:htmlOnly,bubbles:true,cancelable:true})); await settle();
  assert(!editor.textContent.includes('HTML_ONLY'), 'HTML-only clipboard bypassed plain-text import');
  await fill('/my_command @"some path/a_b.md"');
  assert((await source()).includes('/my_command @"some path/a_b.md"'), 'protocol identifiers were escaped');
  await fill('**abcd**'); await caret(editor.querySelector('strong').firstChild, 2);
  editor.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  document.execCommand('insertText', false, '中文'); await settle();
  key('Enter', { isComposing: true });
  editor.dispatchEvent(new CompositionEvent('compositionend', { data: '中文', bubbles: true })); await settle();
  assert(editor.querySelector('strong')?.textContent === 'ab中文cd', 'IME lost text or formatting');
  await fill('@');
  await wait(() => document.querySelectorAll('.palette-label').length === 24, 'mention suggestions did not open');
  key('Enter');
  await wait(() => editor.querySelector('.composer-chip') && !document.querySelector('.palette'), 'mention selection failed');
  await fill('**@**');
  await wait(() => document.querySelectorAll('.palette-label').length === 24, 'formatted mention suggestions did not open');
  key('Enter');
  await wait(() => editor.querySelector('strong .composer-chip'), 'mention selection lost surrounding formatting');
  await fill('**sent**'); document.querySelector('.send-btn').click();
  await wait(() => !editor.textContent && document.querySelector('[data-composer-submitted]').textContent === '**sent**', 'submission did not publish Markdown and clear the draft');
  key('z', { ctrlKey: true }); await settle();
  assert(!editor.textContent, 'Undo restored a submitted draft');
  return 'Tiptap spaces, stable DOM, toolbar, history, lists, code, literal HTML, clipboard, protocol tokens, IME and mentions passed';
})()'''
