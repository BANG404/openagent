[scenario]
name = "compaction belongs to general settings"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "verify settings location, disabled inputs, persistence and visual states"
action = "eval"
script = '''(async () => {
  const wait = async (read, description) => {
    const deadline = Date.now() + 7000;
    while (Date.now() < deadline) {
      const result = read();
      if (result) return result;
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    throw new Error(description);
  };
  const shortcut = (key, code, shiftKey = false) => window.dispatchEvent(
    new KeyboardEvent('keydown', { key, code, ctrlKey: true, shiftKey, bubbles: true })
  );
  const openGeneral = async () => {
    shortcut(',', 'Comma');
    return await wait(() => document.querySelector('[data-settings-section="context-compaction"]'),
      'general settings did not expose compaction');
  };
  const close = async () => {
    const button = document.querySelector('[role=dialog] button[aria-label="Close"], [role=dialog] button[aria-label="关闭"]');
    if (!(button instanceof HTMLElement)) throw new Error('settings close control is missing');
    button.click();
    await wait(() => !document.querySelector('[role=dialog]'), 'settings did not close');
  };
  const fill = (input, value) => {
    if (!(input instanceof HTMLInputElement || input instanceof HTMLTextAreaElement)) {
      throw new Error('compaction field is missing');
    }
    input.value = value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  };
  let section = await openGeneral();
  const fields = section.querySelectorAll('input[type=number]');
  const toggle = section.querySelector('[role=switch]');
  const prompt = section.querySelector('textarea');
  const original = {
    enabled: toggle.getAttribute('aria-checked') === 'true',
    threshold: fields[0].value, count: fields[1].value, prompt: prompt.value,
  };
  const appearance = document.querySelector('[data-value=general] .settings-card');
  const appearanceButtons = appearance.querySelectorAll('.ui-select-trigger');
  const selectedValue = async button => {
    button.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerType: 'mouse' }));
    const selected = await wait(() => document.querySelector('[role=option][aria-selected=true]'), 'selected appearance option is missing');
    const value = selected.getAttribute('data-value');
    selected.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0, pointerType: 'mouse' }));
    await wait(() => !document.querySelector('[role=listbox]'), 'appearance menu did not close');
    return value;
  };
  const originalTheme = await selectedValue(appearanceButtons[0]);
  const originalLanguage = await selectedValue(appearanceButtons[1]);
  try {
    if (toggle.getAttribute('aria-checked') === 'true') toggle.click();
    await wait(() => [...fields].every(input => input.disabled), 'disabled compaction left editable numeric fields');
    toggle.click();
    await wait(() => [...fields].every(input => !input.disabled), 'enabled compaction kept numeric fields disabled');
    fill(fields[0], '210000'); fill(fields[1], '0');
    section.querySelector('summary').click();
    fill(prompt, 'Preserve unfinished work.');
    await new Promise(resolve => setTimeout(resolve, 1000));
    await close();
    section = await openGeneral();
    const restored = section.querySelectorAll('input[type=number]');
    await wait(() => restored[0].value === '210000' && restored[1].value === '0' &&
        section.querySelector('textarea').value === 'Preserve unfinished work.', 'saved compaction fields did not reload');
    if (restored[0].value !== '210000' || restored[1].value !== '0' ||
        section.querySelector('textarea').value !== 'Preserve unfinished work.' ||
        !section.querySelector('details').open) throw new Error('compaction fields did not survive reopening');
    await close();
    shortcut('3', 'Digit3', true);
    const flash = await wait(() => document.querySelector('[data-value=agents]'), 'Flash settings did not open');
    if (/Compaction|压缩/.test(flash.textContent)) throw new Error('Flash still owns compaction controls or description');
    await close();
    for (const [theme, language] of [['light', 'en'], ['dark', 'zh']]) {
      section = await openGeneral();
      for (const [index, value] of [[0, theme], [1, language]]) {
        const buttons = document.querySelector('[data-value=general] .settings-card').querySelectorAll('.ui-select-trigger');
        buttons[index].dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerType: 'mouse' }));
        const option = await wait(() => document.querySelector(`[role=option][data-value="${value}"]`), 'appearance option is missing');
        option.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0, pointerType: 'mouse' }));
      }
      await new Promise(resolve => setTimeout(resolve, 1000));
      await close();
      section = await openGeneral();
      await wait(() => document.documentElement.classList.contains(theme) &&
        section.textContent.includes(language === 'en' ? 'selected Chat model' : '当前 Chat 模型'),
        'compaction model copy or theme did not follow appearance settings');
      section.scrollIntoView({ block: 'center' });
      await close();
    }
  } finally {
    if (document.querySelector('[role=dialog]')) await close();
    section = await openGeneral();
    const inputs = section.querySelectorAll('input[type=number]');
    const control = section.querySelector('[role=switch]');
    if (control.getAttribute('aria-checked') !== 'true') control.click();
    await wait(() => !inputs[0].disabled, 'cleanup could not enable inputs');
    fill(inputs[0], original.threshold); fill(inputs[1], original.count);
    fill(section.querySelector('textarea'), original.prompt);
    if (!original.enabled) control.click();
    for (const [index, value] of [[0, originalTheme], [1, originalLanguage]]) {
      if (!value) continue;
      document.querySelector('[data-value=general] .settings-card').querySelectorAll('.ui-select-trigger')[index].dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerType: 'mouse' }));
      const option = await wait(() => document.querySelector(`[role=option][data-value="${value}"]`), 'cleanup appearance option is missing');
      option.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0, pointerType: 'mouse' }));
    }
    await new Promise(resolve => setTimeout(resolve, 1000));
    await close();
  }
  return 'general location, Flash exclusion, disabled fields, persistence, light/en and dark/zh passed';
})()'''
