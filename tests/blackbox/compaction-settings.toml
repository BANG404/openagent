[[step]]
name = "verify model window validation and persistence"
action = "eval"
script = '''(async () => {
  const f=window.__compactionSettingsFixture;await f.close();
  f.shortcut('1','Digit1',true);
  const panel=await f.wait(()=>document.querySelector('[data-value=providers][data-state=active]'),'provider settings did not open');
  const configure=[...panel.querySelectorAll('.model-item button')].find(button=>/^(Configure|配置)$/.test(button.textContent.trim()));
  if(!configure)throw new Error('fixture requires a configured model');
  configure.click();await f.wait(()=>document.querySelector('#model-config-context-window'),'model window field did not open');
  const field=document.querySelector('#model-config-context-window');
  const originalWindow=field.value,threshold=document.querySelector('#model-config-threshold').value;
  f.fill(field,'-1');
  await f.wait(()=>document.querySelector('.model-config-actions button[data-tone=primary]')?.disabled || document.querySelector('.dialog-error'),'invalid window did not block saving');
  if(!document.querySelector('.dialog-error'))throw new Error('invalid window has no explanation');
  f.fill(field,'128000');
  const save=()=>[...document.querySelectorAll('.model-config-actions button')].find(button=>/^(Save|保存)$/.test(button.textContent.trim()));
  await f.wait(()=>!save().disabled,'valid window cannot be saved');save().click();await f.settle();
  configure.click();await f.wait(()=>document.querySelector('#model-config-context-window')?.value==='128000','model window did not survive reopening');
  if(document.querySelector('#model-config-threshold').value!==threshold)throw new Error('window overwrote the explicit threshold');
  f.fill(document.querySelector('#model-config-context-window'),originalWindow);save().click();await f.settle();await f.close();await f.flash();return true;
})()'''

[[step]]
name = "restore compaction and appearance settings"
action = "eval"
script = '''(async () => {
  const f=window.__compactionSettingsFixture,section=document.querySelector('[data-settings-section=context-compaction]');
  const fields=section.querySelectorAll('input[type=number]'),toggle=section.querySelector('[role=switch]');
  if(toggle.getAttribute('aria-checked')!=='true')toggle.click();
  await f.wait(()=>!fields[0].disabled,'cannot enable fixture fields');
  f.fill(fields[0],f.original.threshold);f.fill(fields[1],f.original.count);f.fill(section.querySelector('textarea'),f.original.prompt);
  if(!f.original.enabled)toggle.click(); await f.settle(); await f.close(); await f.general();
  await f.select(f.appearance()[0],f.original.theme);await f.select(f.appearance()[1],f.original.language);
  await f.settle();await f.close();delete window.__compactionSettingsFixture;return true;
})()'''
