[scenario]
name = "Flash compaction settings"
fail_fast = true
global_timeout_ms = 120000

[[step]]
name = "save fixture values and verify General excludes compaction"
action = "eval"
script = '''(async () => {
  const wait = async (read, description) => {
    const deadline = Date.now() + 3000;
    while (Date.now() < deadline) {
      const value = read(); if (value) return value;
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error(description);
  };
  const shortcut = (key, code, shiftKey = false) => window.dispatchEvent(
    new KeyboardEvent('keydown', { key, code, ctrlKey: true, shiftKey, bubbles: true }));
  const close = async () => {
    const button = document.querySelector('[role=dialog] button[aria-label="Close"], [role=dialog] button[aria-label="关闭"]');
    if (button) button.click();
    await wait(() => !document.querySelector('[role=dialog]'), 'settings did not close');
  };
  const general = async () => {
    shortcut(',', 'Comma');
    const panel = await wait(() => document.querySelector('[data-value=general][data-state=active]'), 'General did not open');
    if (panel.querySelector('[data-settings-section=context-compaction]')) throw new Error('General still owns compaction');
    return panel;
  };
  const flash = async () => {
    shortcut('3', 'Digit3', true);
    return wait(() => document.querySelector('[data-value=agents][data-state=active] [data-settings-section=context-compaction]'), 'Flash did not expose compaction');
  };
  const fill = (input, value) => {
    input.value = value; input.dispatchEvent(new Event('input', {bubbles:true}));
  };
  const settle = () => new Promise(resolve => setTimeout(resolve, 1100));
  const appearance = () => [
    document.querySelector('[data-value=general] [data-appearance-mode] .ui-select-trigger'),
    document.querySelector('[data-value=general] button[aria-label="Language"], [data-value=general] button[aria-label="语言"]'),
  ];
  const select = async (button, value) => {
    button.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true,button:0,pointerType:'mouse'}));
    const option = await wait(() => document.querySelector(`[role=option][data-value="${value}"]`), 'appearance option is missing');
    option.dispatchEvent(new PointerEvent('pointerup', {bubbles:true,button:0,pointerType:'mouse'}));
    await wait(() => !document.querySelector('[role=listbox]'), 'select did not close');
  };
  await close(); await general();
  const readSelected = async button => {
    button.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true,button:0,pointerType:'mouse'}));
    const option = await wait(() => document.querySelector('[role=option][aria-selected=true]'), 'selected option is missing');
    const value = option.dataset.value;
    option.dispatchEvent(new PointerEvent('pointerup', {bubbles:true,button:0,pointerType:'mouse'}));
    await wait(() => !document.querySelector('[role=listbox]'), 'select did not close');
    return value;
  };
  const theme = await readSelected(appearance()[0]);
  const language = await readSelected(appearance()[1]);
  await close(); const section = await flash();
  const fields = section.querySelectorAll('input[type=number]'),toggle=section.querySelector('[role=switch]');
  const original = {theme,language,enabled:toggle.getAttribute('aria-checked')==='true',threshold:fields[0].value,count:fields[1].value,prompt:section.querySelector('textarea').value};
  window.__compactionSettingsFixture = {wait,shortcut,close,general,flash,fill,settle,appearance,select,original};
  return true;
})()'''

[[step]]
name = "verify disabled fields and persist Flash settings"
action = "eval"
script = '''(async () => {
  const f=window.__compactionSettingsFixture;
  const section=document.querySelector('[data-value=agents][data-state=active] [data-settings-section=context-compaction]');
  const fields=section.querySelectorAll('input[type=number]'),toggle=section.querySelector('[role=switch]');
  if(toggle.getAttribute('aria-checked')==='true') toggle.click();
  await f.wait(()=>[...fields].every(input=>input.disabled),'disabled compaction left editable fields');
  toggle.click(); await f.wait(()=>[...fields].every(input=>!input.disabled),'enabled compaction kept fields disabled');
  f.fill(fields[0],'210000'); f.fill(fields[1],'0');
  if(!section.querySelector('details').open) section.querySelector('summary').click();
  f.fill(section.querySelector('textarea'),'Preserve unfinished work.');
  await f.settle(); await f.close(); const restored=await f.flash();
  await f.wait(()=>restored.querySelectorAll('input')[0].value==='210000' && restored.querySelectorAll('input')[1].value==='0' && restored.querySelector('textarea').value==='Preserve unfinished work.','saved compaction values did not reload');
  if(!restored.querySelector('details').open)throw new Error('saved prompt did not expand');
  await f.close(); return true;
})()'''

[[step]]
name = "verify light theme and English Flash copy"
action = "eval"
script = '''(async () => {
  const f=window.__compactionSettingsFixture; await f.general();
  await f.select(f.appearance()[0],'light'); await f.select(f.appearance()[1],'en');
  await f.settle(); await f.close(); const section=await f.flash();
  await f.wait(()=>document.documentElement.classList.contains('light') && section.textContent.includes('Flash model') && section.textContent.includes('structured summary'),'English Flash copy or theme is stale');
  if(!section.textContent.includes(section.textContent.includes('Flash 模型') ? '输入与输出 token 总量' : 'provider-reported input plus output tokens')) throw new Error('compaction threshold must describe provider usage');
  section.scrollIntoView({block:'center',behavior:'instant'}); await f.settle(); return true;
})()'''

[[step]]
name = "capture light English compaction settings"
action = "screenshot"
path = "compaction-light-en.png"

[[step]]
name = "verify English model window controls"
action = "eval"
script = '''(async () => {
  const f=window.__compactionSettingsFixture;await f.close();f.shortcut('1','Digit1',true);
  const panel=await f.wait(()=>document.querySelector('[data-value=providers][data-state=active]'),'provider settings did not open');
  const configure=[...panel.querySelectorAll('.model-item button')].find(button=>button.textContent.trim()==='Configure');
  if(!configure)throw new Error('fixture requires a configured model');configure.click();
  const field=await f.wait(()=>document.querySelector('#model-config-context-window'),'model window field is missing');
  if(!field.closest('label').textContent.includes('90%'))throw new Error('model headroom hint is missing');
  const cancel=document.querySelector('.model-config-cancel');cancel.click();await f.close();await f.flash();return true;
})()'''

[[step]]
name = "verify dark theme and Chinese Flash copy"
action = "eval"
script = '''(async () => {
  const f=window.__compactionSettingsFixture; await f.close(); await f.general();
  await f.select(f.appearance()[0],'dark'); await f.select(f.appearance()[1],'zh');
  await f.settle(); await f.close(); const section=await f.flash();
  await f.wait(()=>document.documentElement.classList.contains('dark') && section.textContent.includes('Flash 模型') && section.textContent.includes('结构化摘要'),'Chinese Flash copy or theme is stale');
  if(!section.textContent.includes(section.textContent.includes('Flash 模型') ? '输入与输出 token 总量' : 'provider-reported input plus output tokens')) throw new Error('compaction threshold must describe provider usage');
  section.scrollIntoView({block:'center',behavior:'instant'}); await f.settle(); return true;
})()'''

