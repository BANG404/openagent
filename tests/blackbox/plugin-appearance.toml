[scenario]
name = "plugin theme selection and appearance overrides"
fail_fast = true
global_timeout_ms = 60000

[[step]]
name = "appearance rows share the General settings alignment and hierarchy"
action = "eval"
script = '''(() => {
  const rows = [...document.querySelectorAll('[data-appearance-color], [data-appearance-font]')];
  for (const row of rows) {
    const label = row.querySelector('.settings-card-copy > .label-text');
    const control = row.querySelector('.settings-card-control');
    if (!label || !control) throw new Error('appearance row bypasses shared settings layout');
    const bounds = row.getBoundingClientRect();
    const field = control.getBoundingClientRect();
    if (field.left < bounds.left || field.right > bounds.right + 1 ||
        control.scrollWidth > control.clientWidth + 1)
      throw new Error('appearance controls overflow their row');
    if (getComputedStyle(label).fontWeight !== getComputedStyle(document.querySelector('[data-appearance-theme] .label-text')).fontWeight)
      throw new Error('appearance label hierarchy differs from other settings');
  }
  const rowLeft = rows[0].querySelector('.label-text').getBoundingClientRect().left;
  const hintLeft = document.querySelector('.appearance-hint').getBoundingClientRect().left + parseFloat(getComputedStyle(document.querySelector('.appearance-hint')).paddingLeft);
  const summaryLeft = document.querySelector('.appearance-advanced summary').getBoundingClientRect().left;
  if (Math.abs(rowLeft - hintLeft) > 1 || Math.abs(rowLeft - summaryLeft) > 1)
    throw new Error('appearance hint or disclosure lost its row inset');
})()'''

[[step]]
name = "selected package and localized override controls"
action = "eval"
script = '''(() => {
  if (!document.querySelector('[data-appearance-theme] button').textContent.includes('probe'))
    throw new Error('selected theme is not visible');
  const probe = window.__appearanceProbe;
  for (const key of ['accent', 'background', 'foreground'])
    if (document.querySelector('#appearance-' + key).value !== probe[key])
      throw new Error('override control disagrees with saved color: ' + key);
  if (!document.querySelector('[data-appearance-reset]').textContent.includes(probe.resetLabel))
    throw new Error('reset action is not localized');
})()'''

[[step]]
name = "typography reaches the rendered native document"
action = "eval"
script = '''(() => {
  if (getComputedStyle(document.body).fontSize !== '16px' ||
      window.__appearanceDiffFont !== '15px' ||
      !getComputedStyle(document.body).fontFamily.includes('JetBrains') ||
      getComputedStyle(document.querySelector('#appearance-accent')).fontSize !== '15px' ||
      document.documentElement.style.getPropertyValue('--code-font-size') !== '15px')
    throw new Error('typography overrides did not reach the document');
})()'''

[[step]]
name = "custom background paints the real window canvas"
action = "eval"
script = """(() => {
  const probe = window.__appearanceProbe;
  const sample = document.createElement('span');
  sample.style.backgroundColor = probe.background;
  document.body.append(sample);
  try {
    if (document.documentElement.classList.contains('native-window-material') ||
        getComputedStyle(document.body).backgroundColor !== getComputedStyle(sample).backgroundColor)
      throw new Error('Custom background is hidden by the transparent native canvas');
  } finally { sample.remove(); }
  return 'custom background reaches body';
})()"""
