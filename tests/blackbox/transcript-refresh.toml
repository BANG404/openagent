[scenario]
name = "ordinary chat polling preserves book mode, Mermaid view and user edit focus"
fail_fast = true
global_timeout_ms = 60000

[[step]]
name = "real queue refreshes retain book mode until explicitly closed"
action = "eval"
script = '''(async()=>{
  const {desktopOpenAgent:client}=await import('/src/lib/openagent/tauriClient.ts');
  const original=client.getInputQueue;let polls=0;
  client.getInputQueue=async function(...args){const result=await original.apply(this,args);polls++;return result;};
  const assert=(value,message)=>{if(!value)throw new Error(message);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const open=async()=>{
    document.querySelector('.msg-action-btn[aria-label="Read in book mode"],.msg-action-btn[aria-label="以书籍模式阅读"]').click();
    for(let i=0;i<50 && !document.querySelector('.agent-book-dialog');i++)await wait(100);
    const dialog=document.querySelector('.agent-book-dialog');
    assert(dialog,'Book mode did not open');return dialog;
  };
  try{
    const dialog=await open();const start=polls;
    await wait(4500);
    assert(polls-start>=2,'Did not exercise two successful automatic queue polls');
    assert(dialog.isConnected && document.querySelector('.agent-book-dialog')===dialog,'Queue refresh closed book mode');
    assert(dialog.querySelector('[data-mermaid-svg] > svg'),'Book mode lost its rendered diagram');
    dialog.querySelector('.book-close').click();await wait(100);
    assert(!document.querySelector('.agent-book-dialog'),'Explicit close did not exit book mode');
    await open();
    document.querySelector('.book-close').click();await wait(100);
    assert(!document.querySelector('.agent-book-dialog'),'Reopened book mode did not close');
    return 'Book mode survived actual periodic queue loads and explicit close/reopen';
  }finally{client.getInputQueue=original;}
})()'''

[[step]]
name = "real queue refreshes do not replace the SVG or reset embedded/fullscreen zoom"
action = "eval"
script = '''(async()=>{
  const {desktopOpenAgent:client}=await import('/src/lib/openagent/tauriClient.ts');
  const original=client.getInputQueue;
  let polls=0;
  client.getInputQueue=async function(...args){const result=await original.apply(this,args);polls++;return result;};
  const assert=(value,message)=>{if(!value)throw new Error(message);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const svg=()=>document.querySelector('[data-mermaid-svg] > svg');
  const canvas=()=>document.querySelector('[data-mermaid-svg]');
  const button=name=>document.querySelector(`[aria-label="${name}"]`);
  try{
    await wait(500);
    for(const expanded of [false,true]){
      if(expanded){button('Toggle expand').click();await wait(100);}
      const currentSvg=svg();const currentCanvas=canvas();
      const fitted=currentCanvas.style.transform;
      button('Zoom in').click();
      const zoomed=currentCanvas.style.transform;
      assert(zoomed!==fitted,'Zoom in did not change the view');
      const start=polls;
      await wait(4500);
      assert(polls-start>=2,'Did not exercise two successful automatic queue polls');
      assert(svg()===currentSvg && canvas()===currentCanvas,'Queue refresh replaced Mermaid DOM');
      assert(currentCanvas.style.transform===zoomed,'Queue refresh reset Mermaid zoom');
    }
    window.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));
    await wait(100);
    assert(!document.querySelector('[data-streamdown-mermaid][data-expanded="true"]'),'Fullscreen did not close');
    return 'Embedded and fullscreen SVG and zoom survived actual periodic queue loads';
  }finally{client.getInputQueue=original;}
})()'''

[[step]]
name = "real queue refreshes preserve unchanged and dirty editors with selection and focus"
action = "eval"
script = '''(async()=>{
  const {desktopOpenAgent:client}=await import('/src/lib/openagent/tauriClient.ts');
  const original=client.getInputQueue;let polls=0;
  client.getInputQueue=async function(...args){const result=await original.apply(this,args);polls++;return result;};
  const assert=(value,message)=>{if(!value)throw new Error(message);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  try{
    const bubble=document.querySelector('.user-content[role=button]');
    bubble.focus();bubble.click();await wait(100);
    const editor=document.querySelector('.user-content-edit');
    assert(editor && document.activeElement===editor,'User bubble did not open a focused editor');
    for(const dirty of [false,true]){
      if(dirty){editor.value+=' unsent draft / 未发送';editor.dispatchEvent(new Event('input',{bubbles:true}));}
      editor.setSelectionRange(3,7);
      const value=editor.value;const start=polls;
      await wait(4500);
      assert(polls-start>=2,'Did not exercise two successful automatic queue polls');
      assert(editor.isConnected && document.querySelector('.user-content-edit')===editor,'Queue refresh removed the editor');
      assert(document.activeElement===editor,'Queue refresh cancelled user-message focus');
      assert(editor.value===value && editor.selectionStart===3 && editor.selectionEnd===7,'Queue refresh reset draft or selection');
    }
    return 'Unchanged and dirty user-message editors survived actual periodic queue loads';
  }finally{client.getInputQueue=original;}
})()'''
