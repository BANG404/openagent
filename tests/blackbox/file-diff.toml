[[step]]
name = "worker failure retains literal source and switching files recovers syntax"
action = "eval"
script = '''(async () => {
  const panel = document.querySelector('#checkpoint-flow-panel .file-panel');
  const rows = [...panel.querySelectorAll('.file-row')];
  const OriginalWorker = window.Worker;
  try {
    window.Worker = class { constructor() { throw new Error('fixture worker unavailable'); } };
    rows[0].click();
    await new Promise(resolve => setTimeout(resolve, 100));
    if (!panel.querySelector('code')?.textContent.includes('old value') || panel.querySelector('.diff-token')) throw new Error('worker failure hid literal source');
  } finally { window.Worker = OriginalWorker; }
  await window.__fileDiffVerify(1);
  // Switch while a new worker is loading; a cancelled result must not repaint the next file.
  rows[0].click(); await new Promise(resolve => setTimeout(resolve, 0));
  await window.__fileDiffVerify(10);
  return 'worker failure and file-switch recovery verified';
})()'''

[[step]]
name = "collapse, keyboard navigation and narrow layout"
action = "eval"
script = '''(async () => {
  const panel = document.querySelector('#checkpoint-flow-panel .file-panel');
  if (document.querySelector('#checkpoint-flow-panel').classList.contains('collapsed') || panel.getBoundingClientRect().height <= 0) throw new Error('Files sidebar is not visible');
  const rows = [...panel.querySelectorAll('.file-row')];
  const paths = ['sample.ts', 'sample.py', 'sample.ps1', 'sample.unknown', 'long.txt', 'recorded.txt', 'empty.txt', 'deleted.txt', 'unavailable.txt', 'fragment.txt', 'index.html'];
  if (rows.length !== paths.length || panel.querySelector('.file-tabs, .file-view-controls, [role="tablist"]')) throw new Error('Files must be a vertical collapsible list');
  if (panel.querySelector('.revert-button')) throw new Error('undo control remains');
  rows[0].click(); await new Promise(resolve => setTimeout(resolve, 200));
  if ([...panel.querySelectorAll('.diff-row:not(.remove) code')].map(row => row.textContent).join('\n') !== 'const message: string = "你好";\n/* comment\ncontinued */\nconsole.log(message);') throw new Error('recorded full source changed');
  const output = panel.querySelector('.file-content-scroll .ui-scroll-area-viewport');
  if (output.clientHeight > 120) throw new Error('short file reserves a blank window');
  rows[0].click(); await new Promise(resolve => setTimeout(resolve, 100));
  if (rows[0].getAttribute('aria-expanded') !== 'false' || panel.querySelector('.diff-table')) throw new Error('explicit collapse reopened itself');
  rows[0].focus(); rows[0].dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowDown', bubbles: true}));
  if (document.activeElement !== rows[1]) throw new Error('accordion keyboard navigation failed');
  rows[0].click(); await new Promise(resolve => setTimeout(resolve, 100));
  document.querySelector('#checkpoint-flow-panel').style.width = '260px';
  await new Promise(resolve => requestAnimationFrame(resolve));
  const viewport = panel.querySelector('.ui-scroll-area-viewport');
  if (viewport.scrollWidth > viewport.clientWidth + 2) throw new Error('narrow Files sidebar overflows');
  delete window.__fileDiffVerify;
  return 'inferred files, collapse, syntax and unavailable states verified';
})()'''
