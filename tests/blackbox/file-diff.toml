[scenario]
name = "Files sidebar shows recorded full content in terminal-style collapsible rows"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "open the Files sidebar through its visible control"
action = "click"
target = ".checkpoint-flow-toggle"

[[step]]
name = "mount the tool-estimate assertions"
action = "eval"
script = '''(async () => {
  const panel = document.querySelector('#checkpoint-flow-panel .file-panel');
  if (document.querySelector('#checkpoint-flow-panel').classList.contains('collapsed') || panel.getBoundingClientRect().height <= 0) throw new Error('Files sidebar is not visible');
  const rows = [...panel.querySelectorAll('.file-row')];
  const paths = ['sample.ts', 'sample.py', 'sample.ps1', 'sample.unknown', 'long.txt', 'recorded.txt', 'empty.txt', 'deleted.txt', 'unavailable.txt', 'fragment.txt', 'index.html'];
  if (rows.length !== paths.length || panel.querySelector('.file-tabs, .file-view-controls, [role="tablist"]')) throw new Error('Files must be a vertical collapsible list');
  window.__fileDiffVerify = async index => {
    const path = paths[index];
    if (!rows[index].textContent.includes(path)) throw new Error('file path missing');
    if (rows[index].getAttribute('aria-expanded') !== 'true') rows[index].click();
    await new Promise(resolve => setTimeout(resolve, 200));
    if (rows[index].getAttribute('aria-expanded') !== 'true' || rows.filter(row => row.getAttribute('aria-expanded') === 'true').length !== 1) throw new Error('file expansion did not select this path');
    if (index < 6 && !panel.querySelector('.diff-row.full-file')) throw new Error('complete file with inline diff is missing');
    const content = [...panel.querySelectorAll('.diff-row.full-file:not(.remove)')];
    if (index < 6 && (!content.length || content.some(row => !row.querySelector('.line-number')))) throw new Error('complete content or line numbers missing');
    if (index < 3) {
      const deadline = Date.now() + 4000;
      while (Date.now() < deadline && !panel.querySelector('.diff-token[style*="--shiki-light"]')) await new Promise(resolve => setTimeout(resolve, 50));
      const colored = [...panel.querySelectorAll('.diff-token[style*="--shiki-light"]')];
      if (!colored.length || !colored.every(token => token.style.getPropertyValue('--shiki-dark'))) throw new Error('syntax styles missing: ' + path);
      if (new Set(colored.map(token => getComputedStyle(token).color)).size < 2) throw new Error('syntax has one color: ' + path);
      const mode = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      const probe = document.createElement('span'); probe.style.color = colored[0].style.getPropertyValue('--shiki-' + mode); panel.append(probe);
      if (getComputedStyle(colored[0]).color !== getComputedStyle(probe).color) throw new Error('wrong syntax theme'); probe.remove();
    }
    if (index === 3) {
      if (!panel.querySelector('.diff-table').textContent.includes('<script>alert("raw text")</script>') || panel.querySelector('code script')) throw new Error('literal source was interpreted');
      if ([...panel.querySelectorAll('.diff-token')].some(token => token.style.cssText)) throw new Error('unknown language is not plaintext');
    }
    if (index === 4) {
      const viewport = panel.querySelector('.file-content-scroll .ui-scroll-area-viewport');
      if (content.length !== 100 || viewport.clientHeight > 420 || viewport.scrollHeight <= viewport.clientHeight) throw new Error('long file did not use a bounded scroll area');
      if (getComputedStyle(content[0].querySelector('code')).whiteSpace !== 'pre' || content[0].getBoundingClientRect().height > 21 || viewport.scrollWidth <= viewport.clientWidth || content[0].querySelectorAll('.line-number').length !== 1) throw new Error('source wrapped or retained duplicate line numbers');
      viewport.scrollLeft = viewport.scrollWidth;
      await new Promise(resolve => requestAnimationFrame(resolve));
      if (viewport.scrollLeft <= 0 || !content[0].querySelector('code').textContent.endsWith('END')) throw new Error('long source cannot scroll horizontally');
      viewport.scrollLeft = 0;
      viewport.scrollTop = viewport.scrollHeight;
      await new Promise(resolve => requestAnimationFrame(resolve));
      if (!content.at(-1).textContent.includes('recorded line 100') || content.at(-1).getBoundingClientRect().bottom > viewport.getBoundingClientRect().bottom + 2) throw new Error('last recorded line is unreachable');
    }
    if (index === 5) {
      if (!panel.querySelector('.diff-row.remove')?.textContent.includes('two') || !panel.querySelector('.diff-row.add')?.textContent.includes('TWO')) throw new Error('inferred content lost inline edit markers');
      if (content.map(row => row.querySelector('code').textContent).join('\n') !== 'one\nTWO\nthree\nFOUR') throw new Error('edited inferred content lost unchanged lines');
      if (panel.querySelector('.revert-button')) throw new Error('undo control remains');
    }
    if (index >= 6 && index < 9) {
      const zh = document.documentElement.lang === 'zh' || panel.textContent.includes('所选分支');
      const expected = index === 6 ? (zh ? '此文件为空' : 'This file is empty') : index === 7 ? (zh ? '此文件已删除' : 'This file was deleted') : (zh ? '无法推算完整文件内容' : 'Inferred file content is unavailable');
      if (content.length || !panel.textContent.includes(expected)) throw new Error('wrong empty/deleted/unreadable state: ' + path);
    }
    if (index === 9) {
      if (panel.querySelector('.diff-row.full-file') || [...panel.querySelectorAll('.line-number')].some(row => row.textContent.trim())) throw new Error('fragments claimed full content or file offsets');
      const sidebar = document.querySelector('#checkpoint-flow-panel');
      const previousWidth = sidebar.style.width;
      sidebar.style.width = '260px';
      await new Promise(resolve => requestAnimationFrame(resolve));
      for (const row of panel.querySelectorAll('.diff-row')) {
        const offset = row.querySelector('code').getBoundingClientRect().left - row.getBoundingClientRect().left;
        if (offset > 24 || row.querySelector('.line-number')) throw new Error('unknown-offset fragments reserve empty line-number gutters');
      }
      sidebar.style.width = previousWidth;
      if (![...panel.querySelectorAll('.diff-row code')].map(row => row.textContent).join('\n').includes('new fragment')) throw new Error('fragment inference missing');
      if (!panel.textContent.includes('unknown') && !panel.textContent.includes('未知')) throw new Error('fragment uncertainty missing');
    }
    if (index === 10) {
      const source = content.map(row => row.querySelector('code').textContent).join('\n');
      if (content.length !== 6 || !source.includes('.car{color:red;transform:translateX(10px)}'.repeat(1000)) || !source.endsWith('</script></body></html>')) throw new Error('minified HTML source was truncated');
      if (panel.querySelector('.diff-token')) throw new Error('oversized HTML should bypass syntax spans');
      if (panel.querySelectorAll('.diff-row.add').length !== 6) throw new Error('minified HTML lost added-line markers');
      const viewport = panel.querySelector('.file-content-scroll .ui-scroll-area-viewport');
      viewport.scrollLeft = viewport.scrollWidth;
      await new Promise(resolve => requestAnimationFrame(resolve));
      if (viewport.scrollLeft <= 0) throw new Error('minified source cannot scroll horizontally');
      rows[index].click(); await new Promise(resolve => setTimeout(resolve, 50));
      if (panel.querySelector('.diff-table')) throw new Error('minified file did not collapse');
      rows[index].click(); await new Promise(resolve => setTimeout(resolve, 50));
      if (panel.querySelectorAll('.diff-row.add').length !== 6) throw new Error('minified file did not reopen');
    }
    return 'inferred file verified: ' + path;
  };
  return 'file assertions ready';
})()'''

[[step]]
