[[step]]
action = "eval"
script = '''(async () => {
  const {assert, settle, check, noFilter} = window.__topbarSurfaceProbe;
  const compiled = await (await fetch('/src/routes/remote/+page.svelte')).text();
  const runtime = /import \{ onMount \} from "([^"]+)"/.exec(compiled)?.[1];
  assert(runtime, 'Svelte runtime missing');
  const {mount, unmount} = await import(runtime);
  const {default: Surface} = await import('/src/lib/devFixtures/TopbarSurfaceStability.svelte');
  const host = document.createElement('div');
  document.body.append(host);
  let instance;
  const close = () => { if (instance) {unmount(instance); instance = null;} };
  const open = () => {instance = mount(Surface, {target:host, props:{onClose:close}});};
  try {
    for (let cycle = 0; cycle < 2; cycle++) {
      open();
      await settle();
      noFilter(document.querySelector('.fullscreen-surface-backdrop'));
      check();
      document.querySelector('.fullscreen-surface-close').click();
      await settle();
      assert(!document.querySelector('.fullscreen-surface'), 'Management surface did not close');
      check();
    }
    open();
    await settle();
    window.__topbarSurfaceCleanup = async () => {
      close(); await settle(); host.remove(); delete window.__topbarSurfaceProbe;
    };
    return {menus:5, menuCycles:2, managementCycles:2, geometryStable:true, backdropFilter:'none'};
  } catch (error) {
    close(); host.remove(); throw error;
  }
})()'''
