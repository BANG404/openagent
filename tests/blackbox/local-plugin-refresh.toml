[scenario]
name = "local plugin source and manual refresh"
fail_fast = true
global_timeout_ms = 30000

[[step]]
name = "source association is visible and Refresh synchronizes the installed package"
action = "eval"
script = '''(async () => {
  const card = document.querySelector('.plugin-accordion-item[data-plugin-id="local-refresh-fixture"]');
  if (!card) throw new Error('local plugin card is missing');
  const source = card.querySelector('[data-local-plugin-source]');
  if (!source || !/local source|本地源码/.test(source.textContent)) throw new Error('source association is not explained');
  const find = () => [...card.querySelectorAll('.plugin-accordion-footer button')]
    .find(button => /^(Refresh|刷新)$/.test(button.textContent.trim()));
  const deadline = Date.now() + 15000;
  while (Date.now() < deadline) {
    const control = find();
    if (control && !control.disabled) {
      control.click();
      await new Promise(resolve => setTimeout(resolve, 500));
      if (find() && !find().disabled) return true;
    }
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  throw new Error('manual Refresh never completed');
})()'''
