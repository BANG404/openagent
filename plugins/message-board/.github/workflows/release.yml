name: Release plugin

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create package archive
        run: |
          zip -r "message-board-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" ".github/*" "*.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "message-board-${GITHUB_REF_NAME}.zip" --generate-notes
