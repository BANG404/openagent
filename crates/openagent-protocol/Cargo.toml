[package]
name = "openagent-protocol"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Transport-independent OpenAgent protocol contracts and input routing"
publish = false

[features]
default = []
typescript = ["dep:ts-rs"]
test-api = ["dep:axum", "dep:tokio", "tokio/macros", "tokio/net", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "contract_api"
path = "examples/contract_api.rs"
required-features = ["test-api"]

[[example]]
name = "export_typescript"
required-features = ["typescript"]
