[package]
name = "openagent-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OpenAgent product orchestration over the standalone Runtime protocol"
publish = false

[dependencies]
openagent-protocol = { path = "../openagent-protocol" }
openagent-config = { path = "../openagent-config" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "test-util"] }
tempfile = "3"
